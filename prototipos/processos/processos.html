   de estoque, situação e ação. Isso é para ser denso, não estreito — mas cada
   pedaço estava ganhando uma linha própria, e três linhas por registro vezes
   vinte e seis pedidos é meia tela de ar.
   ============================================================================ */
/* "quem está com a peça": rótulo e valor na mesma linha */
.t td.tcell .p.cq,.t td.tcell .s.cq{display:flex;align-items:center;gap:7px;min-width:0;}
.cq-rot{font-size:var(--fs-nano);letter-spacing:.12em;font-weight:800;color:var(--ink-4);
  flex:0 0 auto;}
.t td.tcell .cq > b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;flex:1 1 auto;}
.t .cq .sel{padding:3px 8px;font-size:var(--fs-dado);min-width:0;}
.t .cq .sel-mini{padding:2px 6px;font-size:var(--fs-micro);}
/* O botão da ação PODE quebrar em duas linhas, e é de propósito: obrigá-lo a
   uma linha só faz a coluna exigir largura, e quem paga é a coluna do lado —
   "Malharia Lu" virou "M". Numa tabela de doze colunas, largura é um jogo de
   soma zero: o que um ganha, outro perde. Duas linhas dentro de um registro
   que já tem três não custam altura nenhuma. */

/* ============================================================================
   NÚMERO NÃO QUEBRA, CABEÇALHO NÃO PARTE PALAVRA
   ----------------------------------------------------------------------------
   Na Demanda o cabeçalho saía "PEDIDO / S" e "NECESSIDAD / E", e o mínimo
   ajustado saía "117 aj." cortado no meio. Número partido ao meio não é
   densidade, é erro de leitura: `1.200` que aparece como `1.20` muda a decisão
   de quem está olhando. Estas duas linhas valem para todas as tabelas, porque
   a regra é da tabela, não da tela.
   ============================================================================ */
table.t th{white-space:nowrap;}
table.t td.num,table.t td.num .s,table.t td.num b{white-space:nowrap;}

/* ============================================================================
   TABELA LARGA EM JANELA ESTREITA — rola a TABELA, não perde o dado
   ----------------------------------------------------------------------------
   Pedidos tem doze colunas e Demanda tem dezesseis. Em 1024px elas não cabem,
   e até aqui o que acontecia era o pior dos mundos: as colunas encolhiam até o
   número ser cortado no meio — `1.200` virando `1.20`, `117 aj.` virando
   `117 a`. Ninguém percebe que está lendo o valor errado.
   Console industrial resolve isso rolando a TABELA de lado dentro do cartão. A
   página continua sem rolagem horizontal (a `.tw` já é `overflow:auto`), o
   cabeçalho continua grudado no topo, e nenhum número desaparece.
   O piso é a soma das colunas: abaixo dele a tabela para de encolher.
   ============================================================================ */
/* O piso não é um número redondo: é a soma das colunas em pixel (792px)
   dividida pelo que sobra para as duas em porcentagem (33%). Abaixo disso o
   navegador espreme as porcentagens, e foi assim que `ATRASADA 57d` apareceu
   cortado em 1280px depois de eu ter apertado a coluna do SKU. */
.t-ped{min-width:1220px;}
.t-dem{min-width:1180px;}
.t-prod{min-width:860px;}   /* 10 colunas: SKU, produto, embalagem, processo, pacote, programado, loja, ação */

/* ============================================================================
   PRODUTOS EM GRADE — catálogo de fábrica, não vitrine
   ----------------------------------------------------------------------------
   A grade nasceu com azulejo de 190px e foto quadrada: seis produtos ocupavam
   uma tela inteira, e numa fábrica com centenas de SKUs isso é rolagem, não
   consulta. Pior: sem foto, o quadrado vira um retângulo cinza gigante escrito
   "sem foto" — meia tela de nada.
   A grade continua sendo grade (é ela que serve para reconhecer o produto pela
   imagem), mas em escala de console: azulejo menor, foto em 4:3, e o vazio da
   foto reduzido a uma faixa, porque ausência de foto não é informação que
   mereça o tamanho da foto.
   ============================================================================ */
.cards{grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px;padding:12px;}
.pcard img{aspect-ratio:4/3;}
.pcard .ph{aspect-ratio:16/7;font-size:var(--fs-nano);}
.pcard .body{padding:7px 9px 9px;}

/* ============================================================================
   TAREFAS — a lista do dia, não uma vitrine de miniaturas
   ----------------------------------------------------------------------------
   Cada tarefa carregava um quadrado de 44px escrito "sem foto". Com zero fotos
   cadastradas, a coluna inteira virava uma fileira de caixas cinzas dizendo que
   não havia nada para ver — 44px de altura mínima por linha para informar uma
   ausência. A miniatura continua quando existe foto (é ela que faz reconhecer a
   peça de relance); quando não existe, ela some e a linha encolhe.
   ============================================================================ */
.lista-tarefas .foto-ph,.mt .foto-ph{display:none;}
.lista-tarefas .tarefa{padding:11px 14px;gap:13px;}
.lista-tarefas .tarefa .meta{line-height:1.5;}
.lista-tarefas .tarefa .acao{min-width:138px;gap:5px;}

/* ============================================================================
   ESTADO VAZIO — explicação com medida de leitura, não de coluna de jornal
   ----------------------------------------------------------------------------
   A explicação do "ainda não há insumos" quebrava em cinco linhas curtas no
   meio de um cartão de 1600px: "compra para produzir —" numa linha, "vende."
   sozinho na outra. 470px é medida de parágrafo de texto corrido; uma
   explicação de três frases dentro de um console pede uma medida maior e menos
   quebras. 68 caracteres é o limite clássico de leitura confortável.
   ============================================================================ */
.empty p{max-width:68ch;}
.empty{padding:44px 26px;}
/* `vazio()` usa `.vaz`, que tinha 44ch — medida de legenda, não de
   explicação. A mesma regra vale para os dois. */
.vaz p{max-width:62ch;}

/* ============================================================================
   NO TELEFONE
   ----------------------------------------------------------------------------
   Três coisas que só apareceram medindo a tela de 390px:

   1. O CABEÇALHO DO CARTÃO virava coluna. Título, legenda e botão dividiam a
      largura em três, e a legenda de oito palavras descia em nove linhas de uma
      palavra. Abaixo de 720px eles empilham: título, legenda, botão.

   2. A TABELA DO HOJE esmagava as colunas até o nome do produto quebrar em três
      linhas por pedido. Mesma decisão que Pedidos e Demanda: a tabela rola de
      lado dentro do cartão, e a linha continua sendo uma linha.

   3. A BARRA DE ESTADO no topo empilhava quatro etiquetas de referência antes
      de qualquer dado aparecer. "Prazo típico 12d" é consulta, não alarme: ele
      sai no telefone. A idade do estoque FICA — ela é aviso, e aviso não se
      esconde por falta de espaço.
   ============================================================================ */
@media (max-width:720px){
  .card-h{flex-direction:column;align-items:stretch;gap:5px;}
  .card-h .btn,.card-h .seg{margin-left:0 !important;align-self:flex-start;}
}
@media (max-width:560px){
  .topbar .right > .tag:not(.amber):not(.perigo){display:none;}
  .topbar{padding:var(--sp2) var(--sp3);}
}

/* A LINHA DE CONTEXTO DO SKU — curva, setor, processo e a lupa.
   Ela quebrava em duas linhas quando o setor tinha nome comprido ("Bandana e
   Laço Tecido"), e uma terceira linha no registro inteiro custa 21px em vinte e
   seis pedidos. Agora ela é uma linha só: os nomes cedem com reticências, a
   curva e a lupa nunca cedem (uma é código de uma letra, a outra é alvo de
   clique), e a linha inteira está no `title`. */
.t-ped td.tcell .s.s-contexto{flex-wrap:nowrap !important;overflow:hidden;min-width:0;}
.t-ped td.tcell .s.s-contexto .s-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
/* Quem cede é o SETOR, que é nome comprido e repetido; o PROCESSO fica
   inteiro, porque é ele que diz o que a peça é, e cabe em oito letras. */
.t-ped td.tcell .s.s-contexto .abc,.t-ped td.tcell .s.s-contexto .lupa,
.t-ped td.tcell .s.s-contexto .s-fixo{flex:0 0 auto;white-space:nowrap;}

/* O grupo de ações da barra de filtros tem `margin-left:auto` para colar na
   direita — e no telefone isso empurrava "Novo pedido" para fora da tela, meio
   botão visível. Abaixo de 720px ele quebra em linha própria e enche a largura:
   botão pela metade não é botão. */
@media (max-width:720px){
  .fb-grupo{margin-left:0 !important;flex-wrap:wrap;width:100%;}
  .fb-grupo .btn{flex:1 1 auto;justify-content:center;}
}

/* ============================================================================
   AS JANELAS NO TELEFONE
   ----------------------------------------------------------------------------
   `.modal-b` limita o CORPO a 72vh, mas cabeçalho e rodapé ficam de fora da
   conta: numa tela de 844px a janela de "revisar mínimo" fechava em 852px —
   oito pixels para fora, com o rodapé (onde mora o botão que resolve) abaixo da
   dobra e sem rolagem que o alcance.
   O teto passa a ser da JANELA INTEIRA, e é o corpo que cede.
   ============================================================================ */
@media (max-width:720px){
  .modal{max-height:calc(100vh - 24px);display:flex;flex-direction:column;}
  .modal-b{max-height:none;flex:1 1 auto;min-height:0;overflow:auto;}
  .modal-h,.modal-f{flex:0 0 auto;}
  .modal-f{flex-wrap:wrap;gap:6px;}
  .modal-f .btn{flex:1 1 auto;justify-content:center;}
}

/* ============================================================================
   PASSE C · RÓTULO DE FILTRO E CONTEXTO DE IMPORTAÇÃO
   ----------------------------------------------------------------------------
   `.flabel` ("PERÍODO", "FILTROS", "FLUXO") dava 4,45 sobre a barra de filtros —
   quatro centésimos abaixo do mínimo, em letra de 9px maiúscula. Não é
   perfeccionismo: é a legenda que diz o que o grupo de chips ao lado significa,
   e 9px maiúsculo já é o tamanho mais difícil da tela. Sobe um degrau de tinta.
   ============================================================================ */
.flabel{color:var(--ink-3);}

/* Na aba Dados, o botão de exportar nascia colado à direita de um bloco que não
   quebra, e no telefone metade dele ficava fora da tela. Mesma regra do grupo
   de ações da barra de filtros: abaixo de 720px ele enche a largura. */
@media (max-width:720px){
  .page .btn[data-act^="exp-"]{width:100%;justify-content:center;}
}

/* ============================================================================
   PASSE C · A ENTRADA
   ----------------------------------------------------------------------------
   O chão da entrada SEGUE O TEMA, como qualquer outra tela: claro no claro,
   navy no escuro. Eu tinha travado navy nos dois por analogia com o trilho —
   mas o trilho é cromo dentro do app, e a entrada é a tela inteira. Tela
   inteira escura em quem escolheu tema claro é a preferência da pessoa sendo
   ignorada logo na primeira tela do dia.
   Nada aqui é valor literal: `--canvas` e `--surface-2` já são o chão e o
   degrau acima dele em cada tema, e é só com eles que o gradiente é feito.
   ============================================================================ */
.auth{background:
  radial-gradient(1200px 680px at 50% -22%, var(--surface-2) 0%, transparent 66%),
  var(--canvas);}
.auth-card{box-shadow:var(--sh-3);}
/* a arte do logotipo acompanha o CARTÃO, que é onde ele fica — e o cartão
   segue o tema. `--logo-auth` é quem decide: arte escura no claro, clara no
   escuro. */
.auth-logo{background-image:var(--logo-auth);}
/* o rodapé da entrada está sobre o chão da PÁGINA, então usa tinta de página,
   que vira com o tema — e não a tinta do trilho, que é sempre sobre navy */
.auth-foot{color:var(--ink-4);}
.auth-foot b{color:var(--ink-3);}
/* ---------- o crédito de quem fez ----------
   Discreto e presente: uma linha abaixo da assinatura da empresa. Ele aparece
   em dois lugares com fundos diferentes — sobre o chão da página, na entrada,
   e sobre o navy do trilho, dentro do app — então a tinta é declarada nos dois
   contextos, e não uma vez só.
   O `desenvolvido por:` é texto por definição. O nome da SINAL fica em
   `.sinal-marca`: hoje é texto, e vira imagem trocando UMA linha (o
   `background-image` do bloco abaixo) quando o arquivo da marca chegar. Não se
   desenha a marca de ninguém em CSS. */
.sinal{display:flex;align-items:center;justify-content:center;gap:7px;
  margin-top:6px;font-size:var(--fs-micro);letter-spacing:.04em;}
/* `desenvolvido por:` é texto. O nome da SINAL é a MARCA DELA — imagem, não
   letra: recriar a marca de alguém em CSS é desenhar outra marca. */
.sinal-marca{display:block;width:62px;height:22px;flex:0 0 62px;
  background:var(--logo-sinal) left center/contain no-repeat;}
.auth-foot .sinal{color:var(--ink-4);}
.rail-foot .sinal{margin:9px 0 0;font-size:var(--fs-nano);color:var(--rail-txt-2);}
/* o trilho é navy nos dois temas, então lá a arte é sempre a clara */
.rail-foot .sinal-marca{background-image:var(--logo-sinal-trilho);
  width:56px;height:20px;flex:0 0 56px;}
.shell.mini .rail-foot .sinal{display:none;}

/* ============================================================================
   PASSE C · ACESSIBILIDADE
   ----------------------------------------------------------------------------
   O FOCO DO TECLADO tem de ser visível em TUDO. A regra geral põe um anel de
   sombra no `:focus-visible` — mas o botão primário tem sombra própria, e a
   sombra própria ganhava: quem navega por Tab passava pelo botão principal da
   tela sem nada acontecer na imagem. Aqui o anel vem com contorno de verdade,
   que sombra nenhuma sobrescreve, e com `outline-offset` para não sumir dentro
   do próprio botão preenchido.
   ============================================================================ */
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,
.ic-btn:focus-visible,.lupa:focus-visible,
.barra-mob button:focus-visible,.nav button:focus-visible,
.pcard:focus-visible,.kpi.clicavel:focus-visible{
  outline:2px solid var(--coral);outline-offset:2px;}
.nav button:focus-visible,.barra-mob button:focus-visible{outline-color:var(--rail-acento);}

/* ---------- segundo fator · o campo do código ----------
   Seis números lidos de um celular e digitados aqui: o que ajuda é caractere
   largo, espaçado e alinhado ao centro — não é um campo de texto comum. */
.mfa-cod{font-family:var(--mono,ui-monospace,SFMono-Regular,Menlo,monospace);
  font-size:26px;letter-spacing:.34em;text-align:center;padding-block:12px;
  text-indent:.34em;}
.mfa-fatores{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  margin-bottom:var(--sp3);}
.auth-nota.mfa-erro{color:var(--perigo);font-weight:600;}
@media (max-width:520px){ .mfa-cod{font-size:22px;letter-spacing:.26em;text-indent:.26em;} }

/* ---------- cadastro do autenticador ---------- */
.mfa-qr{display:flex;justify-content:center;margin-bottom:var(--sp3);}
.mfa-qr-img{width:190px;height:190px;display:block;padding:10px;border-radius:var(--r2);
  background:#FFFFFF;border:1px solid var(--linha);}
.mfa-qr-img svg,.mfa-qr-img img{width:100%;height:100%;display:block;}
.mfa-chave{margin:0 0 var(--sp3);text-align:center;}
.mfa-chave summary{cursor:pointer;font-size:var(--fs-micro);color:var(--ink-3);}
.mfa-segredo{display:block;margin-top:6px;padding:8px 10px;border-radius:var(--r1);
  background:var(--surface-2);border:1px solid var(--linha);
  font-family:var(--mono,ui-monospace,SFMono-Regular,Menlo,monospace);
  font-size:15px;letter-spacing:.12em;color:var(--ink);user-select:all;word-break:break-all;}
.mfa-lista{list-style:none;margin:0 0 var(--sp3);padding:0;display:grid;gap:6px;}
.mfa-lista li{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--r1);
  background:var(--surface-2);border:1px solid var(--linha);font-weight:600;color:var(--ink);}
.mfa-ok{color:var(--ok);font-weight:700;}
@media (max-width:520px){ .mfa-qr-img{width:164px;height:164px;} }
.mfa-esperando{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;position:relative;}
.mfa-esperando::after{content:"";position:absolute;inset:0;width:40%;border-radius:2px;
  background:var(--acao-cheio);animation:mfa-vai 1.1s ease-in-out infinite;}
@keyframes mfa-vai{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){ .mfa-esperando::after{animation:none;width:100%;opacity:.5;} }

/* ============================================================================
   UNIR PRODUTOS · a lista de achados e a janela de confirmação
   ----------------------------------------------------------------------------
   Cada achado da busca oferece DUAS ações que fazem coisas muito diferentes:
   "base histórica" só projeta; "unir" mexe no cadastro. Por isso a de unir é
   botão cheio e a outra é fantasma — o peso visual conta o que cada uma custa.
   ============================================================================ */
.fest-achado{display:flex;align-items:center;gap:var(--sp3);flex-wrap:wrap;
  padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);
  background:var(--surface);}
.fest-achado-sku{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0;
  font-size:var(--fs-dado);}
.fest-achado-sku span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fest-achado-bts{display:flex;gap:6px;flex:0 0 auto;}
@media (max-width:620px){
  .fest-achado{align-items:stretch;flex-direction:column;gap:7px;}
  .fest-achado-bts{width:100%;}
  .fest-achado-bts .btn{flex:1;justify-content:center;}
}
/* os dois lados da união, lado a lado — a seta diz quem vira quem */
.uniao-par{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--sp3);align-items:stretch;}
.uniao-lado{display:flex;flex-direction:column;gap:4px;align-items:flex-start;
  padding:var(--sp3);border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface-2);min-width:0;}
.uniao-lado.atual{border-color:var(--ok);background:var(--ok-fundo);}
.uniao-rot{font-size:var(--fs-nano);font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-4);}
.uniao-lado b.sku{font-size:var(--fs-h3);}
.uniao-desc{font-size:var(--fs-apoio);color:var(--ink-3);line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;width:100%;}
.uniao-seta{display:grid;place-items:center;color:var(--ink-4);}
.uniao-seta svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}
.uniao-lista{margin:0;padding-left:18px;font-size:var(--fs-corpo);line-height:1.65;color:var(--ink-2);}
.uniao-lista li{margin-bottom:5px;}
@media (max-width:560px){
  .uniao-par{grid-template-columns:1fr;}
  .uniao-seta{transform:rotate(90deg);}
}
/* v8.98 · a comparação dos dois selecionados e a pergunta de quem fica */
.uniao-cmp th[scope="row"]{text-align:left;font-weight:600;color:var(--ink-3);white-space:nowrap;}
.uniao-cmp td{vertical-align:top;}
.uniao-cmp thead th{font-size:var(--fs-dado);}
.uniao-pergunta{margin:14px 0 0;padding:0;border:0;}
.uniao-pergunta legend{font-weight:700;font-size:var(--fs-corpo);margin-bottom:8px;}
.uniao-opcao{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;margin-bottom:6px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;}
.uniao-opcao input{margin-top:3px;}
.uniao-opcao.nao{opacity:.62;cursor:not-allowed;}
.uniao-opcao .hint{display:block;margin:2px 0 0;}

/* ---------- amostra Processos · só o que o app ainda não tem ----------
   Cor, raio e tipo vêm dos tokens do app (tokens.css). */
.nav button.pr-off{opacity:.42;cursor:not-allowed;}
.pc-tab tbody tr.pc-lin{cursor:pointer;}
.pc-tab tbody tr.pc-lin:hover td{background:var(--surface-2);}
.pc-tab td{vertical-align:top;}
.pc-subs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.pc-campos-res{max-width:420px;}
.pc-cp{display:inline-block;margin:0 4px 4px 0;padding:1px 8px;border:1px solid var(--line);border-radius:var(--r-pill);font-size:var(--fs-micro);color:var(--ink-2);}
.pc-cp.t-grupo{border-color:var(--teal);color:var(--teal);font-weight:700;}
.pc-cp i{font-style:normal;font-weight:500;color:var(--ink-3);}
.pr-n{flex:0 0 20px;font-weight:700;color:var(--ink-3);}
.pc-erros{margin:10px 0;padding:10px 14px;border-radius:var(--r-3);background:var(--perigo-fundo);color:var(--perigo);font-size:var(--fs-apoio);}
.pc-erros ul{margin:4px 0 0;padding-left:18px;}
.pc-cab{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}

/* classificações */
.pc-cls{display:flex;flex-direction:column;gap:6px;}
.pc-cl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.pc-cl-n{flex:0 0 130px;font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);}
.pc-clgrade{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:14px;}
.pc-clcard{border:1px solid var(--line);border-radius:var(--r-3);padding:12px;background:var(--surface);}
.pc-clcard.nova{border-style:dashed;}
.pc-clcard-h{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.pc-clcard-h .inp{flex:1;font-weight:700;}
.pc-lin-add{display:flex;gap:6px;}
.pc-lin-add .inp{flex:1;}

/* construtor */
.bc-lista{display:flex;flex-direction:column;gap:8px;}
.bc-campo{border:1px solid var(--line);border-radius:var(--r-3);padding:9px 10px;background:var(--surface);}
.bc-campo.t-grupo{border-color:var(--teal);border-left-width:3px;}
.bc-lin{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.bc-n{flex:0 0 18px;font-weight:700;color:var(--ink-3);}
.bc-nome{flex:1 1 200px;min-width:0;font-weight:600;}
.bc-un{width:90px;}
.bc-acoes{display:inline-flex;gap:2px;margin-left:auto;}
.bc-rot{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-right:4px;}
.bc-ops{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 0 25px;}
.bc-op{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-pill);padding:1px 4px 1px 2px;background:var(--surface-2);}
.bc-op .inp{border:0;background:transparent;padding:3px 6px;width:auto;min-width:40px;field-sizing:content;max-width:180px;}
.bc-op button{border:0;background:none;color:var(--ink-3);cursor:pointer;padding:0 4px;font-size:14px;line-height:1;}
.bc-op button[disabled]{opacity:.25;cursor:default;}
.bc-op.nova{border-style:dashed;background:transparent;}
.bc-op.nova .inp{width:110px;}
.bc-sub{margin:10px 0 2px 25px;padding:10px;border-radius:var(--r-3);background:var(--surface-2);display:flex;flex-direction:column;gap:8px;}
.bc-rotulo{max-width:260px;}
.bc-add{display:flex;gap:6px;align-items:center;margin-top:10px;}

/* formulário dinâmico */
.pc-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px;align-items:start;}
.pc-form .fld > span{display:block;margin-bottom:5px;}
.pc-bloco,.pc-largo{grid-column:1 / -1;}
.pc-bloco{border:1px solid var(--line);border-radius:var(--r-3);padding:10px 12px;}
.pc-grupo{border-color:var(--teal);border-left-width:3px;}
.pc-bloco-h{display:flex;gap:10px;align-items:baseline;margin-bottom:8px;}
.pc-bloco-h h4,.pc-como-h h3{margin:0;}
.pc-bloco-h h4{font-size:var(--fs-apoio);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);}
.pc-item{border:1px solid var(--line-2);border-radius:var(--r-2);padding:8px 10px 10px;margin-bottom:8px;background:var(--surface-2);}
.pc-item-h{display:flex;gap:4px;align-items:center;margin-bottom:6px;}
.pc-item .pc-form{gap:8px 12px;}
.pc-passo{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.pc-passo .inp{flex:1;}
.pc-ob{color:var(--perigo);}
.pc-un-w{display:flex;align-items:center;gap:6px;}
.pc-un-w .inp{flex:1;min-width:0;width:100%;}
.pc-un{font-size:var(--fs-apoio);color:var(--ink-3);font-weight:600;}
.pc-chips{display:flex;gap:5px;flex-wrap:wrap;}
.pc-sku-h{font-size:var(--fs-micro);color:var(--ink-3);margin-top:3px;}
.pc-form .inp,.pc-form .sel{width:100%;}
.seg button.on{background:var(--coral);color:var(--em-coral);}

/* escolher processo / padrão */
.pc-escolha{display:flex;flex-direction:column;gap:8px;}
.pc-esc{border:1px solid var(--line);border-radius:var(--r-3);padding:10px 12px;}
.pc-esc-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.pc-esc-b{display:flex;gap:6px;flex-wrap:wrap;}

/* produto */
.pr-cadastro{display:grid;grid-template-columns:repeat(3,auto) 1fr;gap:6px 22px;align-items:end;padding:12px 14px;border:1px dashed var(--line);border-radius:var(--r-3);background:var(--surface-2);}
.pr-cadastro span{display:block;font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;}
.pc-como{margin-top:18px;}
.pc-como-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px;}
.pc-como-h h3{font-size:var(--fs-h2);text-transform:uppercase;letter-spacing:.04em;}
.pc-cfg{border:1px solid var(--line);border-radius:var(--r-3);padding:10px 12px;margin-bottom:8px;background:var(--surface);}
.pc-cfg-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.pc-cfg-r{margin:6px 0 8px 32px;font-size:var(--fs-apoio);color:var(--ink-2);}
.pc-cfg-a{display:flex;gap:6px;flex-wrap:wrap;margin-left:32px;}
.pf-num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--teal);color:var(--em-acao, #fff);font-weight:800;font-size:12px;flex:0 0 24px;}

/* a ficha na tela (o mesmo desenho do papel) */
.pf-tela .pf-proc h2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px;font-size:var(--fs-h2);}
.pf-meta{display:inline-flex;gap:4px;margin-left:6px;}
.pf-tela .pf-kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 18px;margin:0 0 14px;}
.pf-tela .pf-kv dt{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;}
.pf-tela .pf-kv dd{margin:2px 0 0;}
.pf-tela .pf-bl{margin-bottom:14px;}
.pf-tela .pf-bl h4{margin:0 0 6px;font-size:var(--fs-apoio);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);display:flex;gap:6px;align-items:center;}
.pf-cont{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 5px;border-radius:var(--r-pill);background:var(--slate-soft);font-size:11px;}
.pf-tela .pf-grp{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:var(--r-2);}
.pf-tela .pf-grp th,.pf-tela .pf-grp td{padding:6px 10px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top;}
.pf-tela .pf-grp thead th{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);background:var(--surface-2);}
.pf-tela .pf-grp tbody th{white-space:nowrap;color:var(--teal);}
.pf-tela .pf-passos{margin:0;padding-left:22px;line-height:1.8;}
.pf-tela .pf-passos .cx{display:inline-block;width:12px;height:12px;border:1.6px solid var(--ink-3);border-radius:3px;margin-right:8px;vertical-align:-1px;}
.pf-tela .pf-longo{margin:0;white-space:pre-wrap;}
.pf-ins{color:var(--ink-3);font-size:.92em;}

/* ---------- rodada 3 · uso no dia a dia ---------- */
/* o ícone do botão dentro do "vazio" não é o ícone grande do vazio (os dois têm a classe .ic) */
.empty .btn .ic{width:15px;height:15px;margin:0;background:none;border-radius:0;display:inline-block;}

/* "Usado por N produtos · Ver produtos" */
.pc-uso{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;}
.pc-uso-cab{margin:8px 0 0;}
.pc-nowrap{white-space:nowrap;}
.pc-uso-a{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
/* medida: valor e unidade juntos */
.pc-un-sel{flex:0 0 auto;width:auto !important;min-width:64px;}
.bc-un-n{padding:3px 6px;font-weight:700;font-family:var(--ff-mono);}

/* criar classificação sem sair da janela */
.pc-cl-nova{margin:4px 0 6px;padding:12px;border:1px dashed var(--teal);border-radius:var(--r-3);background:var(--surface-2);}
.pc-cl-nova textarea{width:100%;resize:vertical;}
.pc-cl-nova-a{display:flex;justify-content:flex-end;gap:6px;margin-top:8px;}
.pc-cl .bc-op.nova .inp{width:90px;}

/* o caminho em três passos */
.pc-guia{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.pc-passo-g{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-3);background:var(--surface);cursor:pointer;color:inherit;font:inherit;}
.pc-passo-g:hover{border-color:var(--teal);background:var(--surface-2);}
.pc-passo-g b{display:block;font-size:var(--fs-h3);}
.pc-passo-g small{display:block;color:var(--ink-3);font-size:var(--fs-apoio);margin-top:2px;}
.pc-g-n{display:grid;place-items:center;flex:0 0 34px;height:34px;border-radius:50%;background:var(--teal);color:var(--em-acao,#fff);font-weight:800;font-size:16px;}

/* construtor: tipo de campo com ícone, e a grade de escolha */
.bc-ic{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 5px;border-radius:var(--r-2);background:var(--slate-soft);color:var(--ink-2);font:700 11px/1 var(--ff-mono);}
.bc-campo.t-grupo > .bc-lin .bc-ic{background:var(--teal);color:var(--em-acao,#fff);}
.bc-picker{margin-top:10px;padding:12px;border:1px dashed var(--teal);border-radius:var(--r-3);background:var(--surface-2);}
.bc-picker-h{display:flex;align-items:center;margin-bottom:10px;}
.bc-picker-h .btn{margin-left:auto;}
.bc-picker-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;}
.bc-tp{display:flex;gap:10px;align-items:center;text-align:left;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-2);background:var(--surface);cursor:pointer;color:inherit;font:inherit;min-height:52px;}
.bc-tp:hover,.bc-tp:focus-visible{border-color:var(--teal);}
.bc-tp b{display:block;font-size:var(--fs-apoio);}
.bc-tp small{display:block;color:var(--ink-3);font-size:var(--fs-micro);}
.bc-tp.t-grupo{border-color:var(--teal);}
.bc-tp.t-grupo .bc-ic{background:var(--teal);color:var(--em-acao,#fff);}

/* "alterado neste produto" */
.pc-dif{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:1px 4px 1px 8px;border-radius:var(--r-pill);background:var(--atencao-fundo);color:var(--atencao);
  font-size:var(--fs-micro);font-weight:700;text-transform:none;letter-spacing:0;vertical-align:1px;}
.pc-dif.novo{background:var(--acao-fundo);color:var(--acao);padding-right:8px;}
.pc-dif button{border:0;background:var(--surface);color:var(--ink-2);border-radius:var(--r-pill);padding:1px 7px;font:inherit;font-weight:700;cursor:pointer;}
.pc-dif button:hover{color:var(--teal);}
.pc-dif-res{margin:-4px 0 12px;font-size:var(--fs-apoio);color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.pc-dif-res .pc-dif{margin-left:0;padding-right:8px;}

/* insumo: busca por SKU ou nome */
.pc-ins{position:relative;}
.pc-ins-sug{display:none;position:absolute;left:0;right:0;top:calc(100% - 18px);z-index:5;max-height:240px;overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-2);box-shadow:var(--sh-3);}
.pc-ins:focus-within .pc-ins-sug{display:block;}
.pc-ins-sug button{display:flex;gap:8px;width:100%;text-align:left;padding:8px 10px;border:0;background:none;color:inherit;font:inherit;cursor:pointer;border-bottom:1px solid var(--line-2);}
.pc-ins-sug button:hover{background:var(--surface-2);}
.pc-sku-h.fora{color:var(--atencao);font-weight:600;}

/* avisos com o próximo passo */
.pc-toast{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.pc-toast .btn{margin-left:auto;}

/* menu "Mais" do cartão do processo */
.pc-mais{position:relative;display:inline-block;}
.pc-menu{position:absolute;left:0;top:calc(100% + 4px);z-index:6;display:flex;flex-direction:column;min-width:220px;padding:4px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-2);box-shadow:var(--sh-3);}
.pc-menu button{display:flex;gap:8px;align-items:center;padding:9px 10px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:var(--r-1);}
.pc-menu button:hover{background:var(--surface-2);}
.pc-menu button.danger{color:var(--perigo);}
.pc-menu svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;}

/* ---------- MODO BANCADA: tela cheia, letra grande, alvo de toque ≥ 48px ---------- */
.pc-bov{padding:0;align-items:stretch;}
.pc-banc{display:flex;flex-direction:column;width:100%;height:100vh;height:100dvh;background:var(--bg,var(--surface));color:var(--ink);}
.pc-banc-h{display:flex;gap:12px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface);}
.pc-banc-id{display:flex;flex-direction:column;line-height:1.2;}
.pc-banc-id .mono{font-size:var(--fs-apoio);color:var(--ink-3);}
.pc-banc-id b{font-size:20px;}
.pc-banc-imp{margin-left:auto;display:flex;gap:6px;}
.pc-banc-tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface);}
.pc-banc-tabs button{display:flex;gap:8px;align-items:center;flex:0 0 auto;min-height:48px;padding:6px 16px 6px 8px;border:1px solid var(--line);border-radius:var(--r-pill);
  background:var(--surface);color:var(--ink-2);font:600 16px/1 var(--ff-corpo);cursor:pointer;}
.pc-banc-tabs button.on{background:var(--coral);border-color:var(--coral);color:var(--em-coral);}
.pc-banc-tabs button.on .pf-num{background:var(--em-coral);color:var(--coral);}
.pc-banc-b{flex:1;overflow:auto;padding:20px 22px 30px;font-size:18px;line-height:1.5;}
.bn-tit{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 18px;font-size:26px;}
.bn-tit .pf-num{width:34px;height:34px;flex-basis:34px;font-size:16px;}
.bn-kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:0 0 20px;}
.bn-kv > div{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-3);background:var(--surface);}
.bn-kv dt{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;}
.bn-kv dd{margin:4px 0 0;font-size:22px;font-weight:700;}
.bn-bl{margin-bottom:22px;}
.bn-bl h3{display:flex;gap:10px;align-items:center;margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);}
.bn-itens{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
.bn-item{border:2px solid var(--teal);border-radius:var(--r-3);padding:10px 14px 12px;background:var(--surface);}
.bn-item-h{font-weight:800;font-size:18px;color:var(--teal);margin-bottom:6px;}
.bn-lin{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line-2);}
.bn-lin:last-child{border-bottom:0;}
.bn-lin span{color:var(--ink-3);font-size:15px;}
.bn-lin b{text-align:right;}
/* SKU do insumo: o código numa linha, o nome embaixo — lido de relance na bancada */
.bn-lin .pf-ins,.bn-kv .pf-ins{display:block;font-weight:500;font-size:14px;color:var(--ink-3);}
.bn-passos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.bn-passos button{display:flex;gap:14px;align-items:center;width:100%;min-height:56px;padding:10px 14px;text-align:left;border:1px solid var(--line);border-radius:var(--r-3);
  background:var(--surface);color:inherit;font:inherit;cursor:pointer;}
.bn-passos button.feito{background:var(--ok-fundo);border-color:var(--ok);color:var(--ink-3);}
.bn-passos button.feito span:last-child{text-decoration:line-through;}
.bn-n{display:grid;place-items:center;flex:0 0 36px;height:36px;border-radius:50%;border:2px solid var(--ink-3);font-weight:800;font-size:16px;}
.feito .bn-n{background:var(--ok);border-color:var(--ok);color:var(--em-acao,#fff);}
.bn-longo{margin:0;white-space:pre-wrap;}
.pc-banc-f{display:flex;gap:10px;align-items:center;padding:10px 18px;border-top:1px solid var(--line);background:var(--surface);}
.pc-banc-f .hint{flex:1;text-align:center;}
.pc-banc-f .btn.grande{min-height:52px;}

@media (max-width:720px){
  .grid2{grid-template-columns:1fr;}
  .pr-cadastro{grid-template-columns:1fr 1fr;}
  .pc-cl-n{flex-basis:100%;}
  .search .inp{width:100% !important;}
  .search{flex:1 1 100%;}
  .bc-ops,.bc-sub{margin-left:0;}
  .pc-cfg-r,.pc-cfg-a{margin-left:0;}
  .pf-tela .pf-grp{display:block;overflow-x:auto;}
  .pc-guia{grid-template-columns:1fr;}
  .pc-banc-h{flex-wrap:wrap;padding:8px 12px;}
  .pc-banc-imp{width:100%;margin-left:0;}
  .pc-banc-tabs{padding:8px 12px;}
  .pc-banc-b{padding:14px 12px 24px;font-size:17px;}
  .bn-tit{font-size:22px;}
  .pc-banc-f{padding:8px 12px;}
  .pc-banc-f .hint{display:none;}
  .pc-banc-f .btn.grande{flex:1;justify-content:center;font-size:14px;}
}
/* tela baixa (celular deitado): cabeçalho numa linha só e barras mais finas, sobra altura para a instrução */
@media (max-height:520px){
  .pc-banc-h{flex-wrap:nowrap;padding:4px 10px;}
  .pc-banc-id b{font-size:16px;}
  .pc-banc-imp{width:auto;margin-left:auto;}
  .pc-banc-imp .btn{padding:4px 8px;}
  .pc-banc-tabs{padding:4px 10px;}
  .pc-banc-tabs button{min-height:40px;font-size:14px;}
  .pc-banc-f{padding:4px 10px;}
  .pc-banc-f .btn.grande{min-height:44px;padding:6px 12px;}

/* ---- da amostra ---- */
/* ===========================================================================
   AMOSTRA · Processos / Como fazer — construtor genérico de instruções
   ---------------------------------------------------------------------------
   Prova de conceito. Começa VAZIA: tudo é criado por quem usa e fica guardado
   só neste navegador (localStorage). Não fala com o servidor e não lê nem escreve produto,
   estoque, insumo, pedido, OP, demanda ou remessa. O SKU de insumo é texto de
   referência: diz QUAL material usar, não movimenta nada.

   NADA AQUI SABE O QUE É "FITA", "CHUCA" OU "BANDANA". Os nomes de processo,
   campo, opção e classificação são DADOS que a administradora cria. O código
   só conhece os TIPOS DE CAMPO abaixo.

   O MODELO
     Classificação   { nome, valores[] }                  criada por ela: ex. Gênero, Ângulo do corte
     Tipo de processo{ nome, classes, campos[] }          o formulário, montado por ela
       Campo         { nome, tipo, unidade, obrigatorio, opcoes[] | listaId, rotulo, campos[] }
     Lista de opções { nome, opcoes[] }                   compartilhada entre campos: editar a
                                                          lista muda o que TODOS esses campos oferecem
     Padrão          { nome, tipoId, classes, valores }   uma configuração salva
     Configuração    { sku, tipoId, valores, padraoId, base }
       Aplicar um padrão COPIA os valores para o produto. Depois disso cada
       configuração só muda por ela mesma: editar A não toca B nem o padrão, e
       editar o padrão não toca nenhum produto (isso é decisão futura).
   =========================================================================== */

IC.processos = '<path d="M4 6h10M4 12h16M4 18h7"/><circle cx="17" cy="6" r="2.2"/><circle cx="14" cy="18" r="2.2"/>';

const skuN = (x) => String(x == null ? "" : x).trim().toUpperCase(); /* a mesma regra de produtos/identidade.js */
let _seq = 0;
const novoId = (p) => `${p}${Date.now().toString(36)}${(++_seq).toString(36)}`;
const copia = (x) => JSON.parse(JSON.stringify(x));
const fdata = (iso) => { const d = new Date(iso); return isNaN(d) ? "—" : d.toLocaleDateString("pt-BR"); };
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;

/* ---------- os tipos de campo: a ÚNICA coisa que o código conhece ---------- */
/* `ic` e `ex` só servem à grade de escolha do construtor: dizem, de relance, para que o tipo serve */
const TIPOS_CAMPO = [
  { k: "texto", nome: "Texto", ic: "Aa", ex: "Número da fita, molde" },
  { k: "numero", nome: "Número", un: "", ic: "123", ex: "Voltas, pontos" },
  { k: "medida", nome: "Medida", ic: "↔", ex: "Comprimento: 20 cm, 25 mm, 6 un" },
  { k: "quantidade", nome: "Quantidade", un: "un", ic: "×", ex: "Peças por pacote" },
  { k: "selecao", nome: "Seleção única", op: true, ic: "◉", ex: "Ângulo de corte" },
  { k: "multipla", nome: "Seleção múltipla", op: true, ic: "☑", ex: "Etiquetas" },
  { k: "simnao", nome: "Sim / não", ic: "S/N", ex: "Usa cola quente?" },
  { k: "longo", nome: "Observação longa", ic: "¶", ex: "Observação geral" },
  { k: "sku", nome: "SKU de insumo", ic: "SKU", ex: "Qual elástico usar" },
  { k: "passos", nome: "Passo a passo", soRaiz: true, ic: "1·2·3", ex: "A ordem do trabalho" },

];
const TC = Object.fromEntries(TIPOS_CAMPO.map((t) => [t.k, t]));
const NUMERICOS = ["numero", "medida", "quantidade"];

/* ---------- construtores de dado (usados pela tela, não por dados prontos) ---------- */
const V = (id, nome) => ({ id, nome });
const C = (id, nome, tipo, x = {}) => ({ id, nome, tipo, obrigatorio: false, ...(TC[tipo].un != null ? { unidade: TC[tipo].un } : {}),
  ...(tipo === "medida" ? { unidades: ["cm"], unidadeFixa: true } : {}), ...x });
const G = (id, v) => ({ id, v });
const S = (id, t) => ({ id, t });

/* ---------- o que SIMULA outras partes do PCP ----------
   Produtos e insumos NÃO são configuração deste módulo: no PCP eles viriam do
   cadastro de Produtos e da aba Insumos, só para leitura. Aqui são poucos, com
   SKU "EX-" de propósito, para ninguém confundir com cadastro real. */
const PRODUTOS = [
  { sku: "EX-LACO-P", descricao: "Laço de exemplo P", categoria: "Laço" },
  { sku: "EX-GRAV-M", descricao: "Gravata de exemplo M", categoria: "Gravata" },
  { sku: "EX-GARG-M", descricao: "Gargantilha de exemplo M", categoria: "Gargantilha" },
  { sku: "EX-BAND-P", descricao: "Bandana de exemplo P", categoria: "Bandana" },
  { sku: "EX-CHUC-P", descricao: "Chuca de exemplo P", categoria: "Chuca" },
];
const INSUMOS = [
  { sku: "EX-FITA-05", nome: "Fita nº 5 (exemplo)" }, { sku: "EX-FITA-09", nome: "Fita nº 9 (exemplo)" },
  { sku: "EX-FITA-12", nome: "Fita nº 12 (exemplo)" }, { sku: "EX-RENDA-50", nome: "Renda 50 mm (exemplo)" },
  { sku: "EX-FITILHO", nome: "Fitilho (exemplo)" }, { sku: "EX-ELAST-02", nome: "Elástico roliço 2 mm (exemplo)" },
];
const produtoDe = (sku) => PRODUTOS.find((p) => p.sku === skuN(sku)) || null;
const insumoDe = (sku) => INSUMOS.find((i) => i.sku === skuN(sku)) || null;

/* ---------- a configuração começa VAZIA ----------
   Classificações, listas, processos, padrões e o que foi aplicado nos produtos
   são criados por quem usa — nada vem pronto. Fica guardado SÓ neste navegador
   (localStorage) para sobreviver a um recarregar; "Recomeçar do zero" apaga. */
const E = {
  aba: "processos", sub: "tipos", busca: "", fc: {}, buscaProd: "",
  pilha: [], foco: null,
  classes: [], listas: [], tipos: [], padroes: [], configs: [],
};
const GUARDA = "pcp-prototipo-processos:v1";
const PERSISTE = ["classes", "listas", "tipos", "padroes", "configs"];
function carregar() {
  try { const s = JSON.parse(localStorage.getItem(GUARDA) || "null");
    if (s) for (const k of PERSISTE) if (Array.isArray(s[k])) E[k] = s[k]; } catch {}
}
function guardar() {
  try { localStorage.setItem(GUARDA, JSON.stringify(Object.fromEntries(PERSISTE.map((k) => [k, E[k]])))); } catch {}
}

const tipoPorId = (id) => E.tipos.find((t) => t.id === id) || null;
const padraoPorId = (id) => E.padroes.find((p) => p.id === id) || null;
const configPorId = (id) => E.configs.find((c) => c.id === id) || null;

const valorClasse = (cid, vid) => E.classes.find((c) => c.id === cid)?.valores.find((v) => v.id === vid) || null;

/* ---------- valores ---------- */
/* medida guardada como { n: "20", u: "cm" }; aceita o texto antigo ("20") sem quebrar */
function medidaDe(c, v) {
  const pad = (c.unidades || [])[0] || c.unidade || "";
  const o = v && typeof v === "object" ? { n: v.n ?? "", u: v.u || pad } : { n: v == null ? "" : String(v), u: pad };
  if (c.unidadeFixa) o.u = pad;

}
function ehVazio(c, v) {
  if (c.tipo === "medida") return !String(medidaDe(c, v).n).trim();
  if (c.tipo === "grupo") return !(v || []).some((it) => c.campos.some((s) => !ehVazio(s, it.v[s.id])));
  if (c.tipo === "passos") return !(v || []).some((s) => String(s.t || "").trim());
  if (c.tipo === "multipla") return !(v || []).length;
  if (c.tipo === "simnao") return v !== true && v !== false;
  return !String(v ?? "").trim();
}
const listaPorId = (id) => E.listas.find((l) => l.id === id) || null;
/* própria do campo OU da lista compartilhada: todo lugar que mostra opção passa por aqui */
const opcoesDe = (c) => (c.listaId ? listaPorId(c.listaId)?.opcoes : c.opcoes) || [];
const nomeOpcao = (c, oid) => opcoesDe(c).find((o) => o.id === oid)?.nome ?? "(opção excluída)";
function fmt(c, v) {
  if (c.tipo === "selecao") return esc(nomeOpcao(c, v));
  if (c.tipo === "multipla") return esc(v.map((o) => nomeOpcao(c, o)).join(", "));
  if (c.tipo === "simnao") return v ? "Sim" : "Não";
  if (c.tipo === "medida") { const m = medidaDe(c, v); return `<b>${esc(m.n)}</b>${m.u ? ` ${esc(m.u)}` : ""}`; }   /* "20 cm", uma informação só */
  if (NUMERICOS.includes(c.tipo)) return `<b>${esc(v)}</b>${c.unidade ? ` ${esc(c.unidade)}` : ""}`;
  if (c.tipo === "sku") { const i = insumoDe(v); return `<span class="mono">${esc(skuN(v))}</span>${i ? ` <span class="pf-ins">${esc(i.nome)}</span>` : ""}`; }
  return esc(v);
}
/* a comparação que decide "personalizado": sem vazios e com as chaves em ordem */
function limpo(x) {
  if (Array.isArray(x)) { const l = x.map(limpo).filter((y) => y !== undefined); return l.length ? l : undefined; }
  if (x && typeof x === "object") {
    const o = {}; for (const k of Object.keys(x).sort()) { const y = limpo(x[k]); if (y !== undefined) o[k] = y; }
    return Object.keys(o).length ? o : undefined;
  }
  return x === "" || x == null ? undefined : x;
}
const canon = (v) => JSON.stringify(limpo(v) ?? {});
function faltas(tipo, vals) {
  const f = [];
  const num = (c, v, onde) => { if (c.tipo === "medida") v = medidaDe(c, v).n;
    if (NUMERICOS.includes(c.tipo) && String(v ?? "").trim() && isNaN(Number(String(v).replace(",", "."))))
    f.push(`${onde}${c.nome}: não é um número`); };
  for (const c of tipo.campos) {
    const v = vals[c.id];
    if (c.obrigatorio && ehVazio(c, v)) f.push(c.nome);
    if (c.tipo === "grupo") (v || []).forEach((it, i) => {
      if (c.campos.every((s) => ehVazio(s, it.v[s.id]))) return;
      for (const s of c.campos) { if (s.obrigatorio && ehVazio(s, it.v[s.id])) f.push(`${c.rotulo || "Item"} ${i + 1} · ${s.nome}`); num(s, it.v[s.id], `${c.rotulo || "Item"} ${i + 1} · `); }
    });
    else num(c, v, "");
  }
  return f;
}
/* salvar tira item de grupo em branco e passo vazio */
function enxugar(tipo, vals) {
  for (const c of tipo.campos) {
    if (c.tipo === "grupo" && vals[c.id]) vals[c.id] = vals[c.id].filter((it) => c.campos.some((s) => !ehVazio(s, it.v[s.id])));
    if (c.tipo === "passos" && vals[c.id]) vals[c.id] = vals[c.id].filter((s) => String(s.t || "").trim());
  }
  return vals;
}
function refGet(vals, ref) {
  const [cid, item, sid] = ref.split("|");
  if (!item) return vals[cid];
  return (vals[cid] || []).find((x) => x.id === item)?.v[sid];
}
function refSet(vals, ref, v) {
  const [cid, item, sid] = ref.split("|");
  if (!item) { vals[cid] = v; return; }
  const it = (vals[cid] || []).find((x) => x.id === item); if (it) it.v[sid] = v;
}

/* ---------- aplicar padrão = copiar ---------- */
function aplicarPadrao(padraoId, sku) {
  const pd = padraoPorId(padraoId);
  const valores = copia(pd.valores);
  /* `baseValores` é o retrato do padrão NO DIA em que foi aplicado: serve para mostrar, campo a
     campo, o que este produto mudou — e para "voltar ao padrão" num campo só. Não é sincronização:
     o padrão editado depois não chega aqui. */
  const cfg = { id: novoId("cf"), sku, tipoId: pd.tipoId, titulo: "", padraoId: pd.id, padraoNome: pd.nome,
    aplicadoEm: new Date().toISOString(), base: canon(valores), baseValores: copia(valores), valores };
  E.configs.push(cfg);
  return cfg;
}
function origemCfg(cfg) {
  if (!cfg.padraoId) return `<span class="tag neutro">montado neste produto</span>`;
  const pd = padraoPorId(cfg.padraoId);
  const mexido = canon(cfg.valores) !== cfg.base;
  return `<span class="tag acao" title="Aplicado em ${fdata(cfg.aplicadoEm)}. É uma cópia: o padrão continua separado.">do padrão ${esc(cfg.padraoNome)}</span>`
    + (mexido ? ` <span class="tag amber">personalizado neste produto</span>` : ` <span class="tag">igual ao aplicado</span>`)
    + (pd && pd.atualizadoEm > cfg.aplicadoEm ? ` <span class="tag neutro" title="O padrão foi editado depois de aplicado. Este produto não mudou.">padrão editado depois</span>` : "")
    + (!pd ? ` <span class="tag neutro">padrão excluído</span>` : "");
}
/* onde um campo/opção está em uso: para avisar ANTES de apagar */
function portadores(tipoId) { return [...E.padroes, ...E.configs].filter((x) => x.tipoId === tipoId); }
function usoCampo(tipoId, g, campo) {
  return portadores(tipoId).filter((x) => g
    ? (x.valores[g] || []).some((it) => !ehVazio(campo, it.v[campo.id]))
    : !ehVazio(campo, x.valores[campo.id])).length;
}
function usoOpcao(tipoId, g, cid, oid) {
  const tem = (v) => v === oid || (Array.isArray(v) && v.includes(oid));
  return portadores(tipoId).filter((x) => g ? (x.valores[g] || []).some((it) => tem(it.v[cid])) : tem(x.valores[cid])).length;
}

/* todos os campos (raiz e dentro de grupo) que usam uma lista */
function camposDaLista(listaId) {
  const r = [];
  for (const t of E.tipos) for (const c of t.campos) {
    if (c.listaId === listaId) r.push({ t, g: "", c });
    for (const s of c.campos || []) if (s.listaId === listaId) r.push({ t, g: c.id, c: s });
  }
  return r;
}
const usoOpcaoLista = (listaId, oid) => camposDaLista(listaId).reduce((n, x) => n + usoOpcao(x.t.id, x.g, x.c.id, oid), 0);
/* opções próprias do campo que já foram escolhidas em algum padrão/produto */
const usoOpcoesProprias = (tipoId, g, c) => (c.opcoes || []).reduce((n, o) => n + usoOpcao(tipoId, g, c.id, o.id), 0);

/* ---------- toasts ---------- */
/* `prox` = o próximo passo natural, como botão: {rotulo, a, ...data} */
function toast(msg, prox) {
  const el = document.createElement("div");
  el.className = "toast pc-toast"; el.textContent = msg;
  if (prox) {
    const b = document.createElement("button");
    b.className = "btn sm"; b.textContent = prox.rotulo;
    for (const [k, v] of Object.entries(prox)) if (k !== "rotulo") b.dataset[k] = v;
    b.addEventListener("click", () => el.remove());
    el.appendChild(b);
  }
  document.getElementById("toasts").appendChild(el); setTimeout(() => el.remove(), prox ? 7000 : 4500);
}

function casaFiltro(classes, extra) {

  return true;
}

/* ======================= FORMULÁRIO DINÂMICO (padrão e produto) ======================= */
/* Na edição de UM produto que veio de padrão, BASE é o retrato do padrão aplicado.
   Cada campo diferente dele ganha a marca "alterado neste produto" e um "voltar ao padrão"
   só daquele campo. Fora disso (padrão, prévia, produto montado à mão) BASE é null. */
let BASE = null;
const tirarTags = (h) => String(h).replace(/<[^>]+>/g, "");
function marcaDif(c, vals, ref) {
  if (!BASE) return "";
  const [cid, item] = ref.split("|");
  if (item && !(BASE[cid] || []).some((x) => x.id === item)) return "";   /* item novo: a marca é do item */
  const antes = refGet(BASE, ref), agora = refGet(vals, ref);
  if (canon(antes) === canon(agora)) return "";
  const era = ehVazio(c, antes) ? "vazio" : c.tipo === "passos" ? plural(antes.length, "passo", "passos") : tirarTags(fmt(c, antes));
  return `<span class="pc-dif" title="No padrão aplicado: ${esc(era)}">alterado neste produto
    <button type="button" data-a="vp-reset" data-ref="${ref}" title="Voltar ao valor do padrão aplicado: ${esc(era)}">↺ padrão</button></span>`;
}
/* sugestões de insumo: por SKU OU por nome, sem acento e sem caixa */
const semAcento = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function sugestoes(q, ref) {
  const k = semAcento(q).trim();
  const l = INSUMOS.filter((i) => !k || semAcento(`${i.sku} ${i.nome}`).includes(k)).slice(0, 6);
  return l.length ? l.map((i) => `<button type="button" data-a="ins-pick" data-ref="${ref}" data-sku="${i.sku}"><b class="mono">${esc(i.sku)}</b> ${esc(i.nome)}</button>`).join("")
    : `<div class="hint" style="padding:6px 10px">Nenhum insumo com “${esc(q)}”. O SKU fica como digitado.</div>`;
}
function campoForm(c, vals, ref) {
  const v = refGet(vals, ref);
  const rot = `${esc(c.nome)}${c.obrigatorio ? ` <b class="pc-ob" title="obrigatório">*</b>` : ""}${c.tipo === "grupo" ? "" : marcaDif(c, vals, ref)}`;
  const un = c.unidade ? `<span class="pc-un">${esc(c.unidade)}</span>` : "";
  switch (c.tipo) {

            <button type="button" data-a="grp-restaurar" data-c="${c.id}">↺ trazer de volta</button></span>` : ""}</div>
        ${itens.map((it, i) => `<div class="pc-item"><div class="pc-item-h"><b>${esc(c.rotulo || "Item")} ${i + 1}</b>

          <span style="margin-left:auto"></span>
          <button class="btn sm ghost so-icone" data-a="grp-mv" data-c="${c.id}" data-i="${it.id}" data-d="-1" ${i ? "" : "disabled"} aria-label="Subir">${svg(IC.setaCima)}</button>
          <button class="btn sm ghost so-icone" data-a="grp-mv" data-c="${c.id}" data-i="${it.id}" data-d="1" ${i < itens.length - 1 ? "" : "disabled"} aria-label="Descer">${svg(IC.setaBaixo)}</button>
          <button class="btn sm ghost" data-a="grp-dup" data-c="${c.id}" data-i="${it.id}">Duplicar</button>
          <button class="btn sm ghost so-icone" data-a="grp-del" data-c="${c.id}" data-i="${it.id}" aria-label="Remover ${esc(c.rotulo || "item")} ${i + 1}">${svg(IC.lixeira)}</button></div>
          <div class="pc-form">${c.campos.map((s) => campoForm(s, vals, `${c.id}|${it.id}|${s.id}`)).join("")}</div></div>`).join("")}
        <button class="btn sm" data-a="grp-add" data-c="${c.id}">${svg(IC.mais)}Adicionar ${esc((c.rotulo || "item").toLowerCase())}</button></div>`;
    }
    case "passos": {
      const l = vals[c.id] || [];
      return `<div class="pc-bloco"><div class="pc-bloco-h"><h4>${rot}</h4></div>
        ${l.map((s, i) => `<div class="pc-passo"><span class="pr-n mono">${i + 1}</span><input class="inp" data-vp="${c.id}|${s.id}" value="${esc(s.t)}" aria-label="Passo ${i + 1}">
          <button class="btn sm ghost so-icone" data-a="ps-mv" data-c="${c.id}" data-i="${s.id}" data-d="-1" ${i ? "" : "disabled"} aria-label="Subir">${svg(IC.setaCima)}</button>
          <button class="btn sm ghost so-icone" data-a="ps-mv" data-c="${c.id}" data-i="${s.id}" data-d="1" ${i < l.length - 1 ? "" : "disabled"} aria-label="Descer">${svg(IC.setaBaixo)}</button>
          <button class="btn sm ghost so-icone" data-a="ps-del" data-c="${c.id}" data-i="${s.id}" aria-label="Remover passo">${svg(IC.lixeira)}</button></div>`).join("")}
        <button class="btn sm" data-a="ps-add" data-c="${c.id}">${svg(IC.mais)}Adicionar passo</button></div>`;
    }
    case "longo": return `<label class="fld pc-largo"><span>${rot}</span><textarea class="inp" rows="3" data-v="${ref}">${esc(v || "")}</textarea></label>`;
    case "selecao": return `<label class="fld"><span>${rot}</span><select class="sel" data-v="${ref}"><option value="">—</option>
      ${opcoesDe(c).map((o) => `<option value="${o.id}" ${v === o.id ? "selected" : ""}>${esc(o.nome)}</option>`).join("")}
      ${v && !opcoesDe(c).some((o) => o.id === v) ? `<option value="${esc(v)}" selected>(opção excluída)</option>` : ""}</select></label>`;
    case "multipla": return `<div class="fld"><span>${rot}</span><div class="pc-chips">${opcoesDe(c).map((o) =>
      `<button class="chip ${(v || []).includes(o.id) ? "on" : ""}" data-a="mult" data-ref="${ref}" data-o="${o.id}">${esc(o.nome)}</button>`).join("")}</div></div>`;
    case "simnao": return `<div class="fld"><span>${rot}</span><div class="seg">
      <button class="${v === true ? "on" : ""}" data-a="sn" data-ref="${ref}" data-val="1">Sim</button>
      <button class="${v === false ? "on" : ""}" data-a="sn" data-ref="${ref}" data-val="0">Não</button>
      <button class="${v !== true && v !== false ? "on" : ""}" data-a="sn" data-ref="${ref}" data-val="">—</button></div></div>`;
    case "sku": { const i = v ? insumoDe(v) : null;
      return `<div class="fld pc-ins"><span>${rot}</span>
        <input class="inp mono pc-sku-in" data-v="${ref}" data-ins="${ref}" value="${esc(v || "")}" placeholder="SKU ou nome do insumo" autocomplete="off" aria-label="${esc(c.nome)}">
        <div class="pc-ins-sug" data-sug="${ref}">${sugestoes(v, ref)}</div>
        <div class="pc-sku-h ${v && !i ? "fora" : ""}">${v ? (i ? `<b>${esc(i.nome)}</b> · só referência` : "SKU fora da lista de insumos · confira")
          : "referência · não movimenta estoque"}</div></div>`; }
    case "medida": { const mv = medidaDe(c, v), us = c.unidades || [];
      const escolhe = !c.unidadeFixa && us.length > 1;
      return `<label class="fld"><span>${rot}</span><div class="pc-un-w">
        <input class="inp" inputmode="decimal" data-vn="${ref}" data-un="${esc(mv.u)}" value="${esc(mv.n)}" aria-label="${esc(c.nome)}">
        ${escolhe ? `<select class="sel pc-un-sel" data-vu="${ref}" aria-label="Unidade de ${esc(c.nome)}">${us.map((u) => `<option ${mv.u === u ? "selected" : ""}>${esc(u)}</option>`).join("")}
            ${mv.u && !us.includes(mv.u) ? `<option selected>${esc(mv.u)}</option>` : ""}</select>`
          : `<span class="pc-un">${esc(us[0] || "")}</span>`}</div></label>`; }
    default: return `<label class="fld"><span>${rot}</span><div class="pc-un-w"><input class="inp" ${NUMERICOS.includes(c.tipo) ? `inputmode="decimal"` : ""} data-v="${ref}" value="${esc(v ?? "")}">${un}</div></label>`;

}
function formValores(tipo, vals) {
  return `<div class="pc-form">${tipo.campos.map((c) => campoForm(c, vals, c.id)).join("")}</div>`;
}

/* ======================= FICHA (tela e papel usam o mesmo desenho) ======================= */
function blocoFicha(tipo, vals) {
  let out = "", kv = [];
  const flush = () => { if (kv.length) out += `<dl class="pf-kv">${kv.join("")}</dl>`; kv = []; };
  for (const c of tipo.campos) {
    const v = vals[c.id];
    if (ehVazio(c, v)) continue;
    if (c.tipo === "grupo") { flush(); out += tabelaGrupo(c, v); }
    else if (c.tipo === "passos") { flush(); out += `<div class="pf-bl"><h4>${esc(c.nome)}</h4><ol class="pf-passos">${v.filter((s) => s.t.trim()).map((s) => `<li><span class="cx"></span>${esc(s.t)}</li>`).join("")}</ol></div>`; }
    else if (c.tipo === "longo") { flush(); out += `<div class="pf-bl"><h4>${esc(c.nome)}</h4><p class="pf-longo">${esc(v)}</p></div>`; }
    else kv.push(`<div><dt>${esc(c.nome)}</dt><dd>${fmt(c, v)}</dd></div>`);
  }
  flush();
  return out || `<div class="hint">Nada preenchido ainda.</div>`;
}
function tabelaGrupo(c, itens) {
  const vivos = itens.filter((it) => c.campos.some((s) => !ehVazio(s, it.v[s.id])));
  const cols = c.campos.filter((s) => vivos.some((it) => !ehVazio(s, it.v[s.id])));   /* só as colunas preenchidas */
  return `<div class="pf-bl"><h4>${esc(c.nome)} <span class="pf-cont">${vivos.length}</span></h4>
    <table class="pf-grp"><thead><tr><th></th>${cols.map((s) => `<th>${esc(s.nome)}</th>`).join("")}</tr></thead>
    <tbody>${vivos.map((it, i) => `<tr><th>${esc(c.rotulo || "Item")} ${i + 1}</th>${cols.map((s) => `<td>${ehVazio(s, it.v[s.id]) ? "" : fmt(s, it.v[s.id])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function secaoProcesso(cfg, n) {
  const t = tipoPorId(cfg.tipoId);
  return `<section class="pf-proc"><h2><span class="pf-num">${n}</span>${esc(t?.nome || "?")}${cfg.titulo ? ` · ${esc(cfg.titulo)}` : ""}
    <span class="pf-meta">${tagsClasses(t?.classes)}</span></h2>${t ? blocoFicha(t, cfg.valores) : ""}</section>`;
}
function folhaProduto(sku, ids) {
  const prod = produtoDe(sku);
  const cs = configsDe(sku).filter((c) => !ids || ids.includes(c.id));
  const agora = new Date().toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
  return `<div class="cab-f"><div class="lg"></div>
      <div><h1>${esc(prod?.descricao || sku)}</h1><div class="sub-f">Moda Bicho Acessórios · Ficha operacional${prod?.categoria ? ` · ${esc(prod.categoria)}` : ""} · ${ids && ids.length === 1 ? "1 processo" : plural(cs.length, "processo", "processos")}</div></div>
      <div class="dt"><b class="sku-f">${esc(sku)}</b><br>Impresso em ${agora}</div></div>
    ${cs.map((c, i) => secaoProcesso(c, i + 1)).join("")}
    <div class="obs-f">Instrução de trabalho. Não é ordem de produção e não movimenta estoque nem insumos.</div>`;
}
function imprimir(html) {
  document.getElementById("folha").innerHTML = html;
  document.body.classList.add("imprimindo");
  window.onafterprint = () => document.body.classList.remove("imprimindo");
  window.print();
}

/* ======================= JANELAS ======================= */
function janela(titulo, corpo, rodape, largura) {
  const volta = E.pilha.length > 1 ? `<button class="btn sm ghost" data-a="fechar">${svg(IC.setaEsq)}Voltar</button>` : "";
  return `<div class="ov" data-a="fundo"><div class="modal" style="max-width:min(${largura}, 96vw)" role="dialog" aria-modal="true">
    <div class="modal-h">${volta}<h2>${titulo}</h2><button class="btn sm ghost" style="margin-left:auto" data-a="fechar-tudo" aria-label="Fechar">${svg(IC.fechar)}</button></div>
    <div class="modal-b">${corpo}</div><div class="modal-f">${rodape}</div></div></div>`;
}
const erros = (m) => m.erros?.length ? `<div class="pc-erros"><b>Falta resolver:</b><ul>${m.erros.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div>` : "";

/* ---------- construtor do tipo de processo ---------- */
function campoBuilder(c, g, i, total) {
  const tc = TC[c.tipo];
  const d = `data-g="${g}" data-id="${c.id}"`;
  const origem = tc.op ? `<div class="bc-ops"><span class="bc-rot">Opções</span>
      <div class="seg" role="group" aria-label="De onde vêm as opções">
        <button class="${c.listaId ? "" : "on"}" data-a="op-origem" ${d} data-v="propria">Próprias do campo</button>
        <button class="${c.listaId ? "on" : ""}" data-a="op-origem" ${d} data-v="lista">Lista compartilhada</button></div>
      ${c.listaId ? `<select class="sel" data-bcl="${g}|${c.id}" aria-label="Lista">${E.listas.map((l) => `<option value="${l.id}" ${l.id === c.listaId ? "selected" : ""}>${esc(l.nome)} · ${l.opcoes.length}</option>`).join("")}</select>`
        : `<button class="btn sm ghost" data-a="op-virar-lista" ${d} ${c.opcoes?.length ? "" : "disabled"} title="Cria uma lista com estas opções, para outros campos usarem também">Transformar em lista compartilhada</button>`}</div>` : "";
  const opcoes = !tc.op ? "" : c.listaId
    ? `<div class="bc-ops"><span class="bc-rot">${esc(listaPorId(c.listaId)?.nome || "lista excluída")}</span>${opcoesDe(c).map((o) => `<span class="tag">${esc(o.nome)}</span>`).join(" ")}
        <span class="hint">· edite em Processos › Listas de opções; vale para todos os campos que usam a lista</span></div>`
    : `<div class="bc-ops">${c.opcoes.map((o, j) => `<span class="bc-op">
      <input class="inp" data-op="${g}|${c.id}|${o.id}" value="${esc(o.nome)}" aria-label="Opção">
      <button data-a="op-mv" ${d} data-o="${o.id}" data-d="-1" ${j ? "" : "disabled"} aria-label="Mover para a esquerda">‹</button>
      <button data-a="op-mv" ${d} data-o="${o.id}" data-d="1" ${j < c.opcoes.length - 1 ? "" : "disabled"} aria-label="Mover para a direita">›</button>
      <button data-a="op-del" ${d} data-o="${o.id}" aria-label="Excluir opção ${esc(o.nome)}">×</button></span>`).join("")}
      <span class="bc-op nova"><input class="inp" id="op-novo-${c.id}" placeholder="Nova opção" data-enter="op-add" ${d}><button data-a="op-add" ${d} aria-label="Adicionar opção">+</button></span></div>`;
  const grupo = c.tipo === "grupo" ? `<div class="bc-sub">
      <label class="fld bc-rotulo"><span>Nome de cada item</span><input class="inp" data-bc="${g}|${c.id}|rotulo" value="${esc(c.rotulo || "")}" placeholder="Ex.: Fita, Parte, Insumo"></label>
      <div class="bc-rot">Campos de cada ${esc((c.rotulo || "item").toLowerCase())}</div>
      ${c.campos.map((s, j) => campoBuilder(s, c.id, j, c.campos.length)).join("") || `<div class="hint">Nenhum campo ainda.</div>`}
      ${addCampo(c.id)}</div>` : "";
  return `<div class="bc-campo t-${c.tipo}">
    <div class="bc-lin">
      <span class="bc-n mono">${i + 1}</span><span class="bc-ic" title="${tc.nome}">${tc.ic}</span>
      <input class="inp bc-nome" data-bc="${g}|${c.id}|nome" value="${esc(c.nome)}" placeholder="Ex.: Número da fita, Tamanho em cm" aria-label="Nome do campo">
      <select class="sel" data-bct="${g}|${c.id}" aria-label="Tipo do campo">${TIPOS_CAMPO.filter((t) => !g || !t.soRaiz).map((t) => `<option value="${t.k}" ${t.k === c.tipo ? "selected" : ""}>${t.nome}</option>`).join("")}</select>
      ${tc.un != null ? `<input class="inp bc-un" list="dl-un" data-bc="${g}|${c.id}|unidade" value="${esc(c.unidade || "")}" placeholder="unidade" aria-label="Unidade">` : ""}
      <label class="selbar-chk"><input type="checkbox" data-bco="${g}|${c.id}" ${c.obrigatorio ? "checked" : ""}> Obrigatório</label>
      <span class="bc-acoes">
        <button class="btn sm ghost so-icone" data-a="bc-mv" ${d} data-d="-1" ${i ? "" : "disabled"} aria-label="Subir">${svg(IC.setaCima)}</button>
        <button class="btn sm ghost so-icone" data-a="bc-mv" ${d} data-d="1" ${i < total - 1 ? "" : "disabled"} aria-label="Descer">${svg(IC.setaBaixo)}</button>
        <button class="btn sm ghost so-icone" data-a="bc-del" ${d} aria-label="Excluir campo">${svg(IC.lixeira)}</button></span>
    </div>${origem}${opcoes}${c.tipo === "medida" ? unidadesBuilder(c, g, d) : ""}${grupo}</div>`;
}
/* "+ Adicionar campo" abre uma grade com os tipos: um clique escolhe e cria */
/* as unidades de UMA medida: nada de cm/mm/un fixos no código — a lista é do campo */
function unidadesBuilder(c, g, d) {
  const us = c.unidades || [];
  return `<div class="bc-ops"><span class="bc-rot">Unidade</span>
    <div class="seg" role="group" aria-label="Como a unidade funciona">
      <button class="${c.unidadeFixa ? "on" : ""}" data-a="un-modo" ${d} data-v="fixa">Fixa</button>
      <button class="${c.unidadeFixa ? "" : "on"}" data-a="un-modo" ${d} data-v="escolha">Quem preenche escolhe</button></div>
    ${c.unidadeFixa
      ? `<input class="inp bc-un" list="dl-un" data-bun="${g}|${c.id}" value="${esc(us[0] || "")}" placeholder="ex.: cm" aria-label="Unidade fixa">
         <span class="hint">sempre “20 ${esc(us[0] || "cm")}”, sem perguntar</span>`
      : `${us.map((u, j) => `<span class="bc-op"><span class="bc-un-n">${esc(u)}</span>
          <button data-a="un-mv" ${d} data-u="${esc(u)}" data-d="-1" ${j ? "" : "disabled"} aria-label="Mover ${esc(u)} para a esquerda">‹</button>
          <button data-a="un-mv" ${d} data-u="${esc(u)}" data-d="1" ${j < us.length - 1 ? "" : "disabled"} aria-label="Mover ${esc(u)} para a direita">›</button>
          <button data-a="un-del" ${d} data-u="${esc(u)}" aria-label="Tirar ${esc(u)}">×</button></span>`).join("")}
        <span class="bc-op nova"><input class="inp" list="dl-un" id="un-novo-${c.id}" placeholder="+ unidade" data-enter="un-add" ${d} aria-label="Nova unidade"><button data-a="un-add" ${d} aria-label="Adicionar unidade">+</button></span>
        <span class="hint">a primeira vem sugerida</span>`}</div>`;
}
const addCampo = (g) => topo()?.picker === (g || "raiz")
  ? `<div class="bc-picker"><div class="bc-picker-h"><b>Que tipo de campo${g ? " dentro do grupo" : ""}?</b>
      <button class="btn sm ghost" data-a="bc-picker" data-g="">Fechar</button></div>
      <div class="bc-picker-g">${TIPOS_CAMPO.filter((t) => !g || !t.soRaiz).map((t) => `<button class="bc-tp t-${t.k}" data-a="bc-add" data-g="${g}" data-k="${t.k}">
        <span class="bc-ic">${t.ic}</span><span><b>${t.nome}</b><small>${t.ex}</small></span></button>`).join("")}</div></div>`
  : `<div class="bc-add"><button class="btn sm ${g ? "" : "primary"}" data-a="bc-picker" data-g="${g || "raiz"}">${svg(IC.mais)}Adicionar campo${g ? " ao grupo" : ""}</button></div>`;

function modalTipo(m) {

    <div class="grid2"><label class="fld"><span>Nome do processo *</span><input class="inp" data-t="nome" value="${esc(r.nome)}" placeholder="Ex.: Corte de fitas, Montagem, Embalagem"></label>
      <label class="fld"><span>Descrição</span><input class="inp" data-t="descricao" value="${esc(r.descricao || "")}"></label></div>

      <button class="${aba === "previa" ? "on" : ""}" data-a="tipo-aba" data-v="previa">Prévia do formulário</button></div>
    ${aba === "campos" ? `<div class="bc-lista">${r.campos.map((c, i) => campoBuilder(c, "", i, r.campos.length)).join("")
      || `<div class="hint">Nenhum campo ainda. Quando o produto tem várias partes iguais (várias fitas, vários insumos), comece por um <b>Grupo repetível</b> e ponha os campos dentro dele.</div>`}</div>${addCampo("")}
      <datalist id="dl-un">${UNIDADES.map((u) => `<option value="${u}">`).join("")}</datalist>`
    : `<div class="aviso" style="margin-bottom:10px">Assim o formulário aparece para quem preencher um padrão ou um produto. O que você digitar aqui não é salvo.</div>${formValores(r, m.previa)}`}`,
    `${!m.novo ? `<button class="btn danger" data-a="tipo-del">Excluir tipo</button>
       <button class="btn ghost" data-a="tipo-dup" title="Começar um processo novo a partir deste">Duplicar processo</button>` : ""}<button class="btn" data-a="fechar">Cancelar</button><span style="margin-left:auto"></span>
     <button class="btn primary" data-a="tipo-salvar">${svg(IC.ok)}Salvar tipo de processo</button>`, "1100px");
}

/* ---------- preencher: padrão ou configuração de um produto ---------- */
function modalValores(m) {
  const t = tipoPorId(m.tipoId), r = m.rasc;
  const ehPadrao = m.modo === "padrao";
  const cfg = !ehPadrao ? configPorId(m.id) : null;
  const outros = ehPadrao ? [...new Set(E.configs.filter((c) => c.padraoId === m.id).map((c) => c.sku))] : [];
  /* só a edição de um produto que veio de padrão compara campo a campo */
  BASE = cfg?.baseValores || null;
  const nDif = BASE ? t.campos.filter((c) => canon(BASE[c.id]) !== canon(r.valores[c.id])).length : 0;
  const form = formValores(t, r.valores);
  BASE = null;
  return janela(ehPadrao ? (m.novo ? `Novo padrão · ${esc(t.nome)}` : `Padrão · ${esc(r.nome)}`)
      : `${esc(t.nome)} · <span class="mono">${esc(cfg.sku)}</span>`, `
    ${ehPadrao
      ? `<div class="grid2"><label class="fld"><span>Nome do padrão *</span><input class="inp" data-r="nome" value="${esc(r.nome)}" placeholder="Ex.: Chuca P"></label><div></div></div>
         <div style="margin:10px 0">${chipsClasses(r.classes)}</div>
         ${outros.length ? `<div class="aviso" style="margin-bottom:12px">Já aplicado em <b>${outros.join(", ")}</b>. Editar o padrão <b>não muda</b> esses produtos: cada um tem a própria cópia.</div>` : ""}`

/* ---------- MODO BANCADA · a instrução como a produção usa ----------
   Tela cheia, letra grande, um processo por vez com abas numeradas. Os passos
   são tocáveis para a pessoa marcar onde está — marcação SÓ na tela (vive
   nesta janela e some ao fechar); nada é gravado nem vira apontamento. */
function corpoBancada(t, cfg, m) {
  const vals = cfg.valores;
  let out = "", kv = [];
  const flush = () => { if (kv.length) out += `<dl class="bn-kv">${kv.join("")}</dl>`; kv = []; };
  for (const c of t.campos) {
    const v = vals[c.id];
    if (ehVazio(c, v)) continue;
    if (c.tipo === "grupo") {
      flush();
      const itens = v.filter((it) => c.campos.some((s) => !ehVazio(s, it.v[s.id])));
      out += `<section class="bn-bl"><h3>${esc(c.nome)} <span class="pf-cont">${itens.length}</span></h3><div class="bn-itens">
        ${itens.map((it, i) => `<div class="bn-item"><div class="bn-item-h">${esc(c.rotulo || "Item")} ${i + 1}</div>
          ${c.campos.filter((s) => !ehVazio(s, it.v[s.id])).map((s) => `<div class="bn-lin"><span>${esc(s.nome)}</span><b>${fmt(s, it.v[s.id])}</b></div>`).join("")}</div>`).join("")}
        </div></section>`;
    } else if (c.tipo === "passos") {
      flush();
      const ps = v.filter((s) => s.t.trim());
      const feitos = ps.filter((s) => m.feitos.includes(`${cfg.id}|${c.id}|${s.id}`)).length;
      out += `<section class="bn-bl"><h3>${esc(c.nome)} <span class="hint">${feitos} de ${ps.length} marcados</span></h3><ol class="bn-passos">
        ${ps.map((s, i) => { const k = `${cfg.id}|${c.id}|${s.id}`; const on = m.feitos.includes(k);
          return `<li><button class="${on ? "feito" : ""}" data-a="bn-passo" data-k="${k}" aria-pressed="${on}">
            <span class="bn-n">${on ? "✓" : i + 1}</span><span>${esc(s.t)}</span></button></li>`; }).join("")}</ol></section>`;
    } else if (c.tipo === "longo") { flush(); out += `<section class="bn-bl"><h3>${esc(c.nome)}</h3><p class="bn-longo">${esc(v)}</p></section>`; }
    else kv.push(`<div><dt>${esc(c.nome)}</dt><dd>${fmt(c, v)}</dd></div>`);
  }
  flush();
  return out || `<div class="empty"><h3>Nada preenchido neste processo</h3>
    <button class="btn primary" data-a="cfg-editar" data-id="${cfg.id}">${svg(IC.editar)}Preencher</button></div>`;
}

/* ======================= DESENHO ======================= */
/* ATUALIZAR, NÃO SUBSTITUIR. Trocar o innerHTML inteiro a cada clique recriava a
   janela: a animação de entrada dela rodava de novo (a "piscada"), o foco caía e
   o cursor voltava ao início. Aqui o HTML novo é comparado com o que já está na
   tela e só o que mudou é mexido: o mesmo nó da janela continua de pé, com foco,
   cursor, rolagem e o que foi digitado. É um lugar só, e vale para toda ação. */
function atualizar(raiz, html) {
  const t = document.createElement("template");
  t.innerHTML = html;
  atualizarFilhos(raiz, t.content);
}
function atualizarFilhos(de, para) {
  const a = [...de.childNodes], b = [...para.childNodes];
  b.forEach((n, i) => (i < a.length ? atualizarNo(a[i], n) : de.appendChild(n)));
  for (let i = b.length; i < a.length; i++) a[i].remove();
}
function atualizarNo(de, para) {
  if (de.nodeType !== para.nodeType || de.nodeName !== para.nodeName) { de.replaceWith(para); return; }
  if (de.nodeType !== 1) { if (de.nodeValue !== para.nodeValue) de.nodeValue = para.nodeValue; return; }
  for (const at of [...de.attributes]) if (!para.hasAttribute(at.name)) de.removeAttribute(at.name);
  for (const at of [...para.attributes]) if (de.getAttribute(at.name) !== at.value) de.setAttribute(at.name, at.value);
  const tag = de.nodeName, focado = de === document.activeElement;
  /* o campo em que a pessoa está digitando não é tocado: o que ela digitou já
     está no estado, e mexer no valor jogaria o cursor para o fim */
  if (tag === "TEXTAREA") { if (!focado && de.value !== para.value) de.value = para.value; return; }
  if (tag === "INPUT") {
    if (de.type === "checkbox" || de.type === "radio") de.checked = para.hasAttribute("checked");
    else if (!focado && de.value !== para.value) de.value = para.value;
    return;
  }
  const escolhido = tag === "SELECT" ? ([...para.options].find((o) => o.hasAttribute("selected")) || para.options[0])?.value ?? "" : null;
  atualizarFilhos(de, para);
  if (escolhido != null && de.value !== escolhido) de.value = escolhido;
}
function render() {
  const ativo = document.activeElement;
  const guarda = ativo && ativo.id ? { id: ativo.id, i: ativo.selectionStart, f: ativo.selectionEnd } : null;
  const mesmaJanela = E._janela === topo();
  const rolagem = mesmaJanela ? document.querySelector(".modal-b, .pc-banc-b")?.scrollTop : null;
  E._janela = topo();
