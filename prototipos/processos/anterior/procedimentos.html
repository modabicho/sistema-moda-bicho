/* ===========================================================================
   TOKENS · a fonte única de cor, medida e tipo do PCP                  v8.51
   ---------------------------------------------------------------------------
   Este arquivo vem ANTES de todos os outros no manifesto, e é o único lugar
   onde um valor de cor nasce. Ele tem três níveis, e a ordem importa:

     NÍVEL 1 · A MARCA   as rampas oficiais do design system Moda Bicho.
                         Nenhum componente usa estas variáveis diretamente.
     NÍVEL 2 · OS PAPÉIS o que cada cor SIGNIFICA no PCP. É só isto que o
                         resto do app enxerga — e é por isso que o tema
                         escuro cabe em um bloco, sem tocar em componente.
     NÍVEL 3 · AS MEDIDAS espaço, tipo, raio, sombra, quebra.

   POR QUE OS NÍVEIS.
   A varredura mediu 299 cores literais no CSS contra 71 variáveis que já
   existiam. Ou seja: a camada de token existia e era contornada. Um app com
   299 hex soltos não tem tema escuro — tem 299 lugares para esquecer.

   O QUE ESTE ARQUIVO NÃO FAZ.
   Ele não muda o SIGNIFICADO de nenhuma cor. A gramática de cinco sentidos
   (perigo · atencao · ok · acao · neutro) já existia no `base.css` e continua
   inteira, palavra por palavra. O que mudou é de onde os valores vêm.
   =========================================================================== */

:root {
  /* =========================================================================
     NÍVEL 1 · A MARCA — rampas oficiais (design system Moda Bicho v1)
     -------------------------------------------------------------------------
     Valores do manual, não recalculados. O contraste de cada degrau sobre
     branco está no comentário: é ele que decide onde cada um pode ser usado.
     NÃO USE ESTAS VARIÁVEIS EM COMPONENTE. Use as do nível 2.
     ========================================================================= */
  --navy-50:#F2F4F8;   --navy-100:#E1E5EE;  --navy-200:#BCC4D5;
  --navy-300:#909BB3;  --navy-400:#4D5C7E;  /* 6.67 AA  */
  --navy-500:#2A3551;  /* 12.16 AAA */      --navy-600:#1E2945;  /* 14.40 AAA */
  --navy-700:#141C33;  --navy-800:#0D1426;  --navy-900:#060B17;

  --coral-50:#FEF1F2;  --coral-100:#FBDDDE; --coral-200:#F7BCBD;
  --coral-300:#F3A1A3; --coral-400:#EF8083; --coral-500:#EB696C; /* 3.10 AA UI */
  --coral-600:#D44E51; /* 4.19 AA UI */     --coral-700:#B43A3D; /* 5.81 AA  */
  --coral-800:#8F2A2D; /* 8.28 AAA */       --coral-900:#5F1F21;

  --neutral-50:#F8FAFC;  --neutral-100:#F1F5F9; --neutral-200:#E2E8F0;
  --neutral-300:#CBD5E1; --neutral-400:#94A3B8; --neutral-500:#64748B; /* 4.76 AA */
  --neutral-600:#475569; --neutral-700:#334155; --neutral-800:#1E293B;
  --neutral-900:#0F172A;

  /* funcionais do manual. `--fn-success` é cor de PREENCHIMENTO (contraste
     2.54 sobre branco: não serve para texto) — o verde de TEXTO do PCP é o
     `--ok` do nível 2, escolhido para ficar irmão do vermelho e do âmbar. */
  --fn-success:#10B981; --fn-danger:#DC2626; --fn-warning:#F59E0B; --fn-info:#0EA5E9;

  /* rampa quente do manual. Ela existe para a LOJA (vitrine, hero, foto) e
     fica FORA do cromo do PCP: em console industrial ela competiria com o
     âmbar de atenção. Aqui ela serve só ao que já é da marca — o logo e o
     bege herdado. */
  --camel-100:#F0E6DB; --camel-300:#D8B99A; --camel-500:#C79476; --camel-700:#96633C;

  /* =========================================================================
     NÍVEL 2 · OS PAPÉIS — o que a cor significa no PCP
     -------------------------------------------------------------------------
     A GRAMÁTICA, que não mudou:
       perigo   quebrou, venceu ou travou. RESOLVA.
       atencao  ainda não quebrou, mas vai. PRESTE ATENÇÃO.
       ok       deu certo, está conferido, está saudável.
       acao     é clicável, é a etapa ativa. Não é elogio nem alarme.
       neutro   estado normal, contexto, dado secundário.
     `--coral` é o acento da MARCA (seleção, foco, linha ativa) e nunca
     significa alerta: era ele que competia com o vermelho de verdade.
     ========================================================================= */

  /* TEXTO · quatro degraus, e os QUATRO passam 4,5:1 sobre `--surface` e sobre
     `--surface-2`. Os dois últimos não passavam: `--ink-3` dava 3,66 e
     `--ink-4` dava 2,79 — e não eram enfeite, eram texto que a pessoa precisa
     ler ("sem linha de estoque", o nome da prestadora, a legenda da coluna).
     Degrau que não dá para ler não é hierarquia, é dado escondido.
     Medido:  14,40 · 9,22 · 6,29 · 4,99 */
  --ink:var(--navy-600); --ink-2:#3A4767;
  --ink-3:#55607A; --ink-4:#647087;

  /* superfície */
  --canvas:#F0F2F5; --surface:#FFFFFF; --surface-2:var(--neutral-50);
  --line:#DEE3EC; --line-2:#ECEFF4;

  /* a família navy com os nomes que o app já usa */
  --teal:var(--navy-500); --teal-2:var(--navy-700);
  --teal-soft:#E8ECF4;    --teal2:#AFC0E0;

  /* coral: acento de marca */
  --coral:var(--coral-500); --coral-2:var(--coral-600); --coral-soft:var(--coral-50);

  /* quente herdado */
  --bege:var(--camel-500); --bege-soft:#F6ECE4;

  /* os cinco sentidos */
  --perigo:#C2261A;  --perigo-fundo:#FCEBE9; --perigo-borda:#E9CBC7;
  --atencao:#B45309; --atencao-fundo:#FDF2E4; --atencao-borda:#EDD6B4;
  --ok:#24705A;      --ok-fundo:#E6F2ED;     --ok-borda:#BFDDD0;
  --acao:var(--navy-500);   --acao-fundo:#E8ECF4;   --acao-borda:#C9D3E6;
  /* AÇÃO CHEIA — o botão primário, o único bloco de cor sólida da tela.
     Ela existe separada de `--acao` porque as duas andam em direções
     opostas no tema escuro: o TEXTO clicável precisa clarear, o BLOCO
     preenchido precisa continuar sendo um bloco. Quem escrevia
     `background:var(--teal); color:var(--em-cor)` estava usando o mesmo
     token para as duas coisas — e no escuro uma das duas tinha que quebrar. */
  --acao-cheio:var(--navy-500); --acao-cheio-2:var(--navy-700); --em-acao:#FFFFFF;

  /* SUPERFÍCIE INVERTIDA — o aviso que sobe, a barra de seleção, o número do
     passo. Sete regras escreviam `background:var(--ink)`, e `--ink` é papel de
     TEXTO: no tema escuro ele vira quase branco e o aviso ficava branco sobre
     branco (medido: 1,10). A superfície invertida é um papel próprio — escura
     nos dois temas, porque a função dela é destacar-se do fundo, e no escuro
     quem se destaca é o painel mais CLARO, não o mais branco. */
  --tinta-cheia:var(--navy-600); --em-tinta:#FFFFFF;

  /* CLASSIFICAÇÃO ABC — é Pareto, não alarme, então não gasta nenhum dos cinco
     sentidos. A faixa B usava camel.700 sobre bege claro: 4,35 no claro e 3,12
     no escuro, em letra de 10px. Vira papel próprio, que vira com o tema. */
  --abc-b-fundo:var(--bege-soft); --abc-b-tinta:#6E4526;
  --neutro:#5B6583; --neutro-fundo:#EDF0F5; --neutro-fraco:var(--navy-300);
  /* mesmo âmbar, com contraste de LEITURA: etiqueta de duas palavras aguenta
     4,5:1; parágrafo de 12,5px não. */
  --atencao-texto:#7C3A06;

  /* nomes antigos, mesma fonte */
  --red:var(--perigo); --red-soft:var(--perigo-fundo);
  --amber:var(--atencao); --amber-soft:var(--atencao-fundo);
  --slate:var(--neutro); --slate-soft:var(--neutro-fundo);

  /* o trilho */
  --rail:var(--navy-600); --rail-2:var(--navy-700);
  --rail-linha:#33406355; --rail-hover:#2E3B60;
  --rail-txt:#AEB9D6; --rail-txt-2:#7F8BAF;
  /* ACENTO SOBRE O TRILHO. O trilho e escuro nos DOIS temas, entao o que
     escreve em cima dele nao segue o tema — segue o trilho. Coral.500 sobre
     o item ativo do trilho da 3,59: o contador de pendencias do menu e texto
     de 11px, precisa de 4,5. Coral.300 da 5,53 ali e 7,16 no trilho parado. */
  --rail-acento:var(--coral-300);
  /* A MARCA MUDA DE ARTE, NÃO DE COR. O logotipo tem duas artes: uma para
     fundo claro e outra para fundo escuro. No tema escuro o cartão de entrada
     é navy, e a arte clara sumia — "MODA" e "ACESSÓRIOS" desapareciam e
     sobrava o bichinho. Qual arte usar é papel de nível 2, como qualquer
     outra decisão que vira com o tema. */
  --logo-auth:var(--logo-claro);
  /* A MARCA DE QUEM FEZ. Mesma regra do logotipo da Moda Bicho: duas artes,
     uma para fundo claro e outra para fundo escuro. A marca da SINAL é
     monocromática, então a arte clara é a mesma forma com a tinta clareada —
     não é outra marca, é a mesma em outro tom. Medido: a tinta original
     (#696969) dá 4,89 sobre o chão claro e 2,62 sobre o navy; a clara dá
     8,61 sobre o navy do trilho e 11,75 sobre o navy do tema escuro.
     `--logo-sinal` acompanha o tema; `--logo-sinal-trilho` é sempre a clara,
     porque o trilho é navy nos dois temas. */

  /* PERIGO SOBRE O TRILHO. `--perigo` do tema claro da 2,46 sobre o navy do
     trilho — ilegivel. O vermelho continua sendo vermelho (a gramatica nao
     muda), so clareia o bastante para caber ali: 5,93. */
  --rail-perigo:#F08A80;

  /* linha de tabela e superfície clicável */
  --linha-hover:var(--neutral-50);
  --acao-bg:#FBFCFE; --acao-bg-hover:#EDF2F9;

  /* a barra do sistema operacional / navegador */
  --barra-sistema:var(--navy-500);

  /* TEXTO SOBRE COR CHEIA — botão primário, trilho, etiqueta preenchida.
     Existe como token para não virar `#fff` solto: no tema escuro o fundo
     saturado muda, e quem escreve `#fff` no componente não fica sabendo. */
  --em-cor:#FFFFFF;
  /* TEXTO SOBRE CORAL. Branco sobre coral dá 3,10 no claro e 2,60 no escuro —
     o próprio manual marca coral.400/500 como "AA UI", que serve para caixa e
     ícone, NÃO para texto. Sobre coral, a tinta é navy: 5,91 no claro e 7,06
     no escuro. É o chip ativo, o badge do menu e qualquer etiqueta cheia. */
  --em-coral:var(--navy-800);
  /* e a mesma pergunta para os outros preenchimentos cheios: no tema claro o
     `--perigo` é escuro (texto branco); no escuro ele é claro (texto navy). Um
     token só não resolve os dois — por isso são quatro, um por sentido. */
  --em-perigo:#FFFFFF; --em-atencao:#FFFFFF; --em-ok:#FFFFFF;

  /* =========================================================================
     NÍVEL 3 · AS MEDIDAS
     ========================================================================= */

  /* espaço · múltiplo de 4, como o manual */
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px;
  --sp5:24px; --sp6:32px; --sp7:48px; --sp8:64px;

  /* TIPO · a escala do PCP, não a da loja.
     O manual manda Display 48 / H1 36 / Body 16 — medida de vitrine. Em tela
     de produção, um H1 de 36px come três linhas de tabela. Esta é a mesma
     proporção, deslocada para densidade de console: oito degraus no lugar dos
     29 tamanhos distintos que a varredura achou. */
  --fs-num-g:22px; /* número grande de painel — o único degrau de vitrine */
  --fs-h1:20px;    /* título da página */
  --fs-h2:16px;    /* título de seção */
  --fs-h3:14px;    /* título de bloco, cabeçalho de janela */
  --fs-corpo:13px; /* o padrão da interface */
  --fs-dado:12.5px;/* célula de tabela, campo */
  --fs-apoio:12px; /* legenda, ajuda */
  --fs-micro:11px; /* etiqueta, badge, eyebrow */
  --fs-nano:10px;  /* carimbo, unidade */

  /* IMPRESSÃO tem escala PRÓPRIA, e é de propósito: a folha é medida em
     milímetro, não em pixel de tela. Os 6 a 8,5px do romaneio e da etiqueta
     não são "fonte pequena demais" — são o tamanho certo no papel. Encaixá-los
     na escala de tela encheria a folha e tiraria linha do romaneio. */
  /* o trilho recolhido: rótulo de 8,5px sob o ícone. Não é a escala de tela —
     é legenda de ícone, e por isso tem degrau próprio e nomeado. */
  --fs-trilho-mini:8.5px;

  /* PAPEL: preto é preto na folha. Na tela o manual proíbe preto puro em
     texto; na impressora ele é a tinta. */
  --pr-tinta:#000000; --pr-papel:#FFFFFF;
  /* segundo degrau da folha: o que a pessoa lê depois do nome (descrição,
     observação). Cinza de impressora, não cinza de tela. */
  --pr-tinta-2:#3F3F46;

  --pr-titulo:11px; --pr-corpo:8.5px; --pr-apoio:8px;
  --pr-micro:7.5px; --pr-nano:6.5px; --pr-selo:6px;

  --lh-titulo:1.25; --lh-corpo:1.5;

  --ff-titulo:'Red Hat Display',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --ff-corpo:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --ff-mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
  --mono:var(--ff-mono);

  /* RAIO · quatro, e um pill. O manual usa 8–24 porque card de vitrine é
     grande; célula de tabela com canto de 24px vira ruído. */
  --r-1:4px;   /* etiqueta, campo pequeno, célula */
  --r-2:6px;   /* botão, input, chip */
  --r-3:8px;   /* card, painel, janela */
  --r-pill:999px;
  /* nomes antigos, apontados para a escala nova */
  --r-xs:var(--r-1); --r-sm:var(--r-2); --r-md:var(--r-3);
  --r-lg:var(--r-3); --r-xl:var(--r-3); --r:var(--r-3);

  /* SOMBRA · três, e a regra do manual: sombra em NAVY, nunca em preto puro.
     Console industrial vive de borda, não de elevação — a varredura achou 41
     sombras distintas, e quase todas eram a mesma ideia escrita de novo. */
  --sh-0:none;
  --sh-1:0 1px 2px rgba(30,41,69,.06);
  --sh-2:0 2px 8px -2px rgba(30,41,69,.12), 0 1px 2px rgba(30,41,69,.05);
  --sh-3:0 12px 32px -12px rgba(30,41,69,.30), 0 2px 6px rgba(30,41,69,.07);
  /* duas elevações com papel próprio, e só duas: a gaveta que entra pela
     lateral e o realce da ação principal. Fora estas, nada flutua. */
  --sh-gaveta:-8px 0 40px rgba(30,41,69,.20);
  --sh-acao:0 2px 8px -2px rgba(235,105,108,.45);
  --el1:var(--sh-1); --el2:var(--sh-2); --el3:var(--sh-3);
  --shadow:var(--sh-2);

  /* VÉUS SOBRE O TRILHO ESCURO — branco a baixa opacidade. Existem como token
     porque no tema escuro o trilho já é quase preto e o mesmo véu precisa ser
     um pouco mais forte para aparecer. */
  --veu-1:rgba(255,255,255,.055);
  --veu-2:rgba(255,255,255,.085);
  --veu-3:rgba(255,255,255,.11);
  --veu-4:rgba(255,255,255,.16);
  --veu-modal:rgba(23,31,52,.52);

  /* MARCADOR LATERAL — a barra de 3px na borda esquerda que diz o estado da
     linha. A varredura contou 40 "sombras" distintas; a maioria era isto, que
     não é elevação nenhuma: é sinalização, e por isso tem token próprio. */
  --marca-lat:3px 0 0;

  /* foco */
  --ring:0 0 0 3px rgba(42,53,81,.14);
  --ring-coral:0 0 0 3px rgba(235,105,108,.24);

  /* QUEBRAS · quatro. A varredura achou 21 larguras distintas, então cada tela
     quebrava na sua. Estas ficam aqui como documentação: media query não lê
     variável, então o valor está repetido nos arquivos — mas é UM valor.
       --bp-xl 1200  trilho + conteúdo largo
       --bp-lg  900  trilho recolhe
       --bp-md  720  vira uma coluna
       --bp-sm  560  celular estreito                                        */
  --bp-xl:1200px; --bp-lg:900px; --bp-md:720px; --bp-sm:560px;

  color-scheme:light;
}

/* ===========================================================================
   TEMA ESCURO · NATIVO, NÃO INVERSÃO
   ---------------------------------------------------------------------------
   Só o NÍVEL 2 é redefinido. Nenhum componente sabe que existe tema escuro —
   é isso que faz caber num bloco em vez de numa varredura.

   A regra que vem do manual: no escuro a superfície ELEVADA fica mais clara
   que a base (no claro é o contrário). Inverter as cores do tema claro daria
   um cinza chapado e texto branco puro — que o próprio manual proíbe.

   `data-tema` é escolha da pessoa e ganha do sistema. Sem escolha, o sistema
   decide. É por isso que a regra de sistema está guardada com `:not()`.
   =========================================================================== */
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) { color-scheme:dark; }
}
:root[data-tema="escuro"] { color-scheme:dark; }

@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --em-cor:#F4F7FD;  /* o manual proíbe branco puro em texto */
    --ink:#E7ECF6; --ink-2:#B3BED6; --ink-3:#8592B1; --ink-4:#7C89A6;  /* 5,23 sobre a superfície escura */
    --em-coral:var(--navy-900);
  --em-perigo:var(--navy-900); --em-atencao:var(--navy-900); --em-ok:var(--navy-900);
    --em-perigo:var(--navy-900); --em-atencao:var(--navy-900); --em-ok:var(--navy-900);
    --canvas:var(--navy-900); --surface:var(--navy-800); --surface-2:#111A30;
    --line:#28324B; --line-2:#1D2540;
    --teal:#8FA3CC; --teal-2:#A9BADD;   /* no escuro o navy vira TINTA, não fundo */
  --teal-soft:#1B2540; --teal2:#7E8FB8;
    --coral:var(--coral-400); --coral-2:var(--coral-300); --coral-soft:#2A1B1E;
    --bege:var(--camel-300); --bege-soft:#2A2119;
    --perigo:#F08A80;  --perigo-fundo:#33191A; --perigo-borda:#5A2A28;
    --atencao:#E8A33D; --atencao-fundo:#2E2415; --atencao-borda:#54401E;
    --atencao-texto:#F0BC6B;
    --ok:#57BF9C;      --ok-fundo:#132A24;     --ok-borda:#25473C;
    --acao:#8FA3CC;    --acao-fundo:#1B2540;   --acao-borda:#2E3B60;

/* ---------------------------------------------------------------------------
   As cores, as medidas e o tipo saíram daqui e foram para `styles/tokens.css`,
   que é o primeiro arquivo do manifesto. Este bloco guarda só o que é ATIVO
   deste arquivo: as três logomarcas, que são dados (data-URI), não estilo.
   A gramática de cinco sentidos continua a mesma, palavra por palavra — ela
   agora mora no nível 2 do tokens.css, e o comentário dela foi junto.

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--ff-corpo);
  background:var(--canvas); color:var(--ink);
  font-size:var(--fs-corpo); line-height:var(--lh-corpo);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
/* TÍTULO É RED HAT DISPLAY, o resto é Inter. Num console a hierarquia vem do
   peso e do espaço, não do tamanho: por isso a escala é curta e o display
   aparece só onde há título de verdade. */
h1,h2,h3,h4,.h1,.h2,.h3{font-family:var(--ff-titulo);font-weight:700;line-height:var(--lh-titulo);letter-spacing:-.01em;}
h1,.h1{font-size:var(--fs-h1);}
h2,.h2{font-size:var(--fs-h2);}
h3,.h3{font-size:var(--fs-h3);}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
.mono{font-family:var(--ff-mono);font-variant-numeric:tabular-nums;}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:var(--r-1);}
::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-thumb{background:var(--neutral-300);border-radius:var(--r-2);border:3px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--neutral-400);background-clip:padding-box;border:3px solid transparent;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;}
.rail{width:216px;flex:0 0 216px;background:var(--rail);color:var(--rail-txt);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.brand{padding:16px 14px;border-bottom:1px solid var(--rail-linha);display:flex;align-items:center;gap:8px;position:relative;}
.brand-logo{flex:1;height:44px;background:var(--logo-rail) left center/contain no-repeat;min-width:0;}
.rail-toggle{flex:0 0 26px;width:26px;height:26px;border-radius:var(--r-3);border:1px solid var(--rail-linha);background:transparent;color:var(--rail-txt-2);cursor:pointer;display:grid;place-items:center;font-size:var(--fs-micro);transition:background .13s,color .13s;}
.rail-toggle:hover{background:var(--rail-hover);color:var(--em-cor);}
.shell.mini .rail{width:68px;flex:0 0 68px;}
.shell.mini .brand{flex-direction:column;gap:8px;padding:14px 8px;}
.shell.mini .brand-logo{width:40px;height:40px;flex:0 0 40px;background-image:var(--logo);background-position:center;}
.shell.mini .rail-toggle{width:100%;flex:0 0 22px;height:22px;}
/* Menu recolhido: ícone sozinho não diz o que é. Mostra o nome embaixo, pequeno —
   cabe nos 68px do menu e tira a adivinhação. */
.shell.mini .nav button{flex-direction:column;gap:3px;justify-content:center;padding:8px 2px;line-height:1.1;}
.shell.mini .nav button span{display:block;font-size:var(--fs-trilho-mini);letter-spacing:.01em;font-weight:700;
  text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.shell.mini .nav button svg{width:18px;height:18px;flex:0 0 18px;}
.shell.mini .nav button{position:relative;}
.shell.mini .nav .badge{position:absolute;top:3px;right:6px;margin:0;font-size:var(--fs-trilho-mini);padding:0 4px;min-width:0;}
.shell.mini .nav .sec{padding:10px 0 2px;text-align:center;font-size:0;border-top:1px solid var(--rail-hover);margin:6px 10px 0;}
/* Menu recolhido: o rodapé some por inteiro e sobra só a versão. A regra antiga
   escondia os elementos, mas o texto solto ("Estoque de…") continuava aparecendo
   espremido no canto. */
.shell.mini .rail-foot{padding:9px 2px;text-align:center;}
/* !important porque o bloco do usuário traz display:flex escrito no próprio
   elemento, e estilo inline vence a folha de estilo — era por isso que "sair" e
   "trocar conta" continuavam aparecendo com o menu recolhido. */
.shell.mini .rail-foot .rf-l{display:none !important;}
.brand .mark{width:38px;height:38px;flex:0 0 38px;background:var(--logo) center/contain no-repeat;}
.brand .mark span{display:none;}
.brand b{display:block;color:var(--em-cor);font-size:var(--fs-h3);font-weight:700;letter-spacing:-.01em;line-height:1.1;}
.brand small{display:block;font-size:var(--fs-nano);letter-spacing:.18em;text-transform:uppercase;color:var(--rail-txt-2);margin-top:3px;}
.nav{padding:10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto;}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--rail-txt);padding:10px 12px;border-radius:var(--r-3);font-size:var(--fs-h3);font-weight:600;transition:background .13s,color .13s;}
.nav button:hover{background:var(--rail-hover);color:var(--em-cor);}
.nav button.on{background:var(--surface);color:var(--ink);font-weight:600;}
.nav svg{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85;}
.nav button.on svg{opacity:1;}
.nav .badge{margin-left:auto;font-size:var(--fs-micro);font-weight:800;padding:2px 7px;border-radius:var(--r-pill);background:var(--rail-linha);color:var(--rail-txt);min-width:22px;text-align:center;}
.nav button.on .badge{background:var(--coral);color:var(--em-coral);}
.rail-foot{padding:13px 17px;border-top:1px solid var(--rail-linha);font-size:var(--fs-micro);color:var(--rail-txt);line-height:1.6;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:9px 22px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:30;}
.topbar h1{margin:0;font-size:var(--fs-h1);font-weight:800;letter-spacing:-.02em;line-height:1.25;}
/* subtítulo na MESMA linha do título: economiza uma faixa inteira em toda aba */
.topbar p{margin:0;font-size:var(--fs-apoio);color:var(--ink-3);}
@media (max-width:900px){.topbar p{display:none;}}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
/* O recuo de baixo era 70px fixos — pensado para o menu flutuante do celular.
   No computador aquilo virava uma faixa vazia embaixo da tabela. Agora só existe
   onde de fato há barra por cima do conteúdo. */
.page{padding:14px 22px 16px;}

/* ---------- primitivos ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;}
.card-h{padding:9px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:9px;}
.card-h h3,.card-h h2{margin:0;font-size:var(--fs-apoio);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);}
.card-h .sub{font-size:var(--fs-apoio);color:var(--ink-3);}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:var(--r-3);font-size:var(--fs-h3);font-weight:700;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .13s,border-color .13s,transform .08s;}
.btn:hover{background:var(--surface-2);border-color:var(--line);}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--acao-cheio);border-color:var(--acao-cheio);color:var(--em-acao);}
.btn.primary:hover{background:var(--acao-cheio-2);border-color:var(--acao-cheio-2);}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.ghost:hover{background:var(--slate-soft);}
/* vermelho em botão só para AÇÃO DESTRUTIVA — nunca para avançar etapa,
   concluir, enviar ou salvar. Esses são ação normal e usam a cor da interface. */
.btn.danger{color:var(--perigo);border-color:var(--perigo-borda);}
.btn.danger:hover{background:var(--red-soft);}
.btn[disabled]{opacity:.4;pointer-events:none;}
.btn.sm{padding:5px 10px;font-size:var(--fs-apoio);border-radius:var(--r-2);gap:5px;}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.inp,.sel{border:1px solid var(--line);border-radius:var(--r-3);padding:8px 11px;background:var(--surface);outline:none;transition:border-color .13s,box-shadow .13s;}
.inp:focus,.sel:focus{border-color:var(--teal);box-shadow:var(--ring);}
.inp::placeholder{color:var(--ink-4);}
/* ---------- os campos de busca das barras de filtro ----------
   Estes são INPUTS de verdade, e vivem em fileira com `select`s e chips de raio
   pequeno. Por isso continuam retangulares: a cápsula é da busca do TOPO, que
   é um alvo solto entre outras cápsulas (ver `refino.css`, bloco 3b). Misturar
   os dois formatos na mesma fileira quebra o alinhamento em vez de embelezar. */
.search{position:relative;}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-4);fill:none;stroke-width:1.8;}
.search .inp{padding-left:33px;}
label.fld{display:block;}
label.fld > span{display:block;font-size:var(--fs-micro);font-weight:700;color:var(--ink-3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.07em;}
label.fld .inp,label.fld .sel{width:100%;}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:11px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 13px;position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--slate);}
.kpi.red::before{background:var(--red);} .kpi.amber::before{background:var(--amber);} .kpi.teal::before{background:var(--teal);}
.kpi .lbl{font-size:var(--fs-nano);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:700;}
.kpi .val{font-size:var(--fs-num-g);font-weight:800;letter-spacing:-.03em;margin-top:3px;line-height:1;}
.kpi.red .val{color:var(--red);} .kpi.amber .val{color:var(--amber);}
.kpi .foot{font-size:var(--fs-micro);color:var(--ink-3);margin-top:3px;line-height:1.35;}
.kpi .val .un{font-size:var(--fs-apoio);font-weight:600;letter-spacing:0;color:var(--ink-3);margin-left:2px;}
.slip-t .et-nota{font-size:var(--fs-nano);font-weight:700;letter-spacing:.02em;margin-top:1px;}
.selbar-prod{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.selbar-chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:var(--fs-corpo);font-weight:600;}
.selbar-chk span{white-space:nowrap;}
.selbar-n{margin-left:6px;font-size:var(--fs-corpo);}
.selbar-acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
table.t th i{font-style:normal;font-weight:600;color:var(--ink-4);font-size:var(--fs-nano);letter-spacing:.04em;}


/* ---------- tabela ---------- */
/* A tabela rola dentro de si mesma, e este limite reservava 320px para o
   cabeçalho. Depois que o topo encolheu, aquilo virava faixa vazia embaixo.
   Com 250px a tabela ocupa o que sobrou de verdade. */
.tw{overflow:auto;max-height:calc(100vh - 250px);}
@media(max-height:800px){.tw{max-height:calc(100vh - 225px);}}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-dado);}
table.t th{position:sticky;top:0;z-index:5;background:var(--surface-2);text-align:left;padding:9px 11px;font-size:var(--fs-nano);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;}
table.t th.s{cursor:pointer;user-select:none;}
/* Pedidos: mesmo formato de sempre, só em escala menor. E as colunas de texto
   (Situação, Ação) deixam de esticar para ocupar a sobra — era daí o espaço
   vazio enorme. O SKU fica com a folga, com espaço para 25 caracteres. */
.t-ped{font-size:var(--fs-micro);table-layout:fixed;}
/* com largura fixa, conteúdo maior que a célula vazaria por cima da coluna
   vizinha — cada célula quebra dentro do seu próprio espaço */
.t-ped td,.t-ped th{overflow:hidden;overflow-wrap:break-word;}
.t-ped td .s{white-space:normal !important;line-height:1.35;}
/* Demanda: 16 colunas — larguras fixas para o navegador não repartir a sobra
   entre elas, que é o que criava vão e obrigava a rolar para o lado.

   As colunas de NÚMERO saíram de porcentagem para PIXEL. O motivo: o número é
   monoespaçado e de corpo fixo, então o espaço de que ele precisa não muda com
   a largura da janela — quem tem de ceder é o texto. Em porcentagem, `1.200`
   aparecia como `1.20` e `117 aj.` ficava cortado, e número cortado ao meio não
   é densidade: é a pessoa lendo o valor errado. Agora só SKU e Situação
   respiram com a janela. */
.t-dem{font-size:var(--fs-micro);table-layout:fixed;}
@media(max-width:1200px){
  .t-dem col:nth-child(3){width:13%;}   /* SKU cede primeiro */
  .t-dem col:nth-child(4){width:8%;}    /* depois a Situação */
}
.t-dem td,.t-dem th{overflow:hidden;overflow-wrap:break-word;}
.t-dem td .s{white-space:normal !important;line-height:1.35;}
.t-dem td,.t-dem th{padding:4px 4px;}
.t-dem th{font-size:var(--fs-nano);letter-spacing:.02em;white-space:normal;line-height:1.25;vertical-align:bottom;}
.t-dem .p{font-size:var(--fs-micro);}
.t-dem .s{font-size:var(--fs-nano);}
.t-dem .tag{font-size:var(--fs-nano);padding:1px 6px;white-space:normal;display:inline-block;text-align:left;}
.t-dem .sku{font-size:var(--fs-micro);}
.t-dem .btn.sm{padding:3px 7px;font-size:var(--fs-micro);}
.t-dem .num .s{white-space:normal;line-height:1.35;}
@media(max-width:1200px){
  .t-dem{font-size:var(--fs-micro);}
  .t-dem td,.t-dem th{padding:3px 3px;}
  .t-dem .btn.sm{padding:2px 6px;font-size:var(--fs-nano);}
}
.t-ped td,.t-ped th{padding:4px 5px;}
.t-ped th{font-size:var(--fs-nano);letter-spacing:.04em;}
.t-ped .sku-trunc{max-width:100%;font-size:var(--fs-apoio) !important;}
.t-ped select.sel{width:100%;max-width:none;padding:2px 5px;font-size:var(--fs-micro);}
.t-ped .tag{font-size:var(--fs-nano);padding:1px 6px;}
.t-ped .p{font-size:var(--fs-micro);}
/* a divisão do adesivo ("300 embalar · 0 mix") não pode esticar a coluna Qtd */
.t-ped td.num .s{white-space:normal;font-size:var(--fs-nano);line-height:1.35;}
.t-ped .s{font-size:var(--fs-nano);}
.t-ped .btn.sm{padding:3px 8px;font-size:var(--fs-micro);}
/* Situação e Ação QUEBRAM em vez de esticar. Uma única linha com texto longo
   ("Adiantar · estoque 20% · no prazo · pode deixar p/ depois" tem 481px)
   definia a largura da coluna inteira, deixando as outras com espaço vazio. */
.t-ped td.col-sit{white-space:normal;line-height:1.6;}
/* a etiqueta tem "não quebrar" no estilo base — dentro desta coluna ela precisa
   quebrar, senão o texto sai por cima da coluna de Ação */
.t-ped td.col-sit .tag{display:inline-block;white-space:normal;text-align:left;margin:1px 0;}

.t-ped td.col-acao{white-space:normal;line-height:1.85;}
.t-ped td.col-acao .btn{margin:1px 0;}
@media(max-width:1200px){
  .t-ped{font-size:var(--fs-micro);}
  .t-ped td,.t-ped th{padding:3px 3px;}
  .t-ped .sku-trunc{max-width:140px;}
  .t-ped select.sel{max-width:92px;}
  .t-ped .btn.sm{padding:3px 7px;font-size:var(--fs-micro);}
}
.btn.ic{padding:4px 6px;line-height:0;}
.btn.ic svg{width:15px;height:15px;}
/* coluna de ação comum: sem fixar nem separar — a tabela cabe na tela */
table.t th.s:hover{color:var(--ink);}
table.t th .ar{color:var(--teal);margin-left:2px;}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle;}
.sku-trunc{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
table.t tbody tr{transition:background .1s;}
table.t tbody tr:hover{background:var(--linha-hover);}
table.t tbody tr.on{background:var(--teal-soft);}
table.t tbody tr.clickable{cursor:pointer;}
/* "table.t th" tem prioridade maior que ".num", então os títulos das colunas
   numéricas ficavam à esquerda enquanto os números iam à direita. */
table.t th.num{text-align:right;}
.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;white-space:nowrap;}
/* todo SKU do app copia com um clique — daí o cursor e o realce no hover */
/* célula editável: parece texto até receber o cursor, para a tabela não virar um formulário */
.cel-qtd{width:100%;max-width:62px;border:1px solid transparent;border-radius:var(--r-2);background:transparent;
  font:inherit;font-family:var(--mono);font-size:var(--fs-dado);text-align:right;padding:2px 5px;color:inherit;
  -moz-appearance:textfield;transition:border-color .12s,background .12s;}
.cel-qtd::-webkit-outer-spin-button,.cel-qtd::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.cel-qtd:hover{border-color:var(--line);background:var(--surface-2);}
.cel-qtd:focus{outline:0;border-color:var(--teal);background:var(--surface);box-shadow:var(--ring);}
.cel-qtd::placeholder{color:var(--amber);font-size:var(--fs-micro);opacity:.85;}
.et-nome{font-size:var(--fs-nano);color:var(--ink-4);letter-spacing:-.01em;text-align:right;}
.sku{font-family:'IBM Plex Mono',monospace;font-size:var(--fs-apoio);font-weight:500;white-space:nowrap;cursor:copy;border-radius:var(--r-1);transition:background .12s,box-shadow .12s;}
.sku:hover{background:var(--teal-soft);box-shadow:var(--ring);}
@media print{.sku{cursor:auto;}.sku:hover{background:none;box-shadow:none;}}
.desc{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);}
.chk{width:15px;height:15px;accent-color:var(--teal);cursor:pointer;}


/* ---------- tags ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-micro);font-weight:700;padding:3px 10px;border-radius:var(--r-pill);white-space:nowrap;background:var(--slate-soft);color:var(--slate);}
/* Os nomes de COR (red/amber/teal) continuam funcionando porque estão em
   dezenas de telas, mas agora são apelidos dos nomes de SIGNIFICADO. Código
   novo escreve `perigo`, `atencao`, `ok`; nenhum dos dois desanda. */
.tag.perigo,.tag.red{background:var(--perigo-fundo);color:var(--perigo);}
.tag.atencao,.tag.amber{background:var(--atencao-fundo);color:var(--atencao);}
.tag.ok,.tag.teal{background:var(--ok-fundo);color:var(--ok);}
.tag.acao{background:var(--acao-fundo);color:var(--acao);}
.tag.neutro{background:var(--neutro-fundo);color:var(--neutro);}
/* pedido de campanha: bege, a cor que o app já usa para data festiva */
.tag.campanha{background:var(--bege-soft);color:var(--camel-700);}
.tag.dot::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;}
.abc{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:var(--r-1);font-size:var(--fs-micro);font-weight:700;}
.abc.A{background:var(--tinta-cheia);color:var(--em-tinta);} .abc.B{background:var(--line);color:var(--ink);} .abc.C{background:var(--line-2);color:var(--ink-3);}
.prio{display:inline-block;min-width:30px;text-align:center;font-weight:700;font-size:var(--fs-apoio);padding:2px 6px;border-radius:var(--r-2);background:var(--slate-soft);color:var(--slate);font-family:'IBM Plex Mono',monospace;}
.prio.hi{background:var(--red);color:var(--em-cor);} .prio.mid{background:var(--amber-soft);color:var(--amber);}

/* ---------- ASSINATURA: régua de cobertura ---------- */
.regua{width:140px;height:24px;position:relative;}
.regua .track{position:absolute;left:0;right:0;top:9px;height:6px;background:var(--line-2);border-radius:var(--r-1);}
.regua .fill{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-1);background:var(--teal);}
.regua .fill.red{background:var(--red);} .regua .fill.amber{background:var(--amber);} .regua .fill.gray{background:var(--neutro-fraco);}
.regua .lead{position:absolute;top:3px;width:1.5px;height:18px;background:var(--ink-2);opacity:.6;}
.regua .lead::after{content:'';position:absolute;top:-2px;left:-2.5px;width:6.5px;height:2px;background:var(--ink-2);border-radius:var(--r-1);}
.regua .cap{position:absolute;right:0;top:-3px;font-size:var(--fs-nano);color:var(--ink-3);font-family:'IBM Plex Mono',monospace;}
/* A legenda explica a tabela, mas só é lida uma vez — não pode ocupar 120px
   embaixo de TODA tela para sempre. Fica recolhida numa linha e abre no clique.
   Usei clique e não passar-o-mouse de propósito: é texto para ler com calma,
   e no celular não existe mouse. */
.legenda{border-top:1px solid var(--line-2);background:var(--surface-2);font-size:var(--fs-apoio);color:var(--ink-3);}
.legenda > summary{list-style:none;cursor:pointer;padding:5px 16px;font-size:var(--fs-micro);font-weight:700;
  letter-spacing:.02em;color:var(--ink-4);display:flex;align-items:center;gap:6px;user-select:none;}
.legenda > summary::-webkit-details-marker{display:none;}
.legenda > summary::before{content:'ⓘ';font-size:var(--fs-apoio);}
.legenda > summary::after{content:'mostrar';margin-left:auto;opacity:.75;font-weight:600;}
.legenda[open] > summary::after{content:'ocultar';}
.legenda > summary:hover{color:var(--ink-2);background:var(--line-2);}
.legenda-in{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:2px 16px 11px;}
.legenda-in i{display:inline-block;width:14px;height:5px;border-radius:var(--r-1);vertical-align:middle;margin-right:5px;}

/* ---------- .pq · o mesmo recado, recolhido ----------
   Explicação inline. Fica numa linha discreta e abre no clique. */
.pq{margin:10px 0 0;}
.pq > summary{list-style:none;cursor:pointer;font-size:var(--fs-apoio);font-weight:700;letter-spacing:.02em;
  color:var(--ink-4);display:inline-flex;align-items:center;gap:6px;user-select:none;padding:2px 0;}
.pq > summary::-webkit-details-marker{display:none;}
.pq > summary::before{content:'ⓘ';font-size:var(--fs-apoio);}
.pq > summary:hover{color:var(--ink-2);}
.pq > div{font-size:var(--fs-dado);color:var(--ink-3);line-height:1.65;margin-top:6px;padding:1px 0 2px 12px;
  border-left:2px solid var(--line-2);}
.pq > div .kv{border-bottom:0;}

/* ---------- .bloco · conteúdo sem moldura ----------
   Resumo e leitura não precisam de card: espaço e uma linha bastam,
   e aí o conteúdo parece maior do que a moldura que o contém. */
.bloco{padding:2px 2px 4px;}
.grid-dados .col > * + .bloco{border-top:1px solid var(--line-2);padding-top:16px;margin-top:2px;}
.bloco-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:0 0 10px;}
.bloco-h h3{margin:0;font-size:var(--fs-apoio);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);}
.bloco-h .sub{font-size:var(--fs-apoio);color:var(--ink-3);}
.grid-dados .col > .bloco + .card{margin-top:2px;}

/* ---------- as duas ações do balcão ----------
   Botão grande porque a pessoa está de pé, com a prestadora esperando, e porque
   são as duas únicas coisas que ela vem fazer nesta tela. */
.acoes-topo{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.btn.grande{padding:13px 20px;font-size:var(--fs-h3);border-radius:var(--r-3);}
.btn.grande svg{width:18px;height:18px;}

/* ---------- linha do tempo da prestadora ---------- */
.tl{display:flex;flex-direction:column;}
.tl-i{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--line-2);}
.tl-i:last-child{border-bottom:0;}
.tl-d{font-family:var(--mono);font-size:var(--fs-apoio);color:var(--ink-4);white-space:nowrap;padding-top:2px;min-width:74px;}
.tl-c{font-size:var(--fs-dado);line-height:1.55;color:var(--ink-2);}
.tl-c b{color:var(--ink);}
.tl-c i{display:block;font-style:normal;font-size:var(--fs-micro);color:var(--ink-4);margin-top:2px;}
.tl-i.saida .tl-c b{color:var(--coral-2,var(--red));}
.tl-i.ok .tl-c b{color:var(--ok);}

/* ---------- a tela de retirada ----------
   Blocos com pouca moldura: o que interessa é o conteúdo, e a pessoa está de pé
   no balcão com a prestadora esperando. */
.rt-bloco{border:1px solid var(--line);border-radius:var(--r-3);padding:12px 14px;margin-bottom:10px;background:var(--surface-2);}
.rt-bloco-h{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:var(--fs-apoio);}
.rt-bloco-h b{font-size:var(--fs-micro);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);}
.rt-resumo{margin-left:auto;font-size:var(--fs-apoio);color:var(--ink-2);font-weight:600;text-align:right;}
.rt-chips{display:flex;gap:7px;flex-wrap:wrap;}
.rt-lab{font-size:var(--fs-micro);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:11px 0 5px;}
.rt-mats{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.rt-mat{display:flex;gap:8px;align-items:center;}
.rt-mat-in{flex:1;min-width:0;}
.rt-un{font-size:var(--fs-apoio);color:var(--ink-3);min-width:34px;}
.rt-conf{font-size:var(--fs-apoio);color:var(--ink-3);flex:1;min-width:0;}
@media (max-width:720px){.rt-mat{flex-wrap:wrap;}.rt-mat-in{flex:1 0 100%;}.rt-conf{flex:1 0 100%;}}

/* ---------- quem mais está no app ----------
   Mesma família visual do "Tudo salvo": um pontinho e uma frase curta. */
.presenca{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  background:var(--surface);border-radius:var(--r-pill);padding:5px 12px;font-size:var(--fs-apoio);
  color:var(--ink-2);cursor:pointer;font-family:inherit;white-space:nowrap;}
.presenca:hover{border-color:var(--ink-4);color:var(--ink);}
.presenca .presenca-p{width:7px;height:7px;border-radius:50%;background:var(--teal);flex:none;}
/* "alguém também está no app" é contexto, não risco: nunca foi um alerta */
.presenca.amber,.presenca.neutro{border-color:var(--line);}
.presenca.amber .presenca-p,.presenca.neutro .presenca-p{background:var(--neutro);}
@media (max-width:900px){.presenca{display:none;}}

/* ---------- a ordem que não foge ---------- */
.ordem-presa{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-apoio);color:var(--ink-3);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 6px 3px 11px;}
.ordem-presa svg{width:13px;height:13px;stroke:var(--ink-4);fill:none;stroke-width:1.8;}
tr.recem{background:var(--bege-soft)!important;}
tr.recem td:first-child{box-shadow:inset var(--marca-lat) var(--bege);}
tr.novo-fila td:first-child{box-shadow:inset var(--marca-lat) var(--teal);}

/* ---------- filtros ---------- */
.filters{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line-2);}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:var(--r-pill);font-size:var(--fs-apoio);font-weight:700;color:var(--ink-2);transition:all .13s;display:inline-flex;align-items:center;gap:5px;}
.chip:hover{border-color:var(--line);}
.chip.on{background:var(--coral);border-color:var(--coral);color:var(--em-coral);box-shadow:var(--sh-acao);}
.chip b{font-family:'IBM Plex Mono',monospace;opacity:.7;}
.divider{width:1px;height:20px;background:var(--line);}
.selbar{background:var(--tinta-cheia);color:var(--em-tinta);padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:var(--fs-corpo);}
.selbar .btn{background:var(--rail-hover);border-color:var(--rail-linha);color:var(--em-cor);}
.selbar .btn:hover{background:var(--rail-2);}
.selbar .btn.primary{background:var(--acao-cheio);border-color:var(--acao-cheio);color:var(--em-acao);}

/* ---------- modal / drawer ---------- */
.ov{position:fixed;inset:0;background:var(--veu-modal);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto;animation:fade .16s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--r-3);width:100%;max-width:1000px;box-shadow:var(--sh-3);animation:pop .18s cubic-bezier(.2,.8,.3,1);}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
/* v8.90 · REPINTAR NÃO É REABRIR. `repintarModal()` troca o nó do véu, e nó novo
   com `animation` no CSS toca a animação de abertura outra vez: o véu volta de
   opacity 0 e o modal renasce em scale(.99) translateY(10px). Quem repinta marca
   o nó com esta classe; quem ABRE (janelaPintar, primeira inserção) não marca e
   continua animando normalmente. */
.ov.sem-reabrir,.ov.sem-reabrir .modal{animation:none;}
.modal-h{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
.modal-h h2{margin:0;font-size:var(--fs-h1);font-weight:700;letter-spacing:-.02em;}
.modal-b{padding:20px 22px;max-height:72vh;overflow:auto;}
/* tabela dentro de modal: nunca deveria precisar de rolagem lateral em tela grande */
.modal .tw{overflow-x:auto;}
.modal table.t{width:100%;}
@media (max-width:1200px){.modal-b{max-height:66vh;}}
.modal-f{padding:15px 22px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:0 0 var(--r-3) var(--r-3);}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:110;box-shadow:var(--sh-gaveta);display:flex;flex-direction:column;animation:slide .2s cubic-bezier(.2,.8,.3,1);}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.drawer-h{padding:18px 22px;border-bottom:1px solid var(--line);}
.drawer-b{padding:20px 22px;overflow:auto;flex:1;}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 14px;font-size:var(--fs-corpo);padding:14px 0;border-bottom:1px solid var(--line-2);}
.kv dt{color:var(--ink-3);} .kv dd{margin:0;font-weight:600;text-align:right;font-family:'IBM Plex Mono',monospace;}
.secao{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin:20px 0 8px;}

/* ---------- toast ---------- */
.toasts{position:fixed;bottom:22px;right:22px;left:auto;transform:none;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:min(430px,calc(100vw - 32px));}
.toast{position:relative;background:var(--tinta-cheia);color:var(--em-tinta);padding:11px 40px 11px 16px;border-radius:var(--r-3);font-size:var(--fs-corpo);font-weight:500;box-shadow:var(--sh-3);animation:up .2s cubic-bezier(.2,.8,.3,1);display:flex;align-items:flex-start;gap:9px;border-left:4px solid var(--ok);}
/* aviso de três linhas com o ✓ no meio da altura fica torto: o ícone pertence
   à PRIMEIRA linha do texto, não ao centro do bloco */
.toast > svg{margin-top:2px;}
.toast.erro{background:var(--perigo);border-left-color:var(--perigo-borda);}
/* o X: encostado na direita, discreto até o mouse chegar perto */
.toast-x{position:absolute;right:5px;top:50%;transform:translateY(-50%);background:none;border:0;padding:7px;color:var(--em-cor);opacity:.6;border-radius:var(--r-2);display:grid;place-items:center;line-height:0;}
.toast-x:hover{opacity:1;background:var(--veu-4);}
.toast-x svg{width:13px;height:13px;stroke-width:2.4;}
/* ---------- o aviso não pode tapar o botão ----------
   O aviso mora no canto inferior direito (8.12) e o rodapé de toda janela mora
   embaixo. Com uma janela aberta, o toast cobria justamente o botão principal —
   "Salvar e imprimir o papel" some atrás de "Pedido 2002 criado". A pessoa
   clica no aviso achando que é o botão.
   Com janela ou gaveta aberta, o aviso sobe para o canto de CIMA: continua no
   mesmo canto da tela, longe de qualquer rodapé. Navegador sem `:has()` fica
   com o comportamento antigo — nada quebra, só não melhora. */
body:has(.ov) .toasts,body:has(.drawer) .toasts{top:var(--sp4,16px);bottom:auto;}
/* em tela estreita o canto vira faixa: 430px não cabem num celular */
@media (max-width:720px){.toasts{left:14px;right:14px;max-width:none;align-items:stretch;}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- estados ---------- */
.empty{padding:64px 26px;text-align:center;}
.empty .ic{width:46px;height:46px;margin:0 auto 16px;border-radius:var(--r-3);background:var(--slate-soft);display:grid;place-items:center;}
.empty .ic svg{width:22px;height:22px;stroke:var(--ink-3);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.empty h3{margin:0 0 8px;font-size:var(--fs-h2);font-weight:700;}
.empty p{margin:0 auto 20px;color:var(--ink-3);font-size:var(--fs-h3);max-width:470px;line-height:1.65;}

/* ---------- os três vazios ----------
   "Ainda não há nada", "os filtros esconderam tudo" e "acabou o trabalho" são
   três notícias diferentes e precisam parecer diferentes. Antes as três saíam
   como a mesma frase cinza no meio da tabela e quem lia não sabia se devia
   cadastrar, limpar o filtro, ou simplesmente seguir a vida.
   O tamanho é parte do recado: sem dados ocupa a tela, sem resultado ocupa
   menos, tudo resolvido quase não ocupa. */
.vaz{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;}
.vaz .vaz-ic{display:grid;place-items:center;border-radius:var(--r-md);flex:none;}
.vaz .vaz-ic svg{stroke-width:1.6;}
.vaz h4{margin:0;font-size:var(--fs-h2);font-weight:700;letter-spacing:-.01em;color:var(--ink);}
.vaz p{margin:0;font-size:var(--fs-corpo);line-height:1.6;color:var(--ink-3);max-width:44ch;}
.vaz .vaz-fez{margin-top:4px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

/* 1. nenhum dado — a tela está esperando alguém começar: ocupa espaço e chama */
.vaz.v-nada{padding:42px 20px;}
.vaz.v-nada .vaz-ic{width:46px;height:46px;background:var(--slate-soft);}
.vaz.v-nada .vaz-ic svg{width:22px;height:22px;stroke:var(--ink-3);}

/* 2. nenhum resultado — os dados existem, estão atrás do filtro: nota, não tela */
.vaz.v-filtro{padding:32px 20px;}
.vaz.v-filtro .vaz-ic{width:38px;height:38px;background:var(--surface);
  border:1px dashed var(--line);}
.vaz.v-filtro .vaz-ic svg{width:17px;height:17px;stroke:var(--ink-4);}
.vaz.v-filtro h4{font-size:var(--fs-h3);color:var(--ink-2);}
.vaz.v-filtro p{max-width:62ch;}

/* 3. tudo resolvido — boa notícia: uma linha só, sem botão. Não é um problema
   a resolver, é a ausência de um; ocupar meia tela com isso seria mentira. */
.vaz.v-pronto{padding:22px 20px;flex-direction:row;justify-content:center;
  align-items:center;gap:9px;text-align:left;}
.vaz.v-pronto > div{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.vaz.v-pronto .vaz-ic{width:21px;height:21px;border-radius:50%;background:var(--teal-soft);align-self:center;}
.vaz.v-pronto .vaz-ic svg{width:12px;height:12px;stroke:var(--teal);stroke-width:2.8;}
.vaz.v-pronto h4{font-size:var(--fs-h3);font-weight:600;color:var(--ink-2);}
.vaz.v-pronto p{max-width:none;font-size:var(--fs-dado);color:var(--ink-4);}
/* dentro de tabela o vazio não é uma célula: é um recado no lugar das linhas */
tr.tr-vazio:hover td{background:none;}
tr.tr-vazio td{padding:0 !important;border:0;background:none;cursor:default;}
/* .t .btn.primary é esvaziado de propósito dentro das linhas (ali ele compete
   com o dado). Aqui não há dado nenhum para competir: o botão volta a ser botão. */
.t tr.tr-vazio .btn.primary{background:var(--acao-cheio);border-color:var(--acao-cheio);color:var(--em-acao);}
.t tr.tr-vazio .btn.primary:hover{background:var(--acao-cheio-2);border-color:var(--acao-cheio-2);color:var(--em-acao);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
/* Dados: os 3 passos empilhados numa coluna, o resto na outra. A ordem da
   importação é uma sequência, então tem de ser lida de cima para baixo. */
.grid-dados{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:start;}
.grid-dados > .card{margin:0;}
.grid-dados .col{display:flex;flex-direction:column;gap:12px;min-width:0;}
@media(max-width:900px){.grid-dados{grid-template-columns:1fr;}}
.passos{counter-reset:p;display:grid;gap:14px;}
.passo{display:flex;gap:14px;align-items:flex-start;}
.passo .n{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:var(--tinta-cheia);color:var(--em-tinta);display:grid;place-items:center;font-size:var(--fs-apoio);font-weight:700;}
.passo h4{margin:2px 0 4px;font-size:var(--fs-h3);font-weight:700;}
.passo p{margin:0 0 8px;font-size:var(--fs-dado);color:var(--ink-3);line-height:1.6;}
.dz{border:1.5px dashed var(--line);border-radius:var(--r-3);padding:13px;text-align:center;transition:all .15s;background:var(--surface-2);}
.dz.over{border-color:var(--teal);background:var(--teal-soft);}
.bar{height:6px;border-radius:var(--r-1);background:var(--line-2);overflow:hidden;}
.bar > i{display:block;height:100%;background:var(--teal);border-radius:var(--r-1);}
.dz svg{width:26px;height:26px;stroke:var(--ink-3);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.toast svg{width:15px;height:15px;flex:0 0 15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.loading{padding:80px;text-align:center;color:var(--ink-3);font-size:var(--fs-h3);}


/* ---------- navegação por seções ---------- */
.nav .sec{font-size:var(--fs-nano);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:14px 11px 6px;}
.nav .sec:first-child{padding-top:4px;}

/* ---------- fotos de produto ---------- */
.foto{width:44px;height:44px;border-radius:var(--r-3);object-fit:cover;background:var(--line-2);display:block;flex:0 0 44px;}
.foto-ph{width:44px;height:44px;border-radius:var(--r-3);background:var(--slate-soft);display:grid;place-items:center;font-size:var(--fs-nano);font-weight:700;color:var(--ink-4);flex:0 0 44px;letter-spacing:.04em;}
.foto-lg{width:100%;aspect-ratio:1;border-radius:var(--r-3);object-fit:cover;background:var(--line-2);}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;padding:16px;}
/* resumo de uma linha no topo dos Pedidos: volume à esquerda, o que exige decisão à direita */
.resumo{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 16px;margin-bottom:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3);box-shadow:var(--shadow);}
.res-num{font-size:var(--fs-h3);color:var(--ink-2);}
.res-num b{font-size:var(--fs-h1);font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-right:3px;}
.res-num span{color:var(--ink-3);font-size:var(--fs-corpo);}
.res-alertas{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;}
.res-al{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:4px 11px;
  font:inherit;font-size:var(--fs-dado);font-weight:600;cursor:pointer;color:var(--ink-2);transition:background .12s,border-color .12s;}
.res-al:hover{border-color:var(--ink-4);}
.res-al.red,.res-al.perigo{color:var(--perigo);border-color:var(--perigo-borda);background:var(--perigo-fundo);}
.res-al.coral{color:var(--coral-2);border-color:var(--coral-200);background:var(--coral-soft);}
.res-al.amber,.res-al.atencao{color:var(--atencao);border-color:var(--atencao-borda);background:var(--atencao-fundo);}
.res-ok{font-size:var(--fs-dado);color:var(--ink-3);}
.pcard{position:relative;border:1px solid var(--line);border-radius:var(--r-3);overflow:hidden;background:var(--surface);transition:box-shadow .15s,transform .1s;cursor:pointer;}
.pcard.on{border-color:var(--coral);box-shadow:var(--ring-coral);}
/* controles só aparecem no hover ou com o card selecionado: a grade continua limpa */
.pcard-ac{position:absolute;top:6px;left:6px;right:6px;display:flex;align-items:flex-start;z-index:2;opacity:0;transition:opacity .12s;}
.pcard:hover .pcard-ac,.pcard.on .pcard-ac{opacity:1;}
.pcard-chk{background:var(--surface);border-radius:var(--r-2);padding:2px 3px 0;line-height:0;box-shadow:var(--sh-2);cursor:pointer;}
.pcard-x{margin-left:auto;width:23px;height:23px;border-radius:50%;border:0;background:var(--surface);color:var(--red);
  font-size:var(--fs-apoio);font-weight:800;line-height:1;cursor:pointer;box-shadow:var(--sh-2);display:grid;place-items:center;padding:0;}
.pcard-x:hover{background:var(--red);color:var(--em-cor);}
.pcard:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
.pcard .ph{width:100%;aspect-ratio:1;background:var(--slate-soft);display:grid;place-items:center;color:var(--ink-4);font-size:var(--fs-micro);font-weight:600;}
.pcard img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--line-2);}
.pcard .body{padding:10px 12px 12px;}
.pcard .n{font-size:var(--fs-dado);font-weight:600;line-height:1.35;height:34px;overflow:hidden;}
.pcard .s{font-family:'IBM Plex Mono',monospace;font-size:var(--fs-micro);color:var(--ink-3);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------- pessoas ---------- */
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:var(--fs-micro);font-weight:700;color:var(--em-cor);background:var(--slate);flex:0 0 28px;letter-spacing:.02em;}
.av.lg{width:40px;height:40px;flex:0 0 40px;font-size:var(--fs-h3);}
.pessoa{display:inline-flex;align-items:center;gap:7px;}
.quem{display:flex;gap:9px;flex-wrap:wrap;padding:16px;border-bottom:1px solid var(--line-2);align-items:center;}
.quem button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:5px 14px 5px 6px;display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-corpo);font-weight:600;transition:all .13s;}
.quem button:hover{border-color:var(--line);}
.quem button.on{background:var(--tinta-cheia);border-color:var(--tinta-cheia);color:var(--em-tinta);}

/* ---------- tarefas ---------- */
.tarefa{border:1px solid var(--line);border-radius:var(--r-3);padding:15px 16px;display:flex;gap:15px;align-items:flex-start;background:var(--surface);margin-bottom:11px;}
/* A exceção chama atenção pela BARRA, não pelo fundo. Tabela densa com linha
   inteira tingida fica pesada e, pior, o vermelho vira textura de fundo — deixa
   de ser um sinal e passa a ser decoração. */
.tarefa.urg{border-color:var(--perigo-borda);box-shadow:inset var(--marca-lat) var(--perigo);}
.tarefa .info{flex:1;min-width:0;}
.tarefa h4{margin:0 0 4px;font-size:var(--fs-h3);font-weight:700;letter-spacing:-.01em;}
.tarefa .meta{font-size:var(--fs-dado);color:var(--ink-3);line-height:1.6;}
.tarefa .acao{display:flex;flex-direction:column;gap:7px;align-items:stretch;min-width:150px;}
.passos-fluxo{display:flex;align-items:center;gap:6px;font-size:var(--fs-micro);color:var(--ink-4);margin-top:9px;flex-wrap:wrap;}
.passos-fluxo b{color:var(--teal);font-weight:700;}

.linkicon{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-apoio);color:var(--teal);text-decoration:none;font-weight:600;}
.linkicon:hover{text-decoration:underline;}
.linkicon svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;}
.aviso{background:var(--atencao-fundo);border:1px solid var(--atencao-borda);border-radius:var(--r-3);padding:11px 14px;font-size:var(--fs-dado);color:var(--atencao-texto);line-height:1.6;margin-bottom:14px;}
.hint{font-size:var(--fs-apoio);color:var(--ink-3);line-height:1.6;}
.rowform{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
@media(max-width:720px){.rowform{grid-template-columns:1fr;}.tarefa{flex-direction:column;}.tarefa .acao{width:100%;}}



/* ============================================================================
   NAVEGAÇÃO GLOBAL NO TELEFONE — a barra de baixo e a folha do "Mais"
   ----------------------------------------------------------------------------
   Acima de 720px nada disto existe: o trilho manda. Abaixo de 720px o trilho
   sai inteiro e esta barra assume, presa embaixo, ao alcance do polegar.
   Ela não é um menu novo — é o mesmo `nav`, o mesmo `podeAba`, os mesmos
   contadores, com quatro alvos em vez de quinze.
   O fundo é o navy do trilho nos DOIS temas: a barra é estrutura, não conteúdo,
   e trocar de cor com o tema faria a pessoa achar que mudou de aplicativo.
   ============================================================================ */
.barra-mob{display:none;}
.bm-folha,.bm-folha-ov{display:none;}

@media (max-width:720px){
  /* o trilho sai de cena — e sai de verdade, não encolhido */
  .rail{display:none;}
  .shell{display:block;}
  /* espaço para a barra não cobrir a última linha da tabela */
  .main{padding-bottom:calc(58px + env(safe-area-inset-bottom,0px));}

  .barra-mob{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:var(--rail);border-top:1px solid var(--rail-linha);
    padding-bottom:env(safe-area-inset-bottom,0px);}
  .barra-mob button{position:relative;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;min-height:56px;padding:7px 2px 8px;border:0;background:transparent;
    color:var(--rail-txt);font-family:var(--ff-corpo);font-size:var(--fs-micro);font-weight:600;
    letter-spacing:.01em;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .barra-mob button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;}
  .barra-mob button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* a aba aberta: tinta cheia e um traço coral em cima. Coral aqui é seleção
     de marca, como no resto do sistema — nunca alarme. */
  .barra-mob button.on{color:var(--em-cor);}
  .barra-mob button.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:2px;
    background:var(--coral);border-radius:0 0 var(--r-1) var(--r-1);}
  .barra-mob button:active{background:var(--veu-1);}
  /* o contador: número, não bolha. Bolha vermelha em quatro alvos vira semáforo. */
  .bm-n{position:absolute;top:5px;left:calc(50% + 7px);font-style:normal;
    font-family:'IBM Plex Mono',monospace;font-size:var(--fs-nano);font-weight:700;
    color:var(--rail-acento);line-height:1;}
  .bm-n.urg{color:var(--rail-perigo);}

  /* ---- a folha do "Mais": sobe de baixo, para o polegar chegar primeiro no
       que está mais perto ---- */
  .bm-folha-ov{display:block;position:fixed;inset:0;z-index:59;background:var(--veu-modal);}
  .bm-folha{display:block;position:fixed;left:0;right:0;z-index:61;
    bottom:calc(56px + env(safe-area-inset-bottom,0px));
    max-height:62vh;overflow-y:auto;background:var(--rail);
    border-top:1px solid var(--rail-linha);border-radius:var(--r-3) var(--r-3) 0 0;
    padding:0 0 var(--sp2);}
  .bm-alca{width:34px;height:3px;border-radius:var(--r-pill);background:var(--veu-3);
    margin:9px auto 4px;}
  .bm-sec{padding:12px 16px 5px;font-size:var(--fs-nano);font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--rail-txt);}
  .bm-folha button{position:relative;display:flex;align-items:center;gap:11px;width:100%;
    padding:11px 16px;border:0;background:transparent;color:var(--rail-txt);
    font-family:var(--ff-corpo);font-size:var(--fs-corpo);font-weight:600;text-align:left;cursor:pointer;}
  .bm-folha button svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .bm-folha button.on{color:var(--em-cor);background:var(--veu-2);}
  .bm-folha button:active{background:var(--veu-1);}
  .bm-folha .bm-n{position:static;margin-left:auto;font-size:var(--fs-apoio);}
}

/* ---------- abas internas (v8.62) ----------
   Barra estilo sistema desktop: a ativa se funde com a área de trabalho
   embaixo, as outras ficam recuadas. Overflow horizontal com rolagem própria —
   com muitas abas a barra rola, e nunca empurra a tela nem quebra em duas
   linhas. */
.abas {
  display: flex; align-items: flex-end; gap: 2px;
  padding: 0 18px; margin: 0;
  background: var(--bg-2, #f3f4f6);
  border-bottom: 1px solid var(--line-2);
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: thin;
}
.abas::-webkit-scrollbar { height: 5px; }
.abas::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
.aba {
  display: flex; align-items: center; flex: 0 0 auto;
  max-width: 220px;
  border: 1px solid var(--line-2); border-bottom: none;
  border-radius: 7px 7px 0 0;
  background: transparent;
  margin-bottom: -1px;
}
.aba .aba-ir {
  border: 0; background: none; cursor: pointer;
  font: inherit; font-size: 12.5px; color: var(--ink-2);
  padding: 7px 4px 7px 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.aba .aba-x {
  border: 0; background: none; cursor: pointer;
  font-size: 15px; line-height: 1; color: var(--ink-4);
  padding: 4px 9px 5px 4px; border-radius: 4px;
}
.aba .aba-x:hover { background: var(--line-2); color: var(--ink-1); }
.aba:hover { background: var(--bg-1, #fff); }
.aba.on {
  background: var(--bg-1, #fff);
  border-color: var(--line-2);
  box-shadow: 0 -2px 0 var(--acao) inset;
}
.aba.on .aba-ir { color: var(--ink-1); font-weight: 600; }
/* o ponto do rascunho não salvo entra na etapa 3 e já tem lugar guardado aqui */
.aba .aba-sujo { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); margin-left: 2px; }
@media (max-width: 720px) { .abas { padding: 0 10px; } .aba { max-width: 150px; } }

/* ---------- impressão (ordem de corte, romaneio, fechamento) ---------- */

@media print{

  .folha .pill.critico{background:var(--perigo);border-color:var(--perigo);color:var(--pr-papel);}
  .folha .tot-f{margin-top:12px;display:flex;gap:26px;justify-content:flex-end;font-size:12px;}
  .folha .tot-f b{font-size:15px;}
  .folha .apagar-f{border:2.5px solid var(--teal);border-radius:10px;padding:10px 16px;font-size:13px;}
  .folha .ass{display:flex;gap:40px;margin-top:34px;}

  .folha .quebra{page-break-after:always;}

  /* colunas (e não grid): o navegador respeita "não cortar canhoto" na virada da página */
  .papeis{column-count:2;column-gap:5mm;margin-top:8px;}
  .slip{display:inline-block;width:100%;box-sizing:border-box;margin:0 0 5mm;break-inside:avoid;page-break-inside:avoid;
    border:1.8px solid var(--teal);border-radius:9px;font-size:9px;line-height:1.5;overflow:hidden;}
  .slip-band{display:flex;align-items:center;gap:8px;background:var(--teal);color:var(--pr-papel);padding:4px 9px;}
  .slip-proc{font-weight:800;font-size:12.5px;letter-spacing:.05em;}
  .slip-num{font-size:9px;}
  .slip-num b{font-size:16px;font-family:'IBM Plex Mono',monospace;}
  .slip-band .pill{background:var(--pr-papel);color:var(--teal);border:0;font-size:8.5px;flex:0 0 auto;white-space:nowrap;}
  .slip-band .pill.critico{background:var(--coral);color:var(--pr-papel);}
  .slip-id{display:flex;align-items:center;gap:8px;padding:2px 9px 2px;}
  /* quantidade e QR na mesma faixa: economiza altura de bobina e deixa o balão fora do canto */
  .slip-topo{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:4px 9px 2px;}
  .slip-sku{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13.5px;letter-spacing:-.01em;}
  .slip-desc{font-size:var(--pr-corpo);color:var(--pr-tinta-2);margin-top:1px;}
  .slip-qtd{border:2px solid var(--teal);border-radius:7px;padding:2px 10px;display:flex;align-items:center;gap:6px;flex:0 0 auto;margin:0 auto;}
  .slip-qtd small{font-size:6.5px;letter-spacing:.1em;color:var(--neutro);white-space:nowrap;}
  .slip-qtd b{font-size:15px;font-family:'IBM Plex Mono',monospace;line-height:1;}
  .slip-qr{flex:1 1 0;text-align:center;line-height:1.25;min-width:0;}
  .slip-qr small{display:block;margin-top:2px;font-size:7.5px;letter-spacing:.02em;}
  .slip-qr svg{display:block;width:15mm;height:15mm;}
  .slip-qr small{display:block;font-size:6px;letter-spacing:.06em;font-weight:700;color:var(--teal);margin-top:1px;}
  .slip-linha{margin:3px 9px;font-size:8.5px;color:var(--rail);line-height:1.9;}
  .slip .cx{display:inline-block;width:10px;height:10px;border:1.6px solid var(--teal);border-radius:3px;flex:0 0 auto;}
  .slip .cx.on{position:relative;background:var(--pr-papel);}
  .slip .cx.on::after{content:"×";position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:800;color:var(--teal);line-height:1;}
  .slip .ckl{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;margin-right:9px;vertical-align:middle;}
  /* grade de 2 colunas: os itens ficam alinhados um sob o outro, e o rótulo

  .slip-ckl .ckl-tit{display:block;margin-bottom:1px;}
  .slip-ckl .ckl-grade{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;}

  .slip .slip-flex{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;}
  .slip .cxbox{flex:1 1 auto;min-width:40px;height:15px;border:1.3px solid var(--teal);border-radius:5px;background:var(--pr-papel);}
  /* espaço de escrever sem caixa: só o risco embaixo, como numa ficha de papel */
  .slip .linha-esc{flex:1 1 auto;min-width:40px;height:14px;border-bottom:1.3px solid var(--teal);}
  .slip .emb-l{display:flex;align-items:center;gap:4px;flex-wrap:wrap;line-height:2;}

  .slip-t th{background:var(--neutro-fundo);color:var(--rail);border:1.2px solid var(--teal);padding:3px 5px;font-size:8px;text-align:left;}
  .slip-ord{display:inline-grid;place-items:center;width:12px;height:12px;border-radius:50%;background:var(--coral);color:var(--pr-papel);font-size:8px;font-weight:800;vertical-align:-2px;}
  .slip-t td{border:1.2px solid var(--teal);padding:5px;font-size:8.5px;line-height:2;vertical-align:top;word-wrap:break-word;overflow-wrap:break-word;}
  /* só o contorno externo: o espaço em branco depois dos dois pontos é onde se escreve */
  .slip-nome{background:var(--surface-2);border:1.4px solid var(--teal);border-radius:6px;padding:5px 8px;margin:4px 9px !important;min-height:22px;}
  body.imprimindo.cupom .slip .ckl{margin-right:4px;}
  .slip-t td.et,.slip-t th.et{background:var(--neutro-fundo);font-weight:800;white-space:nowrap;letter-spacing:.03em;}
  .slip-t th.qc,.slip-t td.qc{text-align:center;white-space:nowrap;}
  .slip-t td.vazio{min-width:52px;height:15px;}
  .slip-t tr.emb td{background:var(--surface-2);line-height:2.1;}
  .slip-preencher{display:inline-block;min-width:34px;max-width:100%;border-bottom:1.4px solid var(--teal);height:10px;vertical-align:baseline;}
  .slip .qtd-g{font-size:11.5px;}
  .slip-rodape{margin:2px 9px;font-size:8.5px;background:var(--surface-2);border-radius:6px;padding:3px 7px;}
  /* valor que veio do cadastro: é instrução, não opção a marcar */
  .emb-def{font-size:11px;letter-spacing:.02em;}
}
/* cupom térmico 80mm */
@media print{
  body.cupom{font-size:12px;}
}
body.cupom .folha{width:72mm;}
@media print{
  body.imprimindo.cupom .folha .papeis{column-count:auto;columns:auto;display:block;}
  body.imprimindo.cupom .slip{display:block;border:0;border-radius:0;padding:0 0 3mm;font-size:11px;width:72mm;page-break-inside:avoid;margin-bottom:2mm;}
  /* ---------- um pedido, uma página ----------
     É o que faz a impressora cortar entre um canhoto e o outro: o driver corta
     no fim de cada página, e cada página passa a ser exatamente um pedido. O
     último não quebra, senão sai uma tira em branco no fim do rolo. */
  body.imprimindo.cupom.corta .slip{break-after:page;page-break-after:always;}
  body.imprimindo.cupom.corta .slip:last-child{break-after:auto;page-break-after:auto;margin-bottom:0;}
  /* qualquer sobra embaixo da folha empurra uma página inteira a mais — e uma
     página a mais numa térmica é um pedaço de papel em branco cortado fora */
  body.imprimindo.cupom.corta .folha{padding-bottom:0;margin-bottom:0;}
  body.imprimindo.cupom.corta .papeis{margin-bottom:0;}
  /* a marca de rasgar, para quem não tem corte automático no driver */
  body.imprimindo.cupom.marca .slip:not(:last-child)::after{
    content:"✂ - - - - - - - - - - - - - - - - - - - - - -";
    display:block;margin:3mm 0 0;font-size:9px;letter-spacing:.5px;color:var(--pr-tinta);text-align:center;}
  body.imprimindo.cupom .slip-band{flex-wrap:nowrap;gap:5px;}
  body.imprimindo.cupom .slip-proc{font-size:15px;margin-left:auto;margin-right:0;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.03em;}
  body.imprimindo.cupom .slip-num{flex:0 0 auto;white-space:nowrap;}
  body.imprimindo.cupom .slip-num b{font-size:19px;}
  /* o CRÍTICO vinha sendo empurrado para fora da bobina pelo nome do processo */
  body.imprimindo.cupom .slip-band .pill{font-size:8px;padding:1px 5px;flex:0 0 auto;}
  body.imprimindo.cupom .slip-id{flex-wrap:wrap;}
  /* ---- margem de segurança do canhoto inteiro ----
     A bobina nunca entra perfeitamente alinhada no mecanismo, e o que estiver
     encostado na borda sai cortado. Em vez de afastar elemento por elemento,
     o canhoto todo recua 3mm de cada lado e os recuos internos são zerados,
     para não somar duas margens e espremer o conteúdo. */
  body.imprimindo.cupom .slip{padding:0 3mm 4mm;}
  body.imprimindo.cupom .slip-band{padding:2px 0 3px;}
  body.imprimindo.cupom .slip-linha{margin-left:0;margin-right:0;}
  body.imprimindo.cupom .slip-nome{margin-left:0 !important;margin-right:0 !important;}
  body.imprimindo.cupom .slip-id{padding-left:0;padding-right:0;}
  body.imprimindo.cupom .slip-rodape{margin-left:0;margin-right:0;}
  body.imprimindo.cupom .slip-comofaz{margin-left:0;margin-right:0;}
  body.imprimindo.cupom .slip-topo{padding:4px 0 2px;gap:6px;}
  /* o QR fica à esquerda, longe da borda direita onde a bobina costuma cortar,
     e com zona clara de 4 módulos: sem essa moldura branca o leitor não acha o código */
  body.imprimindo.cupom .slip-qr{margin:0;}
  body.imprimindo.cupom .slip-qtd{margin-right:0;}
  body.imprimindo.cupom .slip-qtd b{font-size:18px;}
  body.imprimindo.cupom .slip-sku{font-size:15px;}
  body.imprimindo.cupom .slip-desc{font-size:10.5px;}
  body.imprimindo.cupom .slip-qtd b{font-size:16px;}
  body.imprimindo.cupom .slip .cx{width:12px;height:12px;}
  body.imprimindo.cupom .slip-linha{font-size:10px;}
  /* table-layout:fixed é o que faz a tabela obedecer à largura: sem isso a coluna
     CONF. MB impõe sua largura mínima e a tabela transborda a bobina inteira. */
  body.imprimindo.cupom .slip-t{width:100%;margin:3px 0;table-layout:fixed;}
  /* trava geral: nada dentro do canhoto pode ser mais largo que o canhoto.
     Vale para qualquer coisa que eu venha a acrescentar depois. */
  body.imprimindo.cupom .slip *{max-width:100%;box-sizing:border-box;}
  body.imprimindo.cupom .slip{overflow-x:hidden;}
  body.imprimindo.cupom .slip-t th.qc{font-size:8.5px;letter-spacing:-.01em;}
  /* com table-layout:fixed, texto maior que a célula vaza para fora da tabela;
     o cabeçalho precisa poder quebrar e ter recuo curto */
  body.imprimindo.cupom .slip-t th{padding:2px 3px;overflow-wrap:break-word;word-break:break-word;}
  body.imprimindo.cupom .slip-t td{overflow:hidden;}
  /* min-widths pensados para o A4: na bobina eles é que empurravam a tabela para fora */
  body.imprimindo.cupom .slip-t td.vazio{min-width:0;}
  body.imprimindo.cupom .slip .cxbox{min-width:0;}
  /* Se a linha não couber, ela QUEBRA — nunca corta. Contas de largura em pixels
     nunca batem exatamente com o que a impressora faz, então a quebra é a garantia. */
  body.imprimindo.cupom .slip .slip-flex{flex-wrap:wrap;gap:4px;row-gap:1px;}
  body.imprimindo.cupom .slip .est-par{display:inline-flex;gap:8px;white-space:nowrap;flex:0 0 auto;}
  /* quebrar dentro da palavra deixava "TRAVA/AGULH A"; assim ela quebra na barra */
  body.imprimindo.cupom .slip-t .et{white-space:normal;overflow-wrap:normal;word-break:normal;}
  /* checklist em duas colunas por proporção, não por pixels: sempre cabe na bobina */
  body.imprimindo.cupom .slip-ckl .ckl-grade{gap:0 6px;}
  body.imprimindo.cupom .slip-t th{font-size:9.5px;}
  body.imprimindo.cupom .slip-t td{font-size:10.5px;}
  body.imprimindo.cupom .slip-t td{padding:4px 3px;}
  body.imprimindo.cupom .slip-preencher{min-width:26px !important;}
  body.imprimindo.cupom .slip-t td.et{font-size:9.5px;}
  body.imprimindo.cupom .slip .qtd-g{font-size:15px;}
  body.imprimindo.cupom .slip .cx{width:12px;height:12px;}

  /* ---- térmica é 1 bit: imprime preto ou nada ----
     Cinza vira meio-tom esgarçado e some no papel; e fundo escuro com letra branca
     não sai de jeito nenhum, porque o navegador descarta o fundo e resta branco no branco.
     Por isso, no cupom, tudo é preto puro sobre branco, com traço mais grosso. */
  body.imprimindo.cupom .slip,
  body.imprimindo.cupom .slip *{color:var(--pr-tinta) !important;background:transparent !important;
    text-shadow:none !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body.imprimindo.cupom .slip-band{border-bottom:2.5px solid var(--pr-tinta);padding:2px 0 3px;margin-bottom:2px;}
  body.imprimindo.cupom .slip-proc{font-weight:800;letter-spacing:.06em;}
  body.imprimindo.cupom .slip-num,
  body.imprimindo.cupom .slip-num b{font-weight:800;}
  body.imprimindo.cupom .slip-band .pill{border:1.6px solid var(--pr-tinta) !important;font-weight:800;}
  body.imprimindo.cupom .slip-desc{font-weight:600;}      /* era cinza claro: sumia */
  body.imprimindo.cupom .slip-qtd{border:2.2px solid var(--pr-tinta);}
  body.imprimindo.cupom .slip-qtd small{font-weight:700;}
  body.imprimindo.cupom .slip-t th,
  body.imprimindo.cupom .slip-t td{border:1.5px solid var(--pr-tinta) !important;}
  body.imprimindo.cupom .slip-t th{font-weight:800;}
  body.imprimindo.cupom .slip-t td.et,
  body.imprimindo.cupom .slip-t th.et{font-weight:800;}
  body.imprimindo.cupom .slip .cx{border:2px solid var(--pr-tinta) !important;}
  body.imprimindo.cupom .slip .cxbox{border:1.8px solid var(--pr-tinta) !important;}
  body.imprimindo.cupom .slip .linha-esc{border-bottom:1.8px solid var(--pr-tinta) !important;height:15px;}
  body.imprimindo.cupom .slip-ord{border:1.6px solid var(--pr-tinta) !important;font-weight:800;}
  body.imprimindo.cupom .slip-nome,
  body.imprimindo.cupom .slip-comofaz{border:1.6px solid var(--pr-tinta) !important;}
  body.imprimindo.cupom .slip-preencher{border-bottom:1.8px solid var(--pr-tinta) !important;}
  body.imprimindo.cupom .slip-rodape{border:1.4px solid var(--pr-tinta) !important;padding:3px 6px;}
  /* o QR precisa de módulo grosso e zona clara: térmica esgarça ponto fino */
  /* dois códigos lado a lado: 26mm cada dá 3,6 pontos por módulo mesmo na versão 10 */
  body.imprimindo.cupom .slip-qr svg{width:26mm;height:26mm;}
  body.imprimindo.cupom .slip-qr small{font-size:6.5px;font-weight:600;line-height:1.2;}
  body.imprimindo.cupom .slip-qr small b{font-size:7px;font-weight:800;}
  body.imprimindo.cupom .slip-qr svg rect{fill:var(--pr-papel) !important;}
  body.imprimindo.cupom .slip-qr svg path{fill:var(--pr-tinta) !important;}
  /* margem de segurança: a bobina raramente imprime nos 72mm cheios e o recorte sai torto */
  body.imprimindo.cupom .folha{margin:0 auto;padding:0;}
  body.imprimindo.cupom .slip{margin-left:auto;margin-right:auto;}
}
/* O tamanho da página do cupom é injetado por JS em imprimir(), porque @page não aceita
   seletor de classe — e sem isso a impressão herdava o A4 com margem de 12mm, que é o
   que fazia o canhoto sair torto e deslocado na bobina. */

tr.fora td{opacity:.55;}
.kv{border-bottom:0;}
.tcell .p{font-size:12.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.tcell .s{font-size:10.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.tcell .s .sku{font-size:10px;}
