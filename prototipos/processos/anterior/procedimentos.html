.t td{vertical-align:middle;}
.regua{max-width:130px;}
.corte{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;padding:2.5px 9px;border-radius:999px;letter-spacing:.02em;border:1px solid transparent;}
.corte.c0{background:var(--perigo);color:var(--pr-papel);border-color:var(--perigo);}
.corte.c1{background:var(--perigo-fundo);color:var(--perigo);border-color:var(--perigo-borda);}
.corte.c2{background:var(--atencao-fundo);color:var(--atencao);border-color:var(--atencao-borda);}
.corte.c3{background:var(--neutro-fundo);color:var(--neutro);border-color:var(--line);}
.corte.c4{background:var(--surface-2);color:var(--ink-3);border-color:var(--line);}
.t th{white-space:nowrap;}
/* link é ação normal, e ação normal usa a cor da interface. O coral ficou
   reservado para SELEÇÃO (aba ativa, linha ativa, chip ligado, anel de foco). */
.lupa{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--acao);cursor:pointer;font:inherit;font-size:var(--fs-apoio);padding:2px 4px;border-radius:var(--r-2);}
.lupa:hover{background:var(--coral-soft);}
.lupa svg{width:12px;height:12px;}
.kpi.clicavel{cursor:pointer;transition:border-color .15s, transform .1s, box-shadow .15s;}
.kpi.clicavel:hover{border-color:var(--coral);transform:translateY(-1px);box-shadow:var(--shadow);}
.kpi.ativo{outline:2.5px solid var(--coral);outline-offset:-2.5px;}
.abc{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:var(--r-2);font-size:var(--fs-nano);font-weight:800;}
.abc.A{background:var(--acao-cheio);color:var(--em-acao);}
.abc.B{background:var(--abc-b-fundo);color:var(--abc-b-tinta);}
.abc.C{background:var(--surface-2);color:var(--ink-4);border:1px solid var(--line);}
/* o botão primário não precisa de halo: ele já é o único bloco cheio da tela.
   O brilho de 10px era escala de vitrine — em console industrial ele só
   engorda a linha. Fica a sombra de primeiro degrau, e só. */
.btn.primary{box-shadow:var(--sh-1);}
.fb-linha{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%;}
.fb-linha + .fb-linha{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line-2);}
.fb-topo{margin-bottom:2px;}
.fb-grupo{display:flex;align-items:center;gap:8px;}
.flabel{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);font-weight:800;flex:0 0 auto;min-width:48px;}
.filters{flex-wrap:wrap;}
@media(max-width:1200px){.grid2{grid-template-columns:1fr;}}
@media(max-width:900px){
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;flex-direction:row;z-index:60;}
  .brand,.rail-foot{display:none;}
  .nav{flex-direction:row;padding:6px;justify-content:space-around;}
  .nav button{flex-direction:column;gap:3px;font-size:10px;padding:7px 6px;position:relative;}
  .nav .badge{position:absolute;top:1px;right:2px;margin:0;font-size:9px;padding:1px 5px;}
  .main{padding-bottom:66px;}
  .page{padding:16px 13px 40px;}
  .topbar{padding:13px;}
  .tw{max-height:none;}
  .desc{max-width:150px;}
}


/* ============================================================================
   PASSE C · O QUE NÃO VAI PARA O PAPEL
   ----------------------------------------------------------------------------
   Papel não tem menu, não tem busca e não tem botão. O trilho de 216px, a barra
   de estado do topo e a barra do telefone estavam sendo impressos: gastavam
   tinta, empurravam a tabela para a direita e ainda saíam em branco sobre
   branco quando a impressora ignora o fundo colorido — que é o padrão.
   ============================================================================ */
@media print{
  .rail,.barra-mob,.topbar .right,.bm-folha,.bm-folha-ov,
  .toasts,.cmd-ov,.ov{display:none !important;}
  .shell{display:block !important;}
  .main{padding-bottom:0 !important;}
  /* A tinta clara existe para funcionar sobre cor cheia. No papel a cor cheia
     não sai: sobra texto branco sobre branco. Na folha, toda tinta é tinta. */
  .btn,.btn.primary,.tag,.abc,.avatar,.pessoa .av,.badge{
    color:var(--pr-tinta) !important;background:transparent !important;
    border-color:#999 !important;box-shadow:none !important;}
  .col-acao,.acoes-sec,th.col-acao{display:none !important;}
}

/* ============================================================================
   REFINO VISUAL — v7.31
   Uma camada só, no fim da folha, para o sistema visual ficar coerente entre
   todas as telas sem reescrever as regras que já funcionavam. O que ela faz:
   1. escala única de espaço, raio, sombra e foco
   2. tela de entrada com a marca, respirável e amigável
   3. barra lateral com hierarquia clara e bloco de conta no rodapé
   4. cabeçalho de página, cards, botões, chips, campos, tabelas e pop-ups
      falando a mesma língua
   Cores da marca intactas: azul var(--teal)/var(--rail), coral var(--coral), bege var(--bege).
   ============================================================================ */
/* Os tokens que este arquivo declarava — espaço, raio, elevação, anel e os
   tons do trilho — subiram para `styles/tokens.css`, que é a fonte única.
   Declarar de novo aqui criava uma segunda verdade: o `--rail` daqui e o do
   base.css eram valores diferentes com o mesmo nome, e ganhava quem viesse
   por último no manifesto. */
body{font-size:var(--fs-h3);line-height:1.5;}
:focus-visible{outline:0;box-shadow:var(--ring-coral);border-radius:var(--r-xs);}

/* ---------- 1. tela de entrada ----------
   Antes: um card genérico com a logo pequena em cima. Agora a marca ocupa o
   lugar dela, o texto acolhe, e os três estados (servidor, PIN, conta sem
   vínculo) usam exatamente a mesma moldura. */
.auth{min-height:100vh;display:grid;grid-template-rows:1fr auto;background:
  radial-gradient(1100px 620px at 50% -18%, var(--surface-2) 0%, transparent 62%), var(--canvas);}
.auth-in{display:grid;place-items:center;padding:var(--sp6) var(--sp4);}
.auth-card{width:min(432px,94vw);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-xl);box-shadow:var(--el3);overflow:hidden;animation:pop .22s cubic-bezier(.2,.8,.3,1);}
.auth-card.lg{width:min(500px,94vw);}
.auth-top{padding:var(--sp6) var(--sp5) var(--sp4);text-align:center;background:
  linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);border-bottom:1px solid var(--line-2);}
.auth-logo{width:170px;height:56px;margin:0 auto var(--sp4);background:var(--logo-claro) center/contain no-repeat;}
.auth-top h2{margin:0 0 var(--sp1);font-size:var(--fs-h1);font-weight:700;letter-spacing:-.02em;color:var(--ink);}
.auth-top p{margin:0;font-size:var(--fs-corpo);color:var(--ink-3);line-height:1.6;}
.auth-b{padding:var(--sp5);}
.auth-b .fld{margin-bottom:var(--sp3);}
.auth-b .inp,.auth-b .sel{width:100%;padding:11px 13px;border-radius:var(--r-sm);font-size:var(--fs-h3);}
.auth-b .btn{width:100%;justify-content:center;padding:12px 16px;font-size:var(--fs-h3);border-radius:var(--r-sm);}
.auth-b .btn.primary{box-shadow:var(--sh-2);}
.auth-b .btn + .btn{margin-top:var(--sp2);}
.auth-nota{margin:var(--sp4) 0 0;font-size:var(--fs-apoio);color:var(--ink-3);line-height:1.65;text-align:center;}
/* uma linha só, pequena e centrada, bem separada do cartão */
.auth-foot{padding:var(--sp5) var(--sp4) var(--sp5);display:flex;flex-wrap:wrap;
  align-items:center;justify-content:center;gap:7px;
  font-size:var(--fs-micro);color:var(--ink-4);}
.auth-foot .sinal-marca{width:54px;height:19px;flex:0 0 54px;}
.auth .aviso{margin:0 var(--sp5) var(--sp4);}

/* ---------- 1b. a entrada, sem faixa de cabeçalho ----------
   Variante `entrada` do MESMO card. Os outros três estados (segundo fator,
   cadastro do autenticador, conta sem vínculo) continuam com `.auth-top` e a
   faixa em degradê — nada ali foi tocado. Aqui o card é um bloco só: marca
   pequena à esquerda, saudação grande, subtítulo, campos com respiro, um botão
   da largura do card. Alinhamento à esquerda porque é formulário: o olho lê a
   etiqueta, o campo e o botão na mesma coluna, sem voltar ao centro. */
/* `94vw` no card + 16px de recuo dos dois lados no `.auth-in` pedem 398px numa
   tela de 390 — é a rolagem lateral de 9px que existe desde antes desta versão.
   `100%` já desconta o recuo do pai, e o card passa a caber. */
.auth-card.entrada{width:min(460px,100%);}
.auth-card.entrada .auth-b{padding:var(--sp6) var(--sp6) var(--sp5);}
.auth-card.entrada .auth-marca{width:126px;height:38px;margin:0 0 var(--sp5);
  background:var(--logo-auth) left center/contain no-repeat;}
.auth-card.entrada h2{margin:0 0 5px;font-size:27px;line-height:1.2;font-weight:800;
  letter-spacing:-.025em;color:var(--ink);}
.auth-card.entrada .auth-sub{margin:0 0 var(--sp6);font-size:var(--fs-corpo);
  color:var(--ink-3);line-height:1.55;}
.auth-card.entrada .fld{margin-bottom:var(--sp4);}
.auth-card.entrada .inp{padding:12px 14px;}
.auth-card.entrada .btn.primary{margin-top:var(--sp3);padding:15px 16px;font-weight:700;}
/* a ÚLTIMA nota fica separada por um fio: ela é recado de rodapé, não parte do
   formulário. Na tela do código há DUAS notas — o recado do código, no meio, e o
   "entrando como", no fim — e só a de baixo leva o fio. */
.auth-card.entrada .auth-b > .auth-nota:last-child{margin:var(--sp5) 0 0;
  padding-top:var(--sp4);border-top:1px solid var(--line-2);}
/* o botão secundário ("Gerar novo código") acompanha o principal */
.auth-card.entrada .btn + .btn{margin-top:var(--sp2);}
/* os chips de "qual autenticador" ficam à esquerda, como o resto do cartão */
.auth-card.entrada .mfa-fatores{justify-content:flex-start;}
/* a nota do MEIO do cartão (o recado do código) explica o campo logo acima —
   então ela segue o alinhamento dele, não o do rodapé */
.auth-card.entrada .auth-b > .auth-nota:not(:last-child){text-align:left;margin-top:var(--sp2);}
/* ---------- o campo dos seis dígitos ----------
   `.mfa-cod` pede 26px desde que foi escrito, e nunca ganhou: `.auth-b .inp`
   tem mais peso e fixava 14px. O defeito é anterior a esta versão (conferido
   na v8.94). Aqui a regra passa a valer, com o peso necessário — seis números
   lidos de um celular precisam de caractere largo. */
.auth-card.entrada .inp.mfa-cod{font-size:23px;padding:14px;}
@media (max-width:520px){ .auth-card.entrada .inp.mfa-cod{font-size:20px;} }
/* o aviso do arquivo local já mora DENTRO do corpo aqui, então não repete o recuo */
.auth-card.entrada .aviso{margin:0 0 var(--sp4);}

/* o olho da senha: dentro do campo, alvo de 32px, sem empurrar o texto */
.campo-senha{position:relative;}
.campo-senha .inp{padding-right:46px;}
.campo-senha .olho{position:absolute;right:7px;top:50%;transform:translateY(-50%);
  display:grid;place-items:center;width:32px;height:32px;padding:0;border:0;
  background:none;border-radius:var(--r-xs);cursor:pointer;color:var(--ink-4);
  transition:color .12s,background .12s;}
.campo-senha .olho:hover{color:var(--ink-2);background:var(--surface-2);}
.campo-senha .olho svg{width:18px;height:18px;display:block;stroke:currentColor;
  fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}

@media (max-width:520px){
  .auth-card.entrada .auth-b{padding:var(--sp5) var(--sp4) var(--sp4);}
  .auth-card.entrada h2{font-size:23px;}
  .auth-card.entrada .auth-marca{width:108px;height:33px;margin-bottom:var(--sp4);}
}

/* ---------- 2. barra lateral ----------
   O item ativo era um bloco branco cheio, que brigava com o conteúdo. Agora é
   um realce discreto com uma marca coral na borda — lê rápido e não grita. */
.rail{background:linear-gradient(180deg, var(--rail) 0%, var(--rail-2) 100%);}
.brand{padding:var(--sp4) var(--sp3);border-bottom:1px solid var(--rail-linha);}
.nav{padding:var(--sp3) var(--sp2);gap:1px;}
.nav button{position:relative;padding:9px 11px;border-radius:var(--r-sm);font-size:var(--fs-corpo);
  font-weight:600;color:var(--rail-txt);letter-spacing:-.005em;
  transition:background .14s ease, color .14s ease;}
.nav button::before{content:'';position:absolute;left:3px;top:50%;transform:translateY(-50%) scaleY(0);
  width:3px;height:19px;border-radius:var(--r-1);background:var(--coral);transition:transform .16s cubic-bezier(.2,.8,.3,1);}
.nav button:hover{background:var(--rail-hover);color:var(--em-cor);}
.nav button.on{background:var(--veu-2);color:var(--em-cor);font-weight:700;}
.nav button.on::before{transform:translateY(-50%) scaleY(1);}
.nav button.on svg{opacity:1;color:var(--em-cor);}
.nav svg{width:17px;height:17px;flex:0 0 17px;opacity:.7;}
.nav .sec{font-size:var(--fs-nano);letter-spacing:.15em;color:var(--rail-txt-2);padding:var(--sp4) 11px var(--sp1);opacity:.85;}
.nav .badge{background:var(--veu-3);color:var(--rail-txt);font-weight:700;font-size:var(--fs-nano);padding:1px 7px;}
.nav button.on .badge{background:var(--coral);color:var(--em-cor);}
.nav button:hover .badge{background:var(--veu-3);color:var(--em-cor);}
/* rodapé: estado do sistema em cima, bloco de conta embaixo — como uma conta de verdade */
.rail-foot{padding:var(--sp3);border-top:1px solid var(--rail-linha);font-size:var(--fs-micro);color:var(--rail-txt);}
.rf-estado{padding:0 4px var(--sp3);line-height:1.65;}
.rf-estado b{color:var(--rail-txt);font-weight:600;}
.rf-conta{display:flex;align-items:center;gap:var(--sp2);padding:7px;border-radius:var(--r-sm);
  background:var(--veu-1);transition:background .14s;}
.rf-conta:hover{background:var(--veu-2);}
.rf-conta .av{width:26px;height:26px;flex:0 0 26px;font-size:var(--fs-nano);}
.rf-nome{min-width:0;flex:1;line-height:1.25;}
.rf-nome b{display:block;color:var(--em-cor);font-size:var(--fs-apoio);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rf-nome span{display:block;font-size:var(--fs-nano);color:var(--rail-txt);letter-spacing:.04em;text-transform:uppercase;}
.rf-sair{display:flex;gap:var(--sp1);margin-top:var(--sp2);}
.rf-sair button{flex:1;border:1px solid var(--rail-linha);background:transparent;color:var(--rail-txt);
  border-radius:var(--r-xs);padding:5px 6px;font-size:var(--fs-micro);font-weight:600;transition:background .13s,color .13s;}
.rf-sair button:hover{background:var(--rail-hover);color:var(--em-cor);}
.rf-versao{display:block;width:100%;margin-top:var(--sp2);background:none;border:0;padding:2px;
  color:var(--rail-txt-2);font:inherit;font-size:var(--fs-nano);letter-spacing:.04em;text-align:center;cursor:pointer;}
.rf-versao:hover{color:var(--em-cor);}
.shell.mini .rf-estado,.shell.mini .rf-nome,.shell.mini .rf-sair{display:none;}
.shell.mini .rf-conta{justify-content:center;padding:5px;}
.shell.mini .rail-foot{padding:var(--sp2) var(--sp1);}
.shell.mini .nav button::before{left:1px;height:15px;}

/* ---------- 3. cabeçalho da página ---------- */
.topbar{padding:var(--sp3) var(--sp5);gap:var(--sp3);align-items:center;
  box-shadow:var(--sh-1);}
.topbar h1{font-size:var(--fs-h1);letter-spacing:-.025em;}
.topbar p{margin-top:2px;font-size:var(--fs-dado);line-height:1.45;}
.topbar .right{gap:var(--sp2);}
.page{padding:var(--sp4) var(--sp5) var(--sp6);}

/* ---------- 4. superfícies ---------- */
.card{border-radius:var(--r-lg);box-shadow:var(--el1);}
.card-h{padding:var(--sp3) var(--sp4);gap:var(--sp2);}
.card-h h3,.card-h h2{font-size:var(--fs-apoio);letter-spacing:.07em;}
.bloco-h h3{font-size:var(--fs-apoio);letter-spacing:.07em;}
.filters{padding:var(--sp3) var(--sp4);gap:var(--sp2);}
.fb-linha{gap:var(--sp2);}
.kpi{border-radius:var(--r-md);padding:var(--sp3) var(--sp4);box-shadow:var(--el1);}
.kpis{gap:var(--sp3);margin-bottom:var(--sp3);}
.resumo{border-radius:var(--r-md);padding:var(--sp3) var(--sp4);box-shadow:var(--el1);}

/* ---------- 5. controles ---------- */
.btn{border-radius:var(--r-sm);padding:9px 15px;font-size:var(--fs-corpo);font-weight:600;letter-spacing:-.005em;
  transition:background .14s, border-color .14s, box-shadow .14s, transform .08s;}
.btn:hover{box-shadow:var(--el1);}
.btn.primary{box-shadow:var(--sh-1);}
.btn.primary:hover{box-shadow:var(--sh-2);}
.btn.sm{padding:5px 11px;font-size:var(--fs-apoio);border-radius:var(--r-xs);}
.btn.ghost:hover{background:var(--slate-soft);box-shadow:none;}
.chip{padding:5px 12px;font-size:var(--fs-apoio);font-weight:600;border-radius:var(--r-pill);
  transition:background .14s, border-color .14s, color .14s, box-shadow .14s;}
.chip:hover{background:var(--surface-2);border-color:var(--line);}
.chip.on{box-shadow:var(--sh-acao);}
.chip.on:hover{background:var(--coral-2);border-color:var(--coral-2);}
.chip b{opacity:.62;font-weight:700;}
.chip.on b{opacity:.85;}
.inp,.sel{border-radius:var(--r-xs);padding:8px 11px;}
.inp:focus,.sel:focus{border-color:var(--teal);box-shadow:var(--ring);}
.fld > span{font-size:var(--fs-micro);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);}

/* ---------- 6. tabelas ---------- */
.t th{background:var(--surface-2);color:var(--ink-3);font-weight:700;letter-spacing:.05em;}
.t tbody tr{transition:background .1s;}
.t tbody tr:hover{background:var(--linha-hover);}
.sku:hover{box-shadow:var(--ring);}

/* ---------- 7. pop-ups ----------
   Todos com a mesma moldura: cabeçalho fino, corpo respirável, rodapé claro. */
.ov{background:var(--veu-modal);backdrop-filter:blur(3px);padding:var(--sp5) var(--sp4);}
.modal{border-radius:var(--r-xl);box-shadow:var(--el3);}
.modal-h{padding:var(--sp4) var(--sp5);gap:var(--sp3);}
.modal-h h2{font-size:var(--fs-h2);letter-spacing:-.025em;}
.modal-b{padding:var(--sp5);}
.modal-f{padding:var(--sp4) var(--sp5);gap:var(--sp2);border-radius:0 0 var(--r-xl) var(--r-xl);}
.drawer{box-shadow:var(--el3);}
.drawer-h{padding:var(--sp4) var(--sp5);}
.drawer-b{padding:var(--sp5);}
.secao{margin:var(--sp5) 0 var(--sp2);font-size:var(--fs-nano);letter-spacing:.1em;}
.aviso{border-radius:var(--r-sm);padding:var(--sp3) var(--sp4);}
/* a sombra mais funda é o que separa o aviso do fundo claro da tabela —
   com a sombra de antes ele se dissolvia no branco e passava despercebido */
.toast{border-radius:var(--r-sm);box-shadow:var(--sh-3);padding:11px 40px 11px 16px;}
.empty{padding:var(--sp7) var(--sp5);}
.empty .ic{border-radius:var(--r-md);}
.tarefa{border-radius:var(--r-md);box-shadow:var(--el1);}
.pcard{border-radius:var(--r-md);}


/* ---------- 8. ajustes finais ----------
   Coisas que só aparecem com a tela montada e dados de verdade dentro. */
/* a marca precisa de ar: encostada no topo o menu parece cortado */
.brand{padding:var(--sp5) var(--sp4) var(--sp4);align-items:center;}
.brand-logo{height:38px;}
.shell.mini .brand{padding:var(--sp4) var(--sp2) var(--sp3);}
/* cabeçalho de tabela: fica preso no topo ao rolar e pode quebrar em duas linhas.
   A regra antiga proibia quebra, e em coluna estreita o título saía cortado
   ("EM PRODU", "EST. RI") — o que obriga a adivinhar o que a coluna mostra. */
.tw thead th{position:sticky;top:0;z-index:3;box-shadow:inset 0 -1px 0 var(--line);}
/* o "não quebrar" do cabeçalho vem de três lugares diferentes da folha
   (`table.t th`, `.num`, `.t th`). Em vez de disputar especificidade com cada
   um deles, esta regra encerra o assunto: título de coluna sempre quebra. */
table.t th,table.t th.num{white-space:normal !important;overflow-wrap:break-word;line-height:1.2;vertical-align:bottom;}
/* nas duas tabelas densas o espaçamento entre letras era o que fazia "%Est."
   não caber e quebrar no meio — sem ele o título cabe numa linha só */
/* de novo a especificidade: `table.t th` traz letter-spacing .08em, e um
   `.t-ped th` solto não vence. Nas tabelas densas o espaçamento entre letras
   é justamente o que faz "%Est." não caber e quebrar no meio da palavra. */
table.t.t-ped th,table.t.t-dem th{letter-spacing:0;padding-left:3px;padding-right:3px;font-size:var(--fs-nano);}
.fb-ativos{flex:1 0 100%;}
/* linha da tabela: alvo de clique mais confortável e leitura menos apertada */
.t td{padding-top:7px;padding-bottom:7px;}
.t tbody tr:hover{background:var(--surface-2);}
/* selects e campos dentro de tabela não devem parecer botões grandes */
.t .sel,.t .inp{border-radius:var(--r-xs);}
/* barra de seleção com o mesmo raio dos cards */
.selbar{border-radius:0;}
/* alerta e legenda no mesmo tom das demais superfícies */
.legenda > summary{padding:7px var(--sp4);}
.legenda-in{padding:0 var(--sp4) var(--sp3);}
/* toasts não podem cobrir o rodapé da tabela em tela cheia */
.toasts{bottom:var(--sp5);}

/* botão da coluna Ação vinha com "não quebrar" do estilo base: em coluna
   estreita o rótulo saía cortado ("Papel impre…") e a operadora ficava sem
   saber o que o botão faz. Aqui ele quebra e cabe inteiro. */
.t-ped td.col-acao .btn,.t-dem td .btn.sm{white-space:normal;text-align:center;line-height:1.3;max-width:100%;}
.t-ped td.col-acao{padding-right:var(--sp2);}

/* ---------- 9. recolher e expandir o menu ----------
   A largura, o recuo dos itens e o tamanho do rótulo andam juntos na mesma
   curva. A logo faz travessia por opacidade em duas camadas — a horizontal
   sai enquanto a redonda entra — porque imagem de fundo não anima sozinha. */
.rail{transition:width .3s cubic-bezier(.32,.72,0,1), flex-basis .3s cubic-bezier(.32,.72,0,1);
  will-change:width;overflow:hidden;}
.brand{transition:padding .3s cubic-bezier(.32,.72,0,1);}
.brand-logo{position:relative;background-image:none;transition:height .3s cubic-bezier(.32,.72,0,1), width .3s cubic-bezier(.32,.72,0,1), flex-basis .3s cubic-bezier(.32,.72,0,1);}
.brand-logo::before,.brand-logo::after{content:'';position:absolute;inset:0;
  background-repeat:no-repeat;background-size:contain;transition:opacity .26s ease;}
.brand-logo::before{background-image:var(--logo-rail);background-position:left center;opacity:1;}
.brand-logo::after{background-image:var(--logo);background-position:center;opacity:0;}
.shell.mini .brand-logo{background-image:none;}
.shell.mini .brand-logo::before{opacity:0;}
.shell.mini .brand-logo::after{opacity:1;}
.rail-toggle{transition:background .13s, color .13s, width .3s cubic-bezier(.32,.72,0,1), height .3s cubic-bezier(.32,.72,0,1), flex-basis .3s cubic-bezier(.32,.72,0,1);}
.nav{transition:padding .3s cubic-bezier(.32,.72,0,1);}
.nav button{transition:background .14s ease, color .14s ease,
  padding .3s cubic-bezier(.32,.72,0,1), gap .3s cubic-bezier(.32,.72,0,1);}
.nav button span{transition:font-size .3s cubic-bezier(.32,.72,0,1), opacity .18s ease .06s;}
.nav button svg{transition:width .3s cubic-bezier(.32,.72,0,1), height .3s cubic-bezier(.32,.72,0,1), flex-basis .3s cubic-bezier(.32,.72,0,1);}
.nav .sec{transition:padding .3s cubic-bezier(.32,.72,0,1), font-size .3s cubic-bezier(.32,.72,0,1), opacity .18s;}
.rail-foot{transition:padding .3s cubic-bezier(.32,.72,0,1);}
.rf-conta{transition:background .14s, padding .3s cubic-bezier(.32,.72,0,1);}
/* o que some ao recolher sai desmaiando, em vez de desaparecer de um quadro
   para o outro — display:none não tem meio-termo, opacidade tem */
.rf-estado,.rf-nome,.rf-sair{transition:opacity .16s ease;}
.shell.mini .rf-estado,.shell.mini .rf-nome,.shell.mini .rf-sair{opacity:0;pointer-events:none;}
/* quem prefere menos movimento no sistema não recebe nenhum */
@media (prefers-reduced-motion: reduce){
  .rail,.brand,.brand-logo,.brand-logo::before,.brand-logo::after,.rail-toggle,
  .nav,.nav button,.nav button span,.nav button svg,.nav .sec,
  .rail-foot,.rf-conta,.rf-estado,.rf-nome,.rf-sair{transition:none !important;}
}

/* ---------- 10. barra de filtros ----------
   Só a fileira por onde se navega fica aberta. O resto vive atrás do botão
   "Filtros" e, fechado, volta como etiquetas que dizem o que está filtrando —
   cada uma com o seu ×. Menos ruído sem esconder o estado da tela. */
.fb-btn-filtro{border-color:var(--line);}
.fb-btn-filtro svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linejoin:round;}
/* o painel é filho de um flex container: sem largura total ele encolhe até o
   tamanho do conteúdo e o fundo cinza fica pela metade */
.fb-painel{flex:1 0 100%;width:100%;border-top:1px dashed var(--line);background:var(--surface-2);
  margin:var(--sp2) calc(var(--sp4) * -1) calc(var(--sp3) * -1);padding:var(--sp2) var(--sp4) var(--sp3);
  animation:painel .18s cubic-bezier(.2,.8,.3,1);}
.fb-painel .fb-linha{margin:0;}
@keyframes painel{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.fb-ativos{padding-top:var(--sp1);}
.fb-tira{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--teal2);
  background:var(--teal-soft);color:var(--teal-2);border-radius:var(--r-pill);padding:3px 6px 3px 11px;
  font-size:var(--fs-apoio);font-weight:600;transition:background .13s,border-color .13s;}
.fb-tira:hover{background:var(--teal-soft);border-color:var(--teal);}
.fb-tira span{display:grid;place-items:center;width:15px;height:15px;border-radius:50%;
  background:var(--neutro-fundo);font-size:var(--fs-nano);line-height:1;}
.fb-tira:hover span{background:var(--teal);color:var(--em-cor);}
/* os botões da barra de ações não precisam de emoji: o ícone já é do sistema */
.filters .btn svg{opacity:.9;}

/* ---------- 11. navegação mais silenciosa ----------
   O menu é meio de chegar ao conteúdo, não conteúdo. Aqui ele baixa o tom:
   inativo mais apagado, contadores sem caixa, divisões sem rótulo e um rodapé
   com uma informação só — quem está usando. */
/* (o tom do trilho é o do tokens.css: --rail-txt / --rail-txt-2) */
.nav button{color:var(--rail-txt);font-weight:500;}
.nav button svg{opacity:.55;}
.nav button:hover{background:var(--veu-1);color:var(--teal-soft);}
.nav button:hover svg{opacity:.85;}
.nav button.on{background:var(--veu-2);color:var(--em-cor);font-weight:600;}
.nav button.on svg{opacity:1;}
/* contador sem caixa: o número informa, a caixa só fazia barulho */
.nav .badge{background:none;color:var(--rail-txt);font-weight:600;font-size:var(--fs-micro);
  padding:0;min-width:0;font-family:'IBM Plex Mono',monospace;}
.nav button:hover .badge{background:none;color:var(--acao-borda);}
.nav button.on .badge{background:none;color:var(--rail-acento);}
/* Divisão sem rótulo: a separação continua, o texto some. Ele some do OLHO,
   não do documento — "Operação" e "Cadastros" continuam no DOM e continuam
   sendo lidos por leitor de tela, que é onde o rótulo de grupo faz falta.
   `color:transparent` está aqui junto do `font-size:0` de propósito: é o que
   distingue "texto escondido porque é redundante" de "texto que sumiu por
   engano". A varredura do design system cobra essa distinção. */
.nav .sec{font-size:0;color:transparent;padding:0;height:1px;margin:var(--sp3) 12px;background:var(--veu-2);}
.nav .sec:first-child{display:none;}
.shell.mini .nav .sec{margin:var(--sp3) 14px;padding:0;border:0;background:var(--veu-2);color:transparent;}
/* ---------- rodapé: uma linha e um menu ---------- */
.rail-foot{padding:var(--sp2);border-top:1px solid var(--veu-1);position:relative;}
.rf-conta{display:flex;align-items:center;gap:var(--sp2);width:100%;padding:7px;border:0;
  border-radius:var(--r-sm);background:transparent;color:inherit;text-align:left;cursor:pointer;
  transition:background .14s;}
.rf-conta:hover,.rf-conta.on{background:var(--veu-2);}
.rf-conta .av{width:26px;height:26px;flex:0 0 26px;font-size:var(--fs-nano);}
.rf-nome{min-width:0;flex:1;line-height:1.2;}
.rf-nome b{display:block;color:var(--em-cor);font-size:var(--fs-apoio);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rf-nome span{display:block;font-size:var(--fs-nano);color:var(--rail-txt);letter-spacing:.03em;}
.rf-mais{color:var(--rail-txt-2);font-size:var(--fs-h2);line-height:1;letter-spacing:.05em;}
.rf-conta:hover .rf-mais,.rf-conta.on .rf-mais{color:var(--teal-soft);}
.rf-menu{position:absolute;left:var(--sp2);right:var(--sp2);bottom:calc(100% - 2px);
  background:var(--rail-hover);border:1px solid var(--veu-3);border-radius:var(--r-sm);
  box-shadow:var(--sh-3);padding:4px;z-index:40;
  animation:pop .14s cubic-bezier(.2,.8,.3,1);}
.rf-menu button{display:block;width:100%;text-align:left;background:none;border:0;
  color:var(--rail-txt);font:inherit;font-size:var(--fs-apoio);padding:8px 10px;border-radius:var(--r-xs);transition:background .12s,color .12s;}
.rf-menu button:hover{background:var(--veu-2);color:var(--em-cor);}
.rf-menu button.on{background:var(--veu-3);color:var(--em-cor);}
.rf-menu button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;vertical-align:-2px;margin-right:8px;opacity:.85;}
.rf-sep{height:1px;background:var(--veu-3);margin:4px 6px;}
.shell.mini .rf-nome,.shell.mini .rf-mais{display:none;}
.shell.mini .rf-conta{justify-content:center;padding:5px;}
.shell.mini .rf-menu{left:4px;right:4px;font-size:var(--fs-micro);}
/* o topo passa a carregar o estado do sistema; as etiquetas ficam discretas */
.topbar .right .tag{background:var(--surface-2);color:var(--ink-3);font-weight:600;border:1px solid var(--line-2);}
.topbar .right .tag.red{background:var(--red-soft);color:var(--red);border-color:var(--perigo-borda);}
.topbar .right .tag.amber{background:var(--amber-soft);color:var(--amber);border-color:var(--atencao-borda);}

/* ---------- "está salvo?" ----------
   Botão, porque faz alguma coisa quando clicado (abre o que fazer). Mas é o
   botão mais quieto da barra: enquanto tudo vai bem ele tem peso de texto.
   Só ganha cor quando a resposta deixa de ser "sim". */
/* ---------- 3b. a busca do topo ----------
   Ela NÃO é um campo de texto — é um botão que abre a busca rápida (Ctrl K), e
   continua sendo. Mas aos olhos de quem usa é um campo, então tem cara de campo:
   cápsula, fundo discreto, lupa dentro, o atalho encostado à direita.

   O formato não veio de fora: TUDO nesta barra já é cápsula — `.tag`, `.presenca`
   e `.sinc` usam `--r-pill`. O botão retangular era o único fora do compasso.

   Por que os outros campos de busca do app NÃO viram cápsula: eles moram nas
   barras de filtro, lado a lado com `select`s e chips de 6px. Uma cápsula ali
   brigaria com o vizinho em vez de combinar. Ver o comentário em `base.css`. */
.btn.sm.busca-topo{border-radius:var(--r-pill);background:var(--surface-2);
  border-color:var(--line-2);color:var(--ink-3);font-weight:500;
  padding:6px 9px 6px 13px;gap:8px;min-width:214px;justify-content:flex-start;}
.btn.sm.busca-topo svg{stroke:var(--ink-4);flex:0 0 15px;}
/* o atalho encosta na direita, como a lupa da referência — e some sozinho
   abaixo de 900px pela regra que já existia em `.kbd-atalho` */
.btn.sm.busca-topo .kbd-atalho{margin-left:auto;background:var(--surface);
  border-color:var(--line-2);border-bottom-width:1px;}
.btn.sm.busca-topo:hover{background:var(--surface);border-color:var(--ink-4);
  color:var(--ink-2);box-shadow:var(--el1);}
.btn.sm.busca-topo:hover svg{stroke:var(--ink-2);}
/* tela estreita: a cápsula encolhe para o tamanho do conteúdo em vez de
   espremer os vizinhos — o atalho já saiu, então não sobra buraco */
@media (max-width:1100px){
  .btn.sm.busca-topo{min-width:0;padding:6px 13px;}
}

.sinc{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:none;
  border-radius:var(--r-sm);padding:4px 9px;font:inherit;font-size:var(--fs-apoio);font-weight:600;
  color:var(--ink-3);cursor:pointer;transition:background .12s,color .12s,border-color .12s;}
.sinc:hover{background:var(--surface-2);border-color:var(--line-2);color:var(--ink-2);}
.sinc b{font-weight:700;font-family:'IBM Plex Mono',monospace;font-size:var(--fs-micro);
  background:var(--surface-2);border-radius:var(--r-pill);padding:1px 6px;}
.sinc-p{width:6px;height:6px;border-radius:50%;background:var(--ink-4);flex:0 0 6px;}
.sinc.ok{color:var(--ok);} .sinc.ok .sinc-p{background:var(--ok);}
.sinc.andando{color:var(--ink-2);}
/* "Salvando…" é estado normal de passagem, não aviso: cinza pulsando basta */
.sinc.andando .sinc-p{background:var(--neutro-fraco);animation:pulsa 1.1s ease-in-out infinite;}
.sinc.espera{color:var(--atencao);background:var(--atencao-fundo);border-color:var(--atencao-borda);}
.sinc.espera:hover{background:var(--atencao-fundo);color:var(--amber);}
.sinc.espera .sinc-p{background:var(--amber);}
.sinc.erro{color:var(--perigo);background:var(--perigo-fundo);border-color:var(--perigo-borda);}
.sinc.erro:hover{background:var(--perigo-fundo);color:var(--red);}
.sinc.erro .sinc-p{background:var(--red);}
.sinc.erro b{background:var(--perigo-fundo);color:var(--red);}
@keyframes pulsa{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
@media (prefers-reduced-motion:reduce){.sinc.andando .sinc-p{animation:none;}}

/* ---------- 12. filtros principais à vista, o resto atrás de um botão ----------
   Busca, status e prioridade resolvem a maior parte do dia. Curva, setor,
   processo e fornecedor são ajuste fino e vivem em "Mais filtros". A prioridade
   virou um segmentado: seis opções no espaço de duas etiquetas soltas. */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-pill);overflow:hidden;background:var(--surface);}
.seg button{border:0;background:none;padding:5px 10px;font-size:var(--fs-apoio);font-weight:600;color:var(--ink-3);
  border-right:1px solid var(--line-2);transition:background .13s,color .13s;}
.seg button:last-child{border-right:0;}
.seg button:hover{background:var(--surface-2);color:var(--ink-2);}
/* branco sobre coral dá 3,10: coral é cor de CAIXA, não de fundo de texto.
   Sobre coral a tinta é navy — a mesma regra do chip e do badge do menu. */
.seg button.on{background:var(--coral);color:var(--em-coral);}
.seg button.on:hover{background:var(--coral-2);}
/* O teto de altura na barra de filtros cortava o painel "Mais filtros": ele
   abria e a segunda fileira ficava escondida atrás da tabela, obrigando a rolar
   dentro da própria barra. O painel tem duas fileiras — mostra inteiro. */
.filters{position:relative;z-index:8;}
.fb-painel{position:relative;z-index:9;}

/* ---------- 13. menu recolhido: o número vira um ponto ----------
   Com 68px de largura o contador ficava por cima do ícone e puxava o olho para
   a navegação — justamente o que ela não deveria fazer. Recolhido, ele informa
   só que existe algo ali; o número continua no rótulo ao expandir e no tooltip. */
.shell.mini .nav .badge{position:absolute;top:6px;right:12px;width:5px;height:5px;padding:0;
  border-radius:50%;background:var(--rail-txt-2);color:transparent;font-size:0;overflow:hidden;
  min-width:0;line-height:0;}
.shell.mini .nav button.on .badge{background:var(--coral);}
.shell.mini .nav button:hover .badge{background:var(--acao-borda);}
/* o rótulo abreviado ("Confer…", "Prestado…") também competia: fica mais apagado
   e só acende no item ativo ou sob o cursor */
.shell.mini .nav button span{color:var(--rail-txt-2);font-weight:600;}
.shell.mini .nav button.on span,.shell.mini .nav button:hover span{color:inherit;}

/* ponto âmbar no lugar da etiqueta "N p/ Magazord": o número já vive no Passo 4
   da aba Dados, e ali na barra ele só engordava o botão */
.pt-pendente{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:2px;vertical-align:middle;}


/* v8.20 · o motivo por escrito, embaixo da etiqueta de situação.
   Existe porque hover não é um jeito de guardar informação essencial: some
   ao tirar o mouse, não existe no toque e não sai na impressão. */
.sit-lista { list-style: none; margin: 4px 0 0; padding: 0; }
.sit-lista li {
  font-size:var(--fs-apoio); line-height: 1.45; color: var(--atencao-texto);
  background: var(--atencao-fundo); border-left: 2px solid var(--atencao-borda);
  padding: 2px 6px; margin-top: 2px; border-radius:0 var(--r-1) var(--r-1) 0;
}
@media print { .sit-lista li { background: none; color:var(--pr-tinta); border-left-color:var(--pr-tinta); } }

/* ============================================================================
   14. GRAMÁTICA VISUAL — botão faz, etiqueta informa, texto mostra
   Botão, chip, etiqueta, select e texto clicável tinham aparência parecida, e
   a leitura ficava lenta: era preciso interpretar cada elemento antes de saber
   se dava para clicar nele. Aqui cada registro ganha uma forma própria.
   ============================================================================ */

/* ---- FAZ: tem moldura, muda no hover, cursor de mão ---- */
.btn,.chip,.seg button,.ic-btn{cursor:pointer;}
.btn{font-weight:600;}
.btn:active,.chip:active,.ic-btn:active{transform:translateY(1px);}
/* botão de ícone: a ação secundária não precisa de moldura o tempo todo —
   ela aparece quando a linha recebe o cursor */
.ic-btn{display:inline-grid;place-items:center;width:26px;height:26px;padding:0;
  border:1px solid transparent;border-radius:var(--r-xs);background:transparent;color:var(--ink-4);
  transition:background .13s, color .13s, border-color .13s;}
.ic-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.ic-btn:hover{background:var(--slate-soft);border-color:var(--line);color:var(--ink-2);}
.t tbody tr:hover .ic-btn{color:var(--ink-3);}
.acoes-sec{display:flex;gap:2px;margin-top:3px;justify-content:flex-end;}

/* ---- INFORMA: sem moldura, sem hover, sem cursor de mão ---- */
.tag,.corte,.abc,.prio{cursor:default;border:0;box-shadow:none;}
.tag{font-weight:600;font-size:var(--fs-micro);padding:2px 9px;}
.corte{border:0;font-weight:700;}
/* a etiqueta de situação dentro da tabela é leitura, não alvo: sem caixa, com um
   ponto da própria cor. O número da linha volta a ser o que salta aos olhos. */
.t td.col-sit .tag,.t .tag.dot{background:transparent;padding:1px 0;font-weight:600;
  display:inline-flex;align-items:flex-start;}
.t td.col-sit .tag::before,.t .tag.dot::before{content:'';width:6px;height:6px;border-radius:50%;
  background:currentColor;display:inline-block;margin:5px 6px 0 0;flex:0 0 6px;}
/* micro-etiquetas ("aj.", "prov.") continuam caixinhas discretas — um ponto ali seria ruído.
   O `td:not(.col-sit)` evita que estas regras, mais específicas, desfaçam as de cima. */
.t td:not(.col-sit) .tag:not(.dot){background:var(--slate-soft);padding:1px 6px;}
.t td:not(.col-sit) .tag.ok:not(.dot),.t td:not(.col-sit) .tag.teal:not(.dot){background:var(--ok-fundo);}
.t td:not(.col-sit) .tag.atencao:not(.dot),.t td:not(.col-sit) .tag.amber:not(.dot){background:var(--atencao-fundo);}
.t td:not(.col-sit) .tag.perigo:not(.dot),.t td:not(.col-sit) .tag.red:not(.dot){background:var(--perigo-fundo);}
/* o "aj." e afins continuam etiqueta, mas sem virar caixinha dentro do número */
.t .tag.ok,.t .tag.teal{color:var(--ok);} .t .tag.atencao,.t .tag.amber{color:var(--atencao);}
.t .tag.perigo,.t .tag.red{color:var(--perigo);}

/* ---- MOSTRA: texto puro; se for clicável, a pista aparece no hover ---- */
.sku{cursor:default;border-radius:var(--r-1);}
.sku:hover{background:transparent;box-shadow:none;}
.t .sku.clickable,.t td[data-sku] .sku,.sku[data-sku]{cursor:pointer;}
.t .clickable:hover .sku,.sku[data-sku]:hover{background:var(--teal-soft);box-shadow:var(--ring);}
[data-minsku]{text-decoration:none !important;}
[data-minsku]:hover{text-decoration:underline dotted !important;}
/* select dentro de tabela é ação (muda dado), então mantém moldura — mas fina,
   para não pesar mais que o próprio conteúdo da célula */
.t .sel{border-color:var(--line-2);background:transparent;font-weight:600;color:var(--ink-2);}
.t .sel:hover{border-color:var(--line);background:var(--surface);}

/* ---- hierarquia entre botões: cheio = ação da tela, contornado = ação da linha ----
   Vinte botões navy empilhados numa lista pesam mais que os dados que eles
   acompanham. O da linha continua sendo botão, só que em contorno; ele se
   preenche quando o cursor chega. */
.t .btn.primary{background:transparent;color:var(--acao);border-color:var(--acao-borda);box-shadow:none;}
.t .btn.primary:hover{background:var(--acao);border-color:var(--acao);color:var(--em-cor);}
.t tbody tr:hover .btn.primary{border-color:var(--acao);}

/* ============================================================================
   15. LEITURA DA TABELA — comparar linhas é a função principal, não um efeito
   Alinhamento, agrupamento, abreviação, contraste e hierarquia. Nada some.
   ============================================================================ */

/* ---- prioridade: um ponto colorido e um código de largura fixa ----
   Com a palavra inteira e caixa cheia, cada linha exigia leitura. Com ponto +
   código, vinte linhas se comparam de relance, sem tirar a informação de lugar. */
.corte{background:none !important;padding:0;font-size:var(--fs-nano);font-weight:700;letter-spacing:.04em;
  font-family:'IBM Plex Mono',monospace;display:inline-flex;align-items:center;gap:5px;
  min-width:52px;color:var(--ink-3);}
.corte::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 7px;}
/* ---------- prioridade não pode competir com problema ----------
   Eram cinco cores (var(--perigo), --red, #C2410C, --amber, --ink-4), duas delas
   inventadas só para esta escala. Agora a escala usa a MESMA gramática:
   crítico e urgente são perigo de verdade, P1 é atenção, P2 e P3 são neutros
   em dois pesos. Comparar linha a linha continua fácil — o ponto e o peso da
   fonte fazem isso — sem gastar vermelho em pedido que está indo bem. */
.corte.c0{color:var(--perigo);font-weight:800;} .corte.c1{color:var(--perigo);}
.corte.c2{color:var(--atencao);}
/* P3 é a prioridade mais baixa, não a informação mais escondida:
   `--neutro-fraco` é papel de PREENCHIMENTO (2,67 sobre branco) e aqui é
   texto de 10px. O degrau mais fraco que ainda se lê é o `--ink-4`. */
.corte.c3{color:var(--neutro);} .corte.c4{color:var(--ink-4);}

/* ---- situação: código curto, cor no ponto, frase no title ---- */
.sit{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-nano);font-weight:700;
  letter-spacing:.04em;font-family:'IBM Plex Mono',monospace;color:var(--ink-3);white-space:nowrap;cursor:default;}
.sit::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px;}
.sit.perigo,.sit.red{color:var(--perigo);} .sit.atencao,.sit.amber{color:var(--atencao);}
.sit.ok,.sit.teal{color:var(--ok);} .sit.neutro{color:var(--neutro);}
.t td.col-sit{white-space:normal;line-height:1.9;}

/* ---- números: mesma família, mesma largura de dígito, mesma borda direita ---- */
.t td.num,.t th.num{font-variant-numeric:tabular-nums;text-align:right;}
.t td.num{font-family:'IBM Plex Mono',monospace;color:var(--ink);font-weight:600;}
.t td.num .s{font-weight:400;color:var(--ink-4);}

/* ---- agrupamento de colunas: um fio claro entre blocos de sentido ----
   Sem rótulo em duas linhas, sem esconder coluna: só um respiro que diz
   "daqui até ali é o mesmo assunto". */
.t-dem td:nth-child(4),.t-dem th:nth-child(4),
.t-dem td:nth-child(10),.t-dem th:nth-child(10),
.t-dem td:nth-child(15),.t-dem th:nth-child(15){border-left:1px solid var(--line);}
.t-ped td:nth-child(4),.t-ped th:nth-child(4),
.t-ped td:nth-child(6),.t-ped th:nth-child(6),
.t-ped td:nth-child(11),.t-ped th:nth-child(11){border-left:1px solid var(--line);}
/* a coluna de ação: ver o bloco 18, no fim da folha */

.sug-prio{font-family:'IBM Plex Mono',monospace;font-size:var(--fs-nano);font-weight:700;color:var(--ink-4);
  margin-left:4px;letter-spacing:.02em;cursor:default;}
.sug-prio.sobe{color:var(--red);}
/* a célula do pedido tem três informações curtas: não precisa de corte de linha */
.t-ped td.tcell .p{-webkit-line-clamp:none;display:block;}

/* ============================================================================
   16. PESO DA INFORMAÇÃO — cabeçalho com presença, decisório antes do contexto
   ============================================================================ */

/* ---- cabeçalho de grupo: quatro palavras que o olho encontra sem ler ---- */
.t thead tr.grupos th{position:sticky;top:0;z-index:6;height:23px;padding:0 4px;
  background:var(--surface-2);border-bottom:0;color:var(--ink-3);
  font-size:var(--fs-nano);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  text-align:left;vertical-align:middle;}
.t thead tr.grupos th + th{border-left:1px solid var(--line);}
/* a fileira dos títulos desce e continua presa ao rolar */
/* A fileira dos títulos desce 23px — mas SÓ nas duas tabelas que têm a fileira de
   grupos acima dela. A regra valia para toda tabela `.t`, e são trinta: em
   Conferência, Compras, Prestadoras, Histórico e Tarefas o cabeçalho descia sem
   nada em cima, e pela fresta de 23px apareciam pedaços das linhas passando por
   baixo — era o "cabeçalho com erro" e as "informações sobre expostas". */
.t-dem thead tr:not(.grupos) th,.t-ped thead tr:not(.grupos) th{top:23px;z-index:5;}

/* ---- títulos maiores e mais escuros; linhas um pouco mais leves ----
   Cabeçalho minúsculo com conteúdo minúsculo obriga a ler tudo. Título com
   presença e linha mais leve deixa o olho pousar onde precisa. */
table.t.t-ped th,table.t.t-dem th{font-size:var(--fs-micro);color:var(--ink-2);font-weight:700;
  letter-spacing:.02em;padding-top:8px;padding-bottom:8px;}
.t-ped td,.t-dem td{font-size:var(--fs-apoio);}

/* ---- decisório mais forte, contexto mais discreto ----
   Tudo continua na tela; o que pesa na decisão é que chega primeiro ao olho. */
.t td.num{font-weight:600;color:var(--ink-2);}
/* Demanda: vendas, estoque real, mínimo, necessidade e demanda de produção */
.t-dem td:nth-child(5),.t-dem td:nth-child(6),.t-dem td:nth-child(7),
.t-dem td:nth-child(10),.t-dem td:nth-child(15){color:var(--ink);font-weight:700;font-size:var(--fs-dado);}
/* Demanda: a abertura do que já está em produção é contexto */
.t-dem td:nth-child(11),.t-dem td:nth-child(12),
.t-dem td:nth-child(13),.t-dem td:nth-child(14){color:var(--ink-3);font-weight:500;}
/* Pedidos: quantidade, vendas, estoque real e mínimo */
.t-ped td:nth-child(5),.t-ped td:nth-child(6),
.t-ped td:nth-child(7),.t-ped td:nth-child(8){color:var(--ink);font-weight:700;font-size:var(--fs-dado);}
/* Pedidos: quem vai fazer é contexto ao lado do número */
.t-ped td:nth-child(4){color:var(--ink-3);}
/* processo, setor e fornecedor sob o SKU: presentes, sem disputar */
.t .tcell .s{color:var(--ink-4);}
.t .tcell .s .tag{opacity:.9;}

/* ---------- 17. custo de tela ----------
   O navegador calcula estilo e layout de cada nó em cada redesenho. Numa lista
   longa isso vira a maior parte do tempo. `content-visibility` deixa ele pular
   as linhas que estão fora da janela — elas continuam na página e na busca do
   navegador, só não são medidas enquanto ninguém as vê. */
.t tbody tr{content-visibility:auto;contain-intrinsic-size:auto 46px;}
.cards .pcard{content-visibility:auto;contain-intrinsic-size:auto 250px;}

/* ícone no lugar de emoji dentro de texto: mesma altura da linha, sem pular a base */
.ic-inline{display:inline-flex;vertical-align:-2px;color:var(--ink-4);}
.ic-inline svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.ic-inline.amber{color:var(--amber);}
.aviso svg,.modal-h h2 svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 15px;}

/* chip com ícone: sem tamanho definido o SVG assume o padrão do navegador e
   estoura o botão (foi o que aconteceu no "Editar na tabela") */
.chip svg{width:13px;height:13px;flex:0 0 13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.chip{white-space:nowrap;}

/* tamanho de partida de qualquer ícone — rede de segurança contra ícone gigante */
.ic{width:16px;height:16px;flex:0 0 auto;}
/* o botão de recolher o menu pede um ícone menor que o padrão */
.rail-toggle svg{width:14px;height:14px;stroke-width:2;}
.shell.mini .rail-toggle svg{width:13px;height:13px;}

/* ============================================================================
   18. DADOS → DECISÃO → AÇÃO
   A última coluna é onde a leitura vira comando. Em repouso ela quase não
   aparece: um fundo de 1% só para o olho saber onde a linha termina. Quando a
   linha recebe o cursor, o realce não se espalha — vai para a ação.
   ============================================================================ */
:root{
  --linha-hover:var(--neutral-50);   /* véu da linha inteira: presença, não destaque */
  --acao-bg:var(--surface-2);       /* repouso: quase imperceptível */
  --acao-bg-hover:var(--teal-soft); /* hover: o passo a mais, só aqui */
}
.t td.col-acao,.t th.col-acao,
.t-dem td:last-child,.t-dem th:last-child{
  border-left:1px solid var(--line);
  background:var(--acao-bg);
  transition:background .12s ease;
}
/* a linha toda recebe um véu; a coluna de ação recebe um degrau a mais */
.t tbody tr:hover{background:var(--linha-hover);}
.t tbody tr:hover td.col-acao,
.t-dem tbody tr:hover td:last-child{background:var(--acao-bg-hover);}
/* e o botão da linha ganha corpo — sem acender, só firmando o contorno */
.t tbody tr:hover .btn.primary{border-color:var(--acao);color:var(--acao);
  background:var(--surface);box-shadow:var(--sh-1);}
.t tbody tr:hover .ic-btn{color:var(--ink-3);}
/* o título da coluna acompanha os botões que estão embaixo dele */
.t th.col-acao,.t-dem th:last-child{text-align:center;}
.t td.col-acao{text-align:center;}

/* ============================================================================
   19. BUSCA RÁPIDA — Ctrl + K
   ============================================================================ */
.cmd-ov{align-items:flex-start;padding-top:12vh;background:var(--veu-modal);}
.cmd{width:min(620px,94vw);background:var(--surface);border-radius:var(--r-lg);
  box-shadow:var(--el3);overflow:hidden;animation:pop .16s cubic-bezier(.2,.8,.3,1);}
.cmd-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2);}
.cmd-h svg{width:17px;height:17px;stroke:var(--ink-4);fill:none;stroke-width:1.9;flex:0 0 17px;}
.cmd-inp{flex:1;border:0;outline:0;background:transparent;font-size:var(--fs-h2);color:var(--ink);}
.cmd-inp::placeholder{color:var(--ink-4);}
/* o painel inteiro já é o contexto do foco: um anel coral em volta do campo
   parece aviso de erro */
.cmd-inp:focus,.cmd-inp:focus-visible{box-shadow:none;outline:0;}
.cmd-b{max-height:52vh;overflow:auto;padding:6px;}
.cmd-grupo{font-size:var(--fs-nano);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-4);padding:10px 10px 4px;}
.cmd-it{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;border:0;background:none;
  padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;transition:background .1s;}
.cmd-it:hover{background:var(--surface-2);}
.cmd-it.on{background:var(--teal-soft);}
.cmd-it .sku{font-size:var(--fs-dado);font-weight:600;color:var(--ink);flex:0 0 auto;}
.cmd-d{font-size:var(--fs-corpo);color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cmd-m{font-size:var(--fs-micro);color:var(--ink-4);flex:0 0 auto;white-space:nowrap;}
.cmd-vazio{padding:26px 16px;text-align:center;font-size:var(--fs-corpo);color:var(--ink-3);line-height:1.7;}
.cmd-f{padding:9px 16px;border-top:1px solid var(--line-2);background:var(--surface-2);
  font-size:var(--fs-micro);color:var(--ink-4);display:flex;align-items:center;gap:5px;}
kbd{font-family:'IBM Plex Mono',monospace;font-size:var(--fs-nano);background:var(--surface);
  border:1px solid var(--line);border-bottom-width:2px;border-radius:var(--r-1);padding:1px 5px;color:var(--ink-3);}
.kbd-atalho{margin-left:6px;}
@media (max-width:900px){ .kbd-atalho{display:none;} }

/* linha ativa pelas setas: a mesma cor do hover, com um traço à esquerda para
   quem está navegando sem o mouse não perder onde está */
.t tbody tr.linha-ativa{background:var(--linha-hover);box-shadow:inset var(--marca-lat) var(--coral);}
.t tbody tr.linha-ativa td.col-acao,.t-dem tbody tr.linha-ativa td:last-child{background:var(--acao-bg-hover);}
.t tbody tr.linha-ativa .btn.primary{border-color:var(--acao);color:var(--acao);background:var(--surface);}
.kv dt kbd{font-size:var(--fs-micro);}

/* ---------- 18. menos molduras ----------
   O sistema tinha virado caixa dentro de caixa: card → cabeçalho → filtros →
   card → resumo → tabela → card. Cada moldura pede atenção, e somadas elas
   pesavam mais que o conteúdo que seguravam.

   Regra desta camada: **uma superfície por assunto**. O que é auxiliar — resumo,
   indicadores, filtros, passos — deixa de ser caixa e passa a se separar por
   **espaço e fio**. Moldura fica reservada para o conteúdo principal: a tabela,
   a lista, o formulário. O que importa tem de parecer maior que o que o contém. */

/* --- indicadores: quatro caixas viram uma faixa --- */
.kpis{gap:0;margin-bottom:var(--sp4);padding:var(--sp1) 0 var(--sp3);border-bottom:1px solid var(--line);}
.kpi{background:none;border:0;border-radius:0;box-shadow:none;padding:2px var(--sp5) 2px var(--sp4);}
.kpi + .kpi{border-left:1px solid var(--line);}
/* a barra colorida à esquerda era a borda do cartão; sem cartão ela vira
   um ponto junto do rótulo, que é onde o olho já está */
.kpi::before{display:none;}
.kpi .lbl{display:flex;align-items:center;gap:6px;}
.kpi.red .lbl::before,.kpi.amber .lbl::before,.kpi.teal .lbl::before{
  content:'';width:6px;height:6px;border-radius:50%;background:var(--slate);flex:none;}
.kpi.red .lbl::before{background:var(--red);}
.kpi.amber .lbl::before{background:var(--amber);}
.kpi.teal .lbl::before{background:var(--teal);}
.kpi .val{font-size:var(--fs-num-g);margin-top:5px;}
.kpi .foot{margin-top:4px;}
/* clicável sem virar cartão: o realce é o fundo, não o relevo */
/* apagar de vez é a única ação da tela que não volta: o botão diz isso na cor */
.ic-btn.perigo:hover{background:var(--red-soft);color:var(--red);border-color:var(--perigo-borda);}
.ic-btn.perigo:hover svg{stroke:var(--red);}
.kpi.clicavel{border-radius:0;}
.kpi.clicavel:hover{background:none;transform:none;box-shadow:inset 0 -2.5px 0 var(--line);}
.kpi.clicavel.ativo:hover{box-shadow:inset 0 -2.5px 0 var(--coral);}
.kpi.ativo{background:none;outline:0;box-shadow:inset 0 -2.5px 0 var(--coral);}
.kpi.ativo .lbl{color:var(--ink);}
@media (max-width:720px){ .kpi + .kpi{border-left:0;border-top:1px solid var(--line-2);} }

/* --- a instrução do topo da Demanda: faixa, não caixa --- */
.faixa-topo{display:flex;gap:var(--sp5);align-items:center;flex-wrap:wrap;
  padding:0 var(--sp1) var(--sp4);margin-bottom:var(--sp4);border-bottom:1px solid var(--line);}
.faixa-topo h3{margin:0 0 5px;font-size:var(--fs-h2);font-weight:700;letter-spacing:-.01em;}

/* --- resumo dos Pedidos: faixa, não caixa --- */
.resumo{background:none;border:0;box-shadow:none;border-radius:0;
  padding:0 var(--sp1) var(--sp3);margin-bottom:var(--sp3);border-bottom:1px solid var(--line);}
.res-num{font-size:var(--fs-h2);}
.res-num b{font-size:var(--fs-num-g);}


/* --- tarefas: uma pilha de cartões vira uma lista --- */
.lista-tarefas .tarefa{border:0;border-radius:0;box-shadow:none;margin:0;
  padding:var(--sp4) var(--sp5);}
.lista-tarefas .tarefa + .tarefa{border-top:1px solid var(--line-2);}
/* urgente continua se destacando — pelo fundo e por um traço, não por outra moldura */
.lista-tarefas .tarefa.urg{background:none;box-shadow:inset var(--marca-lat) var(--perigo);}
/* fio claro some dentro do vermelho: duas urgentes seguidas viravam um bloco só */
.lista-tarefas .tarefa.urg + .tarefa.urg{border-top-color:var(--line-2);}

/* --- área de arquivo: três alvos tracejados viram um só, dividido --- */
.dz{background:none;}
.dz-grupo{border:1.5px dashed var(--line);border-radius:var(--r-md);overflow:hidden;}
.dz-grupo .dz{border:0;border-radius:0;margin:0 !important;padding:var(--sp4) var(--sp3);}
.dz-grupo .dz + .dz{border-top:1px solid var(--line-2);}
/* empilhados, três alvos verticais gastavam meia tela para dizer três nomes.
   Como linha — ícone, nome, botão — cada um cabe numa faixa. */
.dz-grupo .dz{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;
  column-gap:var(--sp4);align-items:center;text-align:left;}
.dz-grupo .dz > svg{grid-column:1;grid-row:1 / 3;width:22px;height:22px;}
.dz-grupo .dz > div:nth-of-type(1){grid-column:2;grid-row:1;margin:0 !important;}
.dz-grupo .dz > div:nth-of-type(2){grid-column:2;grid-row:2;margin:2px 0 0 !important;}
.dz-grupo .dz > button{grid-column:3;grid-row:1 / 3;justify-self:end;}
@media (max-width:560px){
  .dz-grupo .dz{grid-template-columns:auto 1fr;}
  .dz-grupo .dz > button{grid-column:2;grid-row:3;justify-self:start;margin-top:8px;}
}
.dz-grupo .dz.over,.dz.over{background:var(--teal-soft);}
.dz-grupo .dz:hover{background:var(--surface-2);}

/* ---------- 22. o número é o filtro ----------
   A faixa de cima e a fileira de chips diziam a mesma coisa duas vezes. Agora o
   próprio número filtra — mas nem todo bloco da faixa é clicável, então a
   diferença entre "faz" e "informa" precisa se ver sem ler (gramática da 7.36). */
.kpi.clicavel{cursor:pointer;}
.kpi.clicavel .lbl,.kpi.clicavel .val{transition:color .12s;}
.kpi.clicavel:hover .val{color:var(--coral);}
.kpi.clicavel:hover .lbl{color:var(--ink-2);}
.kpi.clicavel:focus-visible{outline:2px solid var(--ring);outline-offset:-2px;border-radius:var(--r-sm);}
/* o ativo fica com um traço embaixo, como aba selecionada — sem virar caixa */
.kpi.ativo .val{color:var(--ink);}
/* o que só informa fica encostado no fim da faixa, atrás de um fio mais forte,
   para ninguém tentar clicar no que não clica */
.kpi-info{display:contents;}
.kpi-info > .kpi{border-left:2px solid var(--line);padding-left:var(--sp5);}
.kpi-info > .kpi .val{color:var(--ink-2);}
@media (max-width:720px){ .kpi-info > .kpi{border-left:0;border-top:2px solid var(--line);padding-left:var(--sp4);} }

/* ---------- 23. insumos ---------- */
.t-ins td{vertical-align:top;}
.ins-sit{font-size:var(--fs-nano);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:2px;color:var(--ink-4);}
.ins-sit.s-erro,.ins-sit.s-perigo{color:var(--perigo);}
.ins-sit.s-aviso,.ins-sit.s-atencao{color:var(--atencao);}
.ins-sit.s-ok{color:var(--ok);}
.ins-sit.s-off,.ins-sit.s-neutro{color:var(--ink-4);}
/* o tipo do movimento informa: ponto e cor, sem caixa (gramática da 7.36) */
.ins-mov{font-size:var(--fs-micro);font-weight:700;display:inline-flex;align-items:center;gap:5px;color:var(--ink-2);}
.ins-mov::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ink-4);}
.ins-mov.m-ok{color:var(--teal);} .ins-mov.m-ok::before{background:var(--teal);}
.ins-mov.m-saida{color:var(--red);} .ins-mov.m-saida::before{background:var(--red);}
.ins-mov.m-ajuste{color:var(--bege);} .ins-mov.m-ajuste::before{background:var(--bege);}

/* cabeçalho da nota: os dados que vieram do XML, sem virar formulário */
.nf-resumo{display:flex;flex-wrap:wrap;gap:var(--sp5) var(--sp6);padding:var(--sp4) 0 var(--sp4);
  margin-bottom:var(--sp4);border-bottom:1px solid var(--line);}
.nf-resumo > div{display:flex;flex-direction:column;gap:2px;}
.nf-resumo span{font-size:var(--fs-nano);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-4);}
.nf-resumo b{font-size:var(--fs-h3);}
/* item sem vínculo é o que trava a entrada: precisa saltar aos olhos na tabela */
tr.nf-pend td:first-child{box-shadow:inset var(--marca-lat) var(--perigo);}
tr.nf-pend{background:var(--red-soft);}
/* palpite entra na conta, mas fica marcado até alguém olhar */
tr.nf-palpite td:first-child{box-shadow:inset var(--marca-lat) var(--amber);}
tr.nf-palpite{background:var(--amber-soft);}
/* escolher insumo digitando: a lista só existe depois que a pessoa escreve */
.pick{position:relative;}
.pick-in{width:100%;font-size:var(--fs-apoio);padding:7px 10px;}
.pick-sel{display:flex;align-items:center;gap:7px;min-width:0;font-size:var(--fs-dado);line-height:1.3;}
.pick-sel b{font-weight:700;flex:1 1 auto;min-width:0;}
.pick-sel em{font-style:normal;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--fs-micro);color:var(--ink-4);flex:0 0 auto;}
.pick-x{border:0;background:none;color:var(--ink-3);font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;padding:2px 5px;flex:0 0 auto;border-radius:var(--r-1);text-decoration:underline;text-underline-offset:2px;}
.pick-x:hover{background:var(--surface-2);color:var(--coral);}
.pick-lista{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3);box-shadow:var(--sh-3);max-height:250px;overflow:auto;padding:4px;}
.pick-op{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;border:0;border-radius:var(--r-2);background:none;cursor:pointer;font:inherit;font-size:var(--fs-dado);color:var(--ink);}
.pick-op:hover,.pick-op.on{background:var(--teal-soft);}
.pick-op b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pick-op em{font-style:normal;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--fs-micro);color:var(--ink-4);flex:0 0 auto;}
.pick-op i{font-style:normal;font-size:var(--fs-micro);color:var(--ink-4);margin-left:auto;flex:0 0 auto;}
.pick-novo{color:var(--teal);font-weight:700;border-top:1px solid var(--line-2);border-radius:0 0 var(--r-2) var(--r-2);margin-top:2px;}
.pick-vazio{padding:8px 9px;font-size:var(--fs-apoio);color:var(--ink-3);}
/* campo que existe mas não se edita: parece dado, não parece formulário */
.travado{display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px dashed var(--line);border-radius:var(--r-3);background:var(--surface-2);color:var(--ink-2);font-size:var(--fs-corpo);min-height:38px;}
.travado svg{width:13px;height:13px;stroke:var(--ink-4);fill:none;stroke-width:1.8;flex:0 0 auto;margin-left:auto;}
/* recibo: duas vias na mesma folha, com a linha de recorte no meio */
.recibo{border:1px solid var(--line);border-radius:var(--r-2);padding:10px 12px;break-inside:avoid;}
.rec-cab{display:flex;gap:10px;align-items:flex-start;border-bottom:1.5px solid var(--rail);padding-bottom:7px;margin-bottom:8px;}
.rec-cab .lg{width:34px;height:34px;background:var(--logo) center/contain no-repeat;flex:0 0 auto;}
.rec-cab h1{font-size:var(--fs-corpo);margin:0;letter-spacing:.04em;}
.rec-sub{font-size:var(--fs-nano);color:var(--neutro);}
.rec-n{margin-left:auto;text-align:right;font-size:var(--fs-nano);font-family:var(--mono);white-space:nowrap;}
.rec-n span{color:var(--neutro);font-family:inherit;}
.rec-txt{font-size:var(--fs-micro);line-height:1.55;margin:0 0 8px;}
.rec-val{font-size:var(--fs-apoio);}
.rec-t{width:100%;border-collapse:collapse;font-size:var(--fs-nano);margin-bottom:7px;}
.rec-t th{background:var(--surface-2);text-align:left;padding:3px 5px;font-size:var(--pr-corpo);letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line);}
.rec-t td{padding:3px 5px;border-bottom:1px solid var(--line-2);}
.rec-tot{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:var(--fs-nano);padding:5px 0;border-top:1px solid var(--line);}
.rec-apagar{margin-left:auto;font-size:var(--fs-apoio);}
.rec-ass{display:flex;gap:26px;margin-top:16px;font-size:var(--fs-nano);}
.rec-ass > div{flex:1;}
.rec-ass i{color:var(--neutro);font-style:normal;font-size:var(--pr-apoio);}
.rec-linha{display:block;border-top:1px solid var(--rail);margin-bottom:3px;height:22px;}
.rec-corte{border-top:1.5px dashed var(--ink-3);text-align:center;margin:12px 0;position:relative;}
.rec-corte span{position:relative;top:-7px;background:var(--surface);padding:0 8px;font-size:var(--pr-apoio);color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;}
/* tabela larga de folha: cabe no A4 sem cortar coluna */
.folha table.f-larga{table-layout:fixed;width:100%;border-collapse:collapse;}
.folha table.f-larga th,.folha table.f-larga td{padding:3px 4px;font-size:var(--fs-nano);overflow:hidden;text-overflow:ellipsis;}
.folha .cab-rep th{background:var(--surface-2);font-size:var(--fs-nano);text-align:left;letter-spacing:.05em;}
.folha .bloco-proc{margin-bottom:12px;break-inside:avoid;}
.folha .th-vu{font-weight:400;font-size:var(--pr-apoio);color:var(--neutro);letter-spacing:0;text-transform:none;margin-top:1px;}
.folha tr.sub-proc td{background:var(--surface-2);border-top:1.2px solid var(--rail);font-size:var(--fs-nano);font-weight:700;padding:4px;}
/* campo onde se digita dinheiro: o R$ fica à vista, não só no cabeçalho */
.rs-in{position:relative;display:block;}
.rs-in::before{content:"R$";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:var(--fs-micro);color:var(--ink-4);pointer-events:none;font-weight:600;}
.rs-in > input{padding-left:34px !important;text-align:right;}
/* permissões: uma lista para ler, não um formulário para preencher */
.perms{border:1px solid var(--line);border-radius:var(--r-3);padding:12px 14px;margin:4px 0 12px;background:var(--surface-2);}
.perms-h{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.perms-h > span:first-child{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;}
.perms-n{font-size:var(--fs-apoio);color:var(--ink-4);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
.perms-h .btn{margin-left:auto;}
.perms-g{padding-top:9px;margin-top:9px;border-top:1px solid var(--line-2);}
.perms-g:first-of-type{border-top:0;margin-top:0;}
.perms-gt{font-size:var(--fs-apoio);font-weight:700;color:var(--ink-2);margin-bottom:6px;}
.perm{display:flex;gap:9px;align-items:flex-start;cursor:pointer;padding:5px 0;}
.perm span{min-width:0;}
.perm b{display:block;font-size:var(--fs-corpo);font-weight:600;line-height:1.35;}
.perm i{display:block;font-style:normal;font-size:var(--fs-apoio);color:var(--ink-3);line-height:1.45;margin-top:1px;}
.perm:hover b{color:var(--teal);}
/* relatório de produção */
.rel-bases{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 4px;}
.rel-base{flex:1 1 200px;min-width:190px;text-align:left;background:none;border:1px solid var(--line);border-radius:var(--r);padding:10px 13px;cursor:pointer;transition:border-color .13s,background .13s;}
.rel-base:hover{border-color:var(--line);background:var(--surface-2);}
.rel-base.on{border-color:var(--teal);box-shadow:inset 0 -2.5px 0 var(--coral);background:var(--surface);}
.rel-base .rb-t{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;}
.rel-base.on .rb-t{color:var(--teal);}
.rel-base .rb-v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--fs-num-g);font-weight:700;line-height:1.25;color:var(--ink);}
.rel-base .rb-f{font-size:var(--fs-apoio);color:var(--ink-3);}
.rel-esc{display:flex;gap:4px;justify-content:flex-end;margin:3px 0 0;}
.rel-esc button{border:0;background:none;font-size:var(--fs-nano);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-4);cursor:pointer;padding:1px 4px;border-radius:var(--r-1);font-weight:700;}
.rel-esc button:hover{background:var(--surface-2);color:var(--ink-2);}
.rel-esc button.on{color:var(--teal);background:var(--teal-soft);}
.rel-alvo{font-weight:700;}
.rel-tot{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:13px 16px;border-top:1px solid var(--line-2);font-size:var(--fs-corpo);}
.rel-tot b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--fs-h2);}
.rel-cons{padding:0 16px 16px;}
.rel-cons h4{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:16px 0 3px;padding-top:14px;border-top:1px solid var(--line-2);}
tr.apagada td{opacity:.55;}
td.sumido{color:var(--ink-4);}
tr.linha-alerta td:first-child{box-shadow:inset var(--marca-lat) var(--perigo);}
.nf-total{display:flex;align-items:baseline;gap:var(--sp3);margin-top:var(--sp4);
  padding-top:var(--sp3);border-top:1px solid var(--line);}
.nf-total span{font-size:var(--fs-dado);color:var(--ink-3);}
.nf-total b{margin-left:auto;font-size:var(--fs-h1);font-family:var(--mono);}
/* agrupamento por fornecedor dentro de um card: faixa, não outro cartão (7.46) */
.sub-h{display:flex;align-items:baseline;gap:10px;padding:var(--sp3) var(--sp5) var(--sp2);
  font-size:var(--fs-apoio);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);
  border-top:1px solid var(--line);background:var(--surface-2);}
.sub-h span{font-size:var(--fs-micro);font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3);}
/* fornecedor: o que ele manda, sem virar cartão dentro de cartão (7.46) */
.forn-bloco{padding:10px 0 12px;border-bottom:1px solid var(--line-2);}
.forn-bloco:last-of-type{border-bottom:0;}
.forn-listas{display:flex;flex-direction:column;gap:5px;margin:8px 0 0 2px;padding-left:11px;border-left:2px solid var(--line-2);}
.forn-listas > div{font-size:var(--fs-apoio);line-height:1.55;color:var(--ink-3);}
.forn-listas span{font-size:var(--fs-nano);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-4);display:block;}
.forn-listas b{font-weight:600;color:var(--ink-2);display:inline-block;margin-right:10px;}
.forn-listas em{font-family:var(--mono);font-style:normal;font-size:var(--fs-micro);color:var(--ink-4);}
.forn-listas i{font-style:normal;color:var(--ink-4);}

/* ---------- 21. o menu chamando ----------
   Os contadores do menu são informação de fundo — quantos pedidos existem,
   quantos produtos. Um item pode pedir cor e um ponto ao lado do nome quando o
   número deixa de ser estatística e vira cobrança: é o 4º elemento (`tom`) do
   array `nav`. Nenhuma aba usa isso hoje — quem usava era Notificações, que saiu
   na v8.92. O mecanismo fica de pé, porque é genérico e o render já o lê.
   Um só item chamando atenção continua sendo silêncio; três seriam ruído. */
.nav button.chamando{color:var(--em-cor);}
.nav button.chamando svg{opacity:.95;}
.nav .badge.alerta{background:var(--coral);color:var(--em-coral);font-weight:800;
  padding:1px 8px;border-radius:var(--r-pill);min-width:20px;text-align:center;}
.nav .badge.urg{background:var(--perigo);color:var(--em-perigo);font-weight:800;
  padding:1px 8px;border-radius:var(--r-pill);min-width:20px;text-align:center;}
.nav button.on .badge.alerta,.nav button.on .badge.urg{background:var(--coral);color:var(--em-cor);}
.nav button:hover .badge.alerta,.nav button:hover .badge.urg{color:var(--em-cor);}
/* o ponto: some no menu recolhido, onde o próprio contador já vira ponto */
.nav button.chamando > span:first-of-type::after{
  content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--coral);margin-left:7px;vertical-align:middle;}
.nav button.chamando.urg > span:first-of-type::after{background:var(--perigo);}
.shell.mini .nav button.chamando > span:first-of-type::after{display:none;}
.shell.mini .nav .badge.alerta,.shell.mini .nav .badge.urg{background:var(--coral);color:var(--em-coral);}
.shell.mini .nav .badge.urg{background:var(--perigo);}

/* o percurso: hora à esquerda, fio no meio, o que aconteceu à direita */
.tl{display:flex;flex-direction:column;}
.tl-l{display:grid;grid-template-columns:52px 16px 1fr;align-items:start;gap:0;}
.tl-h{font-size:var(--fs-apoio);color:var(--ink-3);padding-top:1px;text-align:right;padding-right:10px;}
.tl-p{position:relative;justify-self:center;width:16px;align-self:stretch;}
.tl-p::before{content:'';position:absolute;left:50%;top:6px;width:7px;height:7px;margin-left:-3.5px;
  border-radius:50%;background:var(--teal2);}
.tl-p::after{content:'';position:absolute;left:50%;top:15px;bottom:-2px;width:1px;margin-left:-.5px;background:var(--line);}
.tl-l:last-child .tl-p::after{display:none;}
.tl-l:last-child .tl-p::before{background:var(--teal);}
.tl-t{font-size:var(--fs-corpo);padding:0 0 14px 6px;line-height:1.45;}
.tl-t span{color:var(--ink-3);font-size:var(--fs-apoio);}
.tl-d{display:block;font-size:var(--fs-micro);color:var(--ink-4);}

.aviso code{font-family:var(--mono);font-size:var(--fs-micro);background:var(--neutro-fundo);padding:2px 5px;border-radius:var(--r-1);display:inline-block;margin-top:4px;}

textarea.inp{resize:vertical;font-family:inherit;line-height:1.55;}

/* --- indicadores dentro de janela: nunca cartão dentro de cartão --- */
.modal .kpis{background:var(--surface-2);border-radius:var(--r-md);padding:var(--sp3) 0;border-bottom:0;}
.modal .kpi .val{font-size:var(--fs-num-g);}

/* ---------- cópia de teste ---------- */
/* Duas telas iguais lado a lado, uma valendo e outra não, é receita de erro.
   A cópia fica com a moldura e a etiqueta o tempo todo. Nada disso ocupa
   espaço: é tudo fixo por cima, para não encolher a tabela. */
body[data-teste]::after{content:"";position:fixed;inset:0;border:3px solid var(--atencao);pointer-events:none;z-index:9998;}
body[data-teste]::before{content:"CÓPIA DE TESTE · NÃO VAI PARA O APP";position:fixed;left:0;bottom:0;z-index:9999;
  background:var(--atencao);color:var(--em-cor);font:700 10px/1 var(--ff-titulo);letter-spacing:.11em;padding:7px 11px;border-radius:0 var(--r-3) 0 0;pointer-events:none;}
@media print{body[data-teste]::after,body[data-teste]::before{display:none;}}


/* ---------- Relatórios ---------- */
/* KPI que leva a algum lugar precisa parecer que leva: cursor, realce e foco. */
.kpi-btn{text-align:left;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:inherit;color:inherit;
  transition:border-color .12s,transform .12s;}
.kpi-btn:hover{border-color:var(--teal2);transform:translateY(-1px);}
.kpi-btn:focus-visible{outline:2px solid var(--coral);outline-offset:2px;}
.kpi-btn.red .val{color:var(--red);} .kpi-btn.amber .val{color:var(--amber);}
.rolar-x{overflow-x:auto;}
svg.graf{width:100%;min-width:520px;height:auto;display:block;}
.gr-linha{stroke:var(--line-2);stroke-width:1;}
.gr-eixo{font-size:var(--fs-nano);fill:var(--ink-3);font-family:var(--mono,ui-monospace,monospace);}
.gr-valor{font-size:var(--fs-micro);font-weight:700;fill:var(--ink-2);}
/* série de dados usa a paleta normal. Verde e vermelho ficam guardados para
   quando o NÚMERO significar bom ou ruim — e isso depende da métrica: atraso
   caindo é ótimo, e pintar de vermelho porque "caiu" seria mentir. */
.gr-barra{fill:var(--teal2);} .gr-barra.gr-max{fill:var(--acao);}
.barra-mini{height:8px;background:var(--line-2);border-radius:var(--r-pill);overflow:hidden;}
.barra-mini i{display:block;height:100%;background:var(--teal2);border-radius:var(--r-pill);}
.rel-aten{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:var(--fs-corpo);color:var(--ink-2);}

/* ---------- escolher em lote nas Datas festivas ---------- */
.fest-op{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:var(--r-2);cursor:pointer;font-size:var(--fs-dado);}
.fest-op:hover{background:var(--surface-2);}
.fest-op.on{background:var(--teal-soft);}
.fest-op .sku{flex:0 0 auto;}
.fest-op span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------- o aviso que fecha o ciclo ---------- */
.toast.passo{align-items:flex-start;}
.toast.passo span{display:flex;flex-direction:column;gap:2px;}
.toast.passo b{font-weight:700;}
.toast.passo i{font-style:normal;opacity:.82;font-size:var(--fs-apoio);}
.resumo.tem-excecao{border-left:3px solid var(--red);padding-left:13px;}
/* número que não é clicável não finge que é */
.kpi:not(.clicavel):not(.kpi-btn){cursor:default;}
.kpi:not(.clicavel):not(.kpi-btn):hover{border-color:var(--line);transform:none;}
/* botão que espera alguma coisa: diz o que espera, em vez de dar erro depois */
.btn.espera{background:var(--surface-2);color:var(--ink-3);border:1px dashed var(--line);cursor:help;font-weight:600;}
.btn.espera:hover{background:var(--surface-2);border-color:var(--ink-4);color:var(--ink-2);}

/* ---------- a fila de avisos do topo ----------
   Teto de altura é o ponto: o primeiro abre inteiro, o resto vira uma linha.
   Quatro banners empilhados empurram o conteúdo para fora da primeira dobra —
   e tela empurrada para baixo é tela onde ninguém lê nada. */
.avs{margin-bottom:16px;display:flex;flex-direction:column;gap:1px;
  border-radius:var(--r-3);overflow:hidden;box-shadow:var(--el1);}
.avs-i{display:flex;gap:14px;align-items:flex-start;padding:15px 18px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-3);}
.avs-i + .avs-i,.avs-mais + .avs-i{border-radius:0;margin-top:-1px;}
.avs-ic{display:grid;place-items:center;width:30px;height:30px;border-radius:var(--r-3);flex:0 0 30px;}
.avs-ic svg{width:16px;height:16px;stroke-width:2;}
.avs-corpo{flex:1;min-width:0;}
.avs-nivel{font-size:var(--fs-nano);font-weight:800;letter-spacing:.11em;margin-bottom:3px;}
.avs-tit{margin:0;font-size:var(--fs-h3);font-weight:700;letter-spacing:-.01em;line-height:1.35;}
.avs-txt{margin:4px 0 0;font-size:var(--fs-corpo);color:var(--ink-2);line-height:1.6;}
.avs-acoes{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:170px;}
.avs-acoes .btn{justify-content:center;}
/* crítico: a barra grossa é o sinal, não o fundo inteiro tingido */
.avs-critico{border-color:var(--perigo-borda);box-shadow:inset var(--marca-lat) var(--perigo);}
.avs-critico .avs-ic{background:var(--perigo-fundo);color:var(--perigo);}
.avs-critico .avs-nivel{color:var(--perigo);}
.avs-atencao{border-color:var(--atencao-borda);box-shadow:inset var(--marca-lat) var(--atencao);}
.avs-atencao .avs-ic{background:var(--atencao-fundo);color:var(--atencao);}
.avs-atencao .avs-nivel{color:var(--atencao);}
.avs-info{box-shadow:inset var(--marca-lat) var(--neutro-fraco);}
.avs-info .avs-ic{background:var(--neutro-fundo);color:var(--neutro);}
.avs-info .avs-nivel{color:var(--neutro);}
/* a dobra */
.avs-mais{display:flex;align-items:center;gap:9px;width:100%;padding:10px 18px;background:var(--surface-2);
  border:1px solid var(--line);border-top:0;text-align:left;font-size:var(--fs-dado);font-weight:700;color:var(--ink-2);
  border-radius:0 0 var(--r-3) var(--r-3);margin-top:-1px;}
.avs-mais:hover{background:var(--neutro-fundo);}
.avs-mais svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
.avs-mais-t{font-weight:500;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* recolhido: uma linha por aviso */
.avs-min{padding:10px 18px;align-items:center;gap:10px;border-top:0;border-radius:0;}
.avs-min:last-child{border-radius:0 0 var(--r-3) var(--r-3);}
.avs-ponto{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--neutro-fraco);}
.avs-min.avs-atencao .avs-ponto{background:var(--atencao);}
.avs-min.avs-critico .avs-ponto{background:var(--perigo);}
.avs-tit-min{font-size:var(--fs-corpo);font-weight:700;}
.avs-txt-min{font-size:var(--fs-dado);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* o crachá da cópia de teste */
/* Reconhecível sem gritar: quem já sabe onde está só precisa confirmar de
   relance, e a borda laranja da tela + a faixa do rodapé já são o alarme. */
.cracha-teste{font-size:var(--fs-nano);font-weight:800;letter-spacing:.09em;padding:3px 9px;border-radius:var(--r-2);
  background:var(--atencao-fundo);color:var(--atencao-texto);border:1px solid var(--atencao-borda);line-height:1.5;}
.cracha-teste:hover{background:var(--atencao);color:var(--em-cor);border-color:var(--atencao);}
@media(max-width:720px){
  .avs-i{flex-direction:column;gap:11px;padding:14px 15px;}
  .avs-acoes{min-width:0;flex-direction:row;flex-wrap:wrap;}
  .avs-acoes .btn{flex:1 1 auto;}
  .avs-ic{display:none;}
  .avs-min{flex-direction:row;padding:10px 15px;}
  .avs-txt-min{display:none;}
  .avs-mais-t{display:none;}
}

/* ============================================================================
   PEDIDOS — a densidade da tabela de referência
   ----------------------------------------------------------------------------
   A linha de Pedidos carrega um registro inteiro: número, prioridade, data,
   SKU, curva, setor, processo, quem está com a peça, quantidade, cinco números
